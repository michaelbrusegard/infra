name: Hermes Android Image

'on':
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - packages/hermes-android-image/**
      - packages/hermes-android-companion/**
      - .github/workflows/hermes-android-image.yaml
  pull_request:
    paths:
      - packages/hermes-android-image/**
      - packages/hermes-android-companion/**
      - .github/workflows/hermes-android-image.yaml

concurrency:
  group: android-image-digest-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  ANDROID_IMAGE_REF: ghcr.io/michaelbrusegard/hermes-android

jobs:
  build-and-publish:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    # The digest-bump deploy key bypasses the main ruleset, so it lives in
    # the image-bump environment (main only) and never reaches PR runs.
    environment: ${{ github.event_name != 'pull_request' && 'image-bump' || '' }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ssh-key: ${{ github.event_name != 'pull_request' && secrets.IMAGE_BUMP_DEPLOY_KEY || '' }}

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet
          docker system prune --all --force

      - name: Build image
        env:
          SIGNING_KEY_PK8_B64: ${{ secrets.HERMES_ANDROID_SIGNING_KEY_PK8_B64 }}
          SIGNING_CERT_X509_PEM_B64: ${{ secrets.HERMES_ANDROID_SIGNING_CERT_X509_PEM_B64 }}
        run: |
          secrets=()
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            test -n "$SIGNING_KEY_PK8_B64"
            test -n "$SIGNING_CERT_X509_PEM_B64"
            (
              umask 077
              printf '%s' "$SIGNING_KEY_PK8_B64" | base64 --decode >"$RUNNER_TEMP/signing.pk8"
              printf '%s' "$SIGNING_CERT_X509_PEM_B64" | base64 --decode >"$RUNNER_TEMP/signing.pem"
            )
            secrets=(
              --secret "id=signing-key,src=$RUNNER_TEMP/signing.pk8"
              --secret "id=signing-cert,src=$RUNNER_TEMP/signing.pem"
            )
          fi
          # The source host for the Android headers answers 503 under load.
          for attempt in 1 2 3; do
            if docker build "${secrets[@]}" \
              --file packages/hermes-android-image/Dockerfile \
              --tag "$ANDROID_IMAGE_REF:ci" \
              packages; then
              exit 0
            fi
            sleep $((attempt * 60))
          done
          exit 1

      - name: Boot Android
        timeout-minutes: 15
        run: |
          # Android needs binder, which some runner kernels ship in a package
          # outside the default set.
          if ! sudo modprobe binder_linux devices=binder,hwbinder,vndbinder; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends "linux-modules-extra-$(uname -r)"
            sudo modprobe binder_linux devices=binder,hwbinder,vndbinder
          fi
          state=$(mktemp -d)
          mkdir -p "$state/adb" "$state/companion"
          docker run --rm --entrypoint sh --volume "$state:/opt/android" "$ANDROID_IMAGE_REF:ci" -euc '
            HOME=/tmp adb keygen /opt/android/adb/adbkey
            od -An -tx1 -N 32 /dev/urandom | tr -d " \n" >/opt/android/companion/auth-token
          '
          docker run --detach --name android --privileged \
            --volume "$state:/opt/android" "$ANDROID_IMAGE_REF:ci"
          for _ in $(seq 1 120); do
            if sudo grep -q '"state":"ready"' "$state/status/accessibility.json" 2>/dev/null; then
              docker exec android adb -s 127.0.0.1:5555 shell getprop ro.build.fingerprint
              docker stop --time 40 android
              test "$(docker inspect --format '{{.State.ExitCode}}' android)" = 143
              exit 0
            fi
            sleep 5
          done
          sudo cat "$state"/status/*.json || true
          docker logs --tail 200 android
          exit 1

      - name: Publish image
        id: publish
        if: github.event_name != 'pull_request'
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          sha_image="$ANDROID_IMAGE_REF:sha-$GIT_SHA"
          docker tag "$ANDROID_IMAGE_REF:ci" "$sha_image"
          docker tag "$ANDROID_IMAGE_REF:ci" "$ANDROID_IMAGE_REF:main"
          push_output=$(docker push "$sha_image")
          printf '%s\n' "$push_output"
          docker push "$ANDROID_IMAGE_REF:main"
          digest=$(printf '%s\n' "$push_output" | \
            sed -n 's/^.*digest: \(sha256:[0-9a-f]\{64\}\).*$/\1/p' | tail -1)
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sync main before digest update
        if: github.event_name != 'pull_request'
        run: git pull --rebase origin main

      - name: Update Android image references
        if: github.event_name != 'pull_request'
        env:
          ANDROID_DIGEST: ${{ steps.publish.outputs.digest }}
          GIT_SHA: ${{ github.sha }}
        run: |
          image="$ANDROID_IMAGE_REF:sha-$GIT_SHA@$ANDROID_DIGEST"
          manifest=gitops/espresso/apps/hermes-agent/statefulset.yaml
          sed -i -E "s|(image: )$ANDROID_IMAGE_REF:[^[:space:]]+|\1$image|" "$manifest"
          test "$(grep -c "image: $image\$" "$manifest")" = 2

      - name: Commit image digest update
        if: github.event_name != 'pull_request'
        run: |
          .github/scripts/commit-to-main.sh "chore(hermes-agent): update android image digest [skip ci]" \
            gitops/espresso/apps/hermes-agent/statefulset.yaml
