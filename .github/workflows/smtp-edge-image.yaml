name: SMTP Edge Image

'on':
  push:
    branches:
      - main
    paths:
      - flake.lock
      - packages/smtp-edge/**
      - packages/stalwart-oss/**
      - .github/workflows/smtp-edge-image.yaml
  pull_request:
    paths:
      - flake.lock
      - packages/smtp-edge/**
      - packages/stalwart-oss/**
      - .github/workflows/smtp-edge-image.yaml
  workflow_dispatch:

concurrency:
  group: image-digests-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REF: ghcr.io/michaelbrusegard/smtp-edge
  RECORD: packages/smtp-edge/qualification.json
  STATEFULSET: gitops/espresso/apps/smtp-edge/statefulset.yaml

jobs:
  qualify-and-publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    # The digest-bump deploy key bypasses the main ruleset, so it lives in
    # the image-bump environment (main only) and never reaches PR runs.
    environment: ${{ github.event_name != 'pull_request' && 'image-bump' || '' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ssh-key: ${{ github.event_name != 'pull_request' && secrets.IMAGE_BUMP_DEPLOY_KEY || '' }}

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            max-jobs = 1
            cores = 2

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      # Builds use the flake's nixpkgs without loading the private secrets flake.
      - name: Build image
        id: image
        run: |
          nix build --impure --out-link result-image --expr '
            let
              lock = builtins.fromJSON (builtins.readFile ./flake.lock);
              upstream = builtins.getFlake ("github:NixOS/nixpkgs/" + lock.nodes.${lock.nodes.root.inputs.nixpkgs}.locked.rev);
            in upstream.legacyPackages.x86_64-linux.callPackage ./packages/smtp-edge/image.nix {}
          '
          # Hash the archive's config JSON; Docker's .Id depends on the engine.
          config_path=$(tar -xOf result-image manifest.json | jq -er '.[0].Config')
          config_id="sha256:$(tar -xOf result-image "$config_path" | sha256sum | cut -d ' ' -f 1)"
          echo "config_id=$config_id" >> "$GITHUB_OUTPUT"
          # A push with an unchanged image has nothing to roll out. Pull
          # requests still qualify, since fixture or backend changes matter.
          if [[ "$GITHUB_EVENT_NAME" == push && "$config_id" == "$(jq -r .dockerConfigId "$RECORD")" ]]; then
            echo "Image $config_id is already qualified and deployed"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Stalwart fixture backend
        id: stalwart
        if: steps.image.outputs.changed == 'true'
        run: |
          server=$(nix build --impure --no-link --print-out-paths --expr '
            let
              lock = builtins.fromJSON (builtins.readFile ./flake.lock);
              upstream = builtins.getFlake ("github:NixOS/nixpkgs/" + lock.nodes.${lock.nodes.root.inputs.nixpkgs}.locked.rev);
            in upstream.legacyPackages.x86_64-linux.callPackage ./packages/stalwart-oss/default.nix { nativeScim = true; }
          ')
          echo "binary=$server/bin/stalwart" >> "$GITHUB_OUTPUT"

      - name: Qualify image
        id: qualify
        if: steps.image.outputs.changed == 'true'
        env:
          BINARY: ${{ steps.stalwart.outputs.binary }}
        run: |
          # The native fixture runs in an unprivileged user namespace inside
          # Docker, which Ubuntu's AppArmor userns restriction would refuse.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          tag=$(tar -xOf result-image manifest.json | jq -er '.[0].RepoTags | if length == 1 then .[0] else error("expected one tag") end')
          docker load < result-image
          image_id=$(docker image inspect "$tag" --format '{{.Id}}')
          rev=$(jq -r '.nodes[.nodes.root.inputs.nixpkgs].locked.rev' flake.lock)
          nix shell "github:NixOS/nixpkgs/$rev#"{python3,bind,iproute2,openssl,util-linux} -c \
            python3 packages/smtp-edge/qualify_postfix.py --image "$image_id" --binary "$BINARY" \
            > summary.json || true
          cat summary.json
          evidence=$(jq -r .evidence summary.json)
          mkdir evidence
          sudo cp -r "$evidence"/. evidence/
          sudo rm -f evidence/approved-stalwart
          sudo chown -R "$(id -u):$(id -g)" evidence
          jq -e '.qualified == true' summary.json > /dev/null
          {
            echo "tag=$tag"
            echo "image_id=$image_id"
          } >> "$GITHUB_OUTPUT"

      - name: Retain qualification evidence
        if: always() && steps.image.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: smtp-edge-qualification
          path: evidence/
          retention-days: 30

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.event_name != 'pull_request' && steps.image.outputs.changed == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish image
        id: publish
        if: github.event_name != 'pull_request' && steps.image.outputs.changed == 'true'
        env:
          TAG: ${{ steps.qualify.outputs.tag }}
        run: |
          target="$IMAGE_REF:${TAG#*:}-sha-$GITHUB_SHA"
          docker tag "$TAG" "$target"
          docker push "$target"
          # RepoDigests after push holds the registry manifest digest, not .Id.
          digest=$(docker image inspect "$target" --format '{{json .RepoDigests}}' \
            | jq -er --arg prefix "$IMAGE_REF@" '[.[] | select(startswith($prefix))] | unique | if length == 1 then .[0] | sub(".*@"; "") else error("expected one registry digest") end')
          {
            echo "target=$target"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"

      - name: Sync main before digest update
        if: github.event_name != 'pull_request' && steps.image.outputs.changed == 'true'
        run: git pull --rebase origin main

      - name: Update image reference and qualification record
        if: github.event_name != 'pull_request' && steps.image.outputs.changed == 'true'
        env:
          CONFIG_ID: ${{ steps.image.outputs.config_id }}
          IMAGE_ID: ${{ steps.qualify.outputs.image_id }}
          TARGET: ${{ steps.publish.outputs.target }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          from datetime import date
          from pathlib import Path
          import json
          import os
          import re

          env = os.environ
          statefulset = Path(env["STATEFULSET"])
          content, replacements = re.subn(
              r"(?m)^(\s*image:\s*)ghcr\.io/michaelbrusegard/smtp-edge[:@].*$",
              lambda match: f"{match.group(1)}{env['TARGET']}@{env['DIGEST']}",
              statefulset.read_text(),
          )
          if replacements != 1:
              raise SystemExit("Failed to update the smtp-edge image reference")
          statefulset.write_text(content)

          report = json.loads(Path("evidence/report.json").read_text())
          native = report["nativeReport"]
          record_path = Path(env["RECORD"])
          record = json.loads(record_path.read_text())
          record.pop("docker29ManifestId", None)
          record.update({
              "fixtureQualified": True,
              "qualifiedAt": date.today().isoformat(),
              "sourceRevision": env["GITHUB_SHA"],
              "evidence": env["RUN_URL"],
              "registryManifestDigest": env["DIGEST"],
              "dockerConfigId": env["CONFIG_ID"],
              "dockerImageId": env["IMAGE_ID"],
              "postfixVersion": report["versions"]["postfix"],
              "curlVersion": report["versions"]["curl"].split()[1],
              "stalwartBinarySha256": report["binarySha256"],
              "nativeStages": len(native["tests"]),
              "deliveredMessages": sum(1 for m in native["messages"].values() if m.get("deliveredTo")),
              "postfixQueueEmpty": report["finalPostfixQueue"] == "",
              "sourceSha256": report["sourceSha256"],
          })
          record_path.write_text(json.dumps(record, indent=2) + "\n")
          PY

      - name: Commit image digest update
        if: github.event_name != 'pull_request' && steps.image.outputs.changed == 'true'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add "$STATEFULSET" "$RECORD"
          git commit -m "chore(smtp-edge): update image digest [skip ci]"
          git pull --rebase origin main
          git push
