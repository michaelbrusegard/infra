name: Update Agents

'on':
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

concurrency:
  group: update-agents
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-26.04
    # The digest-bump deploy key bypasses the main ruleset, so it lives in
    # the image-bump environment (main only).
    environment: image-bump
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ssh-key: ${{ secrets.IMAGE_BUMP_DEPLOY_KEY }}

      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SECRETS_DEPLOY_KEY }}

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      # llm-agents.nix rebuilds the harnesses daily; t3code tracks nightly.
      - name: Update agent inputs
        run: nix flake update llm-agents t3code

      - name: Update vite-plus
        run: packages/vite-plus/update.sh

      - name: Validate hosts
        run: |
          git diff --quiet -- flake.lock packages/vite-plus && exit 0
          nix build --no-link .#packages.x86_64-linux.vite-plus
          nix eval --raw .#nixosConfigurations.forte.config.system.build.toplevel.drvPath
          nix eval --raw .#darwinConfigurations.lungo.system.drvPath

      - name: Commit agent update
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if git diff --quiet -- flake.lock packages/vite-plus; then
            exit 0
          fi

          git add flake.lock packages/vite-plus
          git commit -m "chore(flake): update agent harnesses"
          git pull --rebase origin main
          git push
