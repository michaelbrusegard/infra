name: Publish Qualified Stalwart Image

'on':
  workflow_dispatch:
  push:
    branches:
      - publish/stalwart-native-scim
    paths:
      - .github/workflows/stalwart-publish.yaml

concurrency:
  group: stalwart-native-scim-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      # Promote the artifact that passed isolated acceptance, not a rebuild.
      SOURCE_RUN_ID: '34312211846'
      SOURCE_REVISION: 82499f471d613cfdba93e7c5d488df4f2534bcc0
      ARTIFACT_NAME: stalwart-image-diagnostic
      ARCHIVE_SHA256: becc6a51256c3c9784a5a8629e50aadba8b0297608f09e8f0196abcb5e39e18c
      IMAGE: ghcr.io/michaelbrusegard/stalwart-native-scim
    steps:
      - name: Verify candidate source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > source-run.json
          test "$(jq -r .head_sha source-run.json)" = "$SOURCE_REVISION"
          test "$(jq -r .head_repository.full_name source-run.json)" = "$GITHUB_REPOSITORY"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: candidate
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Verify the tested archive and container entrypoint
        run: |
          echo "$ARCHIVE_SHA256  candidate/result" | sha256sum --check
          docker load < candidate/result
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true stalwart-native-scim:0.16.21 --version
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish qualified source and artifact tag
        run: |
          # A source revision may produce multiple byte-distinct builds.
          target="$IMAGE:sha-$SOURCE_REVISION-${ARCHIVE_SHA256:0:12}"
          docker tag stalwart-native-scim:0.16.21 "$target"
          docker push "$target"
          docker image inspect "$target" --format '{{json .RepoDigests}}'
