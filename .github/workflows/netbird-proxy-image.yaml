name: NetBird Proxy Image

'on':
  push:
    branches: [main]
    paths:
      - packages/netbird-proxy-image/**
      - .github/workflows/netbird-proxy-image.yaml
  pull_request:
    paths:
      - packages/netbird-proxy-image/**
      - .github/workflows/netbird-proxy-image.yaml
  workflow_dispatch:

concurrency:
  group: image-digests-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REF: ghcr.io/michaelbrusegard/netbird-proxy

jobs:
  build-and-publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    environment: ${{ github.event_name != 'pull_request' && 'image-bump' || '' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ssh-key: ${{ github.event_name != 'pull_request' && secrets.IMAGE_BUMP_DEPLOY_KEY || '' }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Test image promotion
        run: python3 -m unittest discover -s packages/netbird-proxy-image -v
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and test the patched proxy
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: packages/netbird-proxy-image
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE_REF }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=netbird-proxy
          cache-to: type=gha,scope=netbird-proxy,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Check image can be pulled without registry credentials
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # The workload has no imagePullSecret. Do not promote an image it
          # cannot pull; a new GHCR package needs its visibility set once.
          docker --config "$(mktemp -d)" manifest inspect "$IMAGE_REF@$DIGEST" >/dev/null
      - name: Promote the tested image digest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          GIT_SHA: ${{ github.sha }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git pull --rebase origin main
          # A queued build must never replace a newer patch with older code.
          git diff --exit-code "$GIT_SHA" -- packages/netbird-proxy-image .github/workflows/netbird-proxy-image.yaml
          python3 packages/netbird-proxy-image/update-manifest.py \
            "$IMAGE_REF:sha-$GIT_SHA@$DIGEST"
          manifest=gitops/espresso/apps/netbird/agent-network.yaml
          if git diff --quiet -- "$manifest"; then exit 0; fi
          git add "$manifest"
          git commit -m 'fix(netbird): deploy proxy with image routing support'
          git pull --rebase origin main
          git diff --exit-code "$GIT_SHA" -- packages/netbird-proxy-image .github/workflows/netbird-proxy-image.yaml
          git push
