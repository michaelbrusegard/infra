name: Update Flake Inputs
'on':
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
concurrency:
  group: update-flake
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-26.04
    # The digest-bump deploy key bypasses the main ruleset, so it lives in
    # the image-bump environment (main only).
    environment: image-bump
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ssh-key: ${{ secrets.IMAGE_BUMP_DEPLOY_KEY }}
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SECRETS_DEPLOY_KEY }}
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      # update-inputs tries every input at once and falls back to one at a
      # time, holding back any that stop a host from evaluating. update-gate is
      # the bar for the result: formatting, every flake check including the
      # router VM tests, every host, and a full build of the x86 servers, since
      # evaluating a host does not prove its packages build. An input that
      # fails the gate is found and held back as well. Nothing but this job
      # stands between the update and main, because the push below skips CI.
      - name: Update inputs
        id: update
        shell: bash
        env:
          VERIFY_JOBS: 3
          UPDATE_JOBS: 3
        run: |
          set -uo pipefail
          status=0
          nix run .#update-inputs -- --required nixpkgs --gate 'nix run .#update-gate' || status=$?
          if ((status != 0 && status != 2)); then
            exit "$status"
          fi
          echo "held-back=$((status == 2))" >> "$GITHUB_OUTPUT"
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Host closures can hold values from the private secrets flake, so only
      # the names of what changed are published.
      - name: Summarise what changes on the hosts
        if: steps.update.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '```'
            nix run .#diff-hosts -- --names-only HEAD
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the update
        if: steps.update.outputs.changed == 'true'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        shell: bash
        run: |
          set -euo pipefail
          git commit --all -m "chore(flake): update inputs"
          # The agent offers the read-only infra-secrets key before the
          # checkout's image-bump key, and GitHub rejects the push with it.
          unset SSH_AUTH_SOCK
          git pull --rebase origin main
          git push
      - name: Fail when an input was held back
        if: steps.update.outputs.held-back == '1'
        run: |
          echo "::error::Some inputs could not be updated. The summary lists them and why."
          exit 1
