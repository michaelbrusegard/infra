name: Postgres Image

'on':
  push:
    branches:
      - main
    paths:
      - gitops/espresso/infrastructure/controllers/postgres/Dockerfile
      - .github/workflows/postgres-image.yaml
  pull_request:
    paths:
      - gitops/espresso/infrastructure/controllers/postgres/Dockerfile
      - .github/workflows/postgres-image.yaml

concurrency:
  group: image-digests-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: michaelbrusegard/postgres
  IMAGE_REF: ghcr.io/michaelbrusegard/postgres

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.IMAGE_BUMP_DEPLOY_KEY }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        if: github.event_name == 'push'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: gitops/espresso/infrastructure/controllers/postgres
          file: gitops/espresso/infrastructure/controllers/postgres/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_REF }}:main
            ${{ env.IMAGE_REF }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Sync main before digest update
        if: github.event_name == 'push'
        run: git pull --rebase origin main

      - name: Update Postgres image reference
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          GIT_SHA: ${{ github.sha }}
          IMAGE_REF: ${{ env.IMAGE_REF }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("gitops/espresso/infrastructure/controllers/postgres/statefulset.yaml")
          image = f"{os.environ['IMAGE_REF']}:sha-{os.environ['GIT_SHA']}@{os.environ['DIGEST']}"
          content = path.read_text()
          updated, replacements = re.subn(
              r"(?m)^\s*image:\s*ghcr\.io/michaelbrusegard/postgres:.*$",
              f"          image: {image}",
              content,
          )
          if replacements != 1:
              raise SystemExit("Failed to update Postgres image reference")
          path.write_text(updated)
          PY

      - name: Commit image digest update
        if: github.event_name == 'push'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if git diff --quiet -- gitops/espresso/infrastructure/controllers/postgres/statefulset.yaml; then
            exit 0
          fi

          git add gitops/espresso/infrastructure/controllers/postgres/statefulset.yaml
          git commit -m "chore(postgres): update image digest [skip ci]"
          git pull --rebase origin main
          git push
