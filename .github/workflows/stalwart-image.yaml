name: Stalwart Native SCIM Candidate

'on':
  workflow_dispatch:
  push:
    branches:
      - publish/stalwart-native-scim
    paths:
      - flake.lock
      - packages/stalwart-oss/**
      - .github/workflows/stalwart-image.yaml

concurrency:
  group: stalwart-native-scim-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            max-jobs = 1
            cores = 2
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      - name: Build without loading the private secrets flake
        run: |
          nix build --impure --out-link result --expr '
            let
              lock = builtins.fromJSON (builtins.readFile ./flake.lock);
              upstream = builtins.getFlake ("github:NixOS/nixpkgs/" + lock.nodes.nixpkgs.locked.rev);
              pkgs = upstream.legacyPackages.x86_64-linux;
            in pkgs.callPackage ./packages/stalwart-oss/image.nix { nativeScim = true; }
          '
      - name: Check container entrypoint
        run: |
          sha256sum result
          docker load < result
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true stalwart-native-scim:0.16.21 --version
      - name: Retain candidate for acceptance and separate promotion
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stalwart-native-scim-image
          path: result
          compression-level: 0
          retention-days: 7
