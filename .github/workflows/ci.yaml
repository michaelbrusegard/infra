name: CI
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  filter:
    runs-on: ubuntu-24.04
    outputs:
      nix: ${{ steps.filter.outputs.nix }}
      gitops: ${{ steps.filter.outputs.gitops }}
      tofu: ${{ steps.filter.outputs.tofu }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        id: filter
        with:
          filters: |
            nix:
              - '**/*.nix'
              - 'flake.nix'
              - 'flake.lock'
              - '.github/workflows/ci.yaml'
            gitops:
              - 'gitops/**'
              - '.github/workflows/ci.yaml'
            tofu:
              - '**/*.tf'
              - '**/.terraform.lock.hcl'
              - '.github/workflows/ci.yaml'
  code-quality:
    needs: filter
    if: needs.filter.outputs.nix == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.NIX_SECRETS_DEPLOY_KEY }}
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
      - name: Check code quality (Nix)
        run: nix fmt -- --fail-on-change --no-cache
      - name: Validate flake (Nix)
        run: nix flake check --show-trace
  validate-nix:
    needs: filter
    if: needs.filter.outputs.nix == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: lungo
            os: macos-latest
          - host: ristretto
            os: ubuntu-24.04
          - host: macchiato
            os: ubuntu-24.04
          - host: espresso-0
            os: ubuntu-24.04
          - host: leggero
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.NIX_SECRETS_DEPLOY_KEY }}
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
      - name: Evaluate Host (NixOS)
        if: runner.os == 'Linux'
        run: nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel --dry-run
      - name: Evaluate Host (Darwin)
        if: runner.os == 'macOS'
        run: nix build .#darwinConfigurations.${{ matrix.host }}.system --dry-run
  validate-kubernetes:
    needs: filter
    if: needs.filter.outputs.gitops == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
      - name: Install Tools
        run: nix profile install nixpkgs#kustomize nixpkgs#kubeconform
      - name: Validate Kubernetes Manifests
        run: |
          kustomize build gitops/espresso | \
          kubeconform \
            -strict \
            -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -verbose
  validate-tofu:
    needs: filter
    if: needs.filter.outputs.tofu == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        tofu-dir:
          - gitops/espresso/tofu/honcho
          - gitops/espresso/tofu/netbird
    env:
      OPENTOFU_VERSION: 1.11.5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: opentofu/setup-opentofu@9745e0c822f844dbd421dbf4d2c9cbb21ed56ab7 # v2.0.1
        with:
          tofu_version: ${{ env.OPENTOFU_VERSION }}
          tofu_wrapper: false
      - name: Check OpenTofu formatting
        run: tofu -chdir=${{ matrix.tofu-dir }} fmt -check
      - name: Initialize OpenTofu
        run: tofu -chdir=${{ matrix.tofu-dir }} init -backend=false
      - name: Validate OpenTofu
        run: tofu -chdir=${{ matrix.tofu-dir }} validate
