name: CI
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Read-only, plus the pull request file list that the paths filter queries.
permissions:
  contents: read
  pull-requests: read
jobs:
  filter:
    runs-on: ubuntu-26.04
    outputs:
      nix: ${{ steps.filter.outputs.nix }}
      gitops: ${{ steps.filter.outputs.gitops }}
      tofu: ${{ steps.filter.outputs.tofu }}
      builds: ${{ steps.filter.outputs.builds }}
      tofu-dirs: ${{ steps.list-tofu.outputs.dirs }}
      hosts: ${{ steps.list-hosts.outputs.hosts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            nix:
              - 'modules/**'
              - 'overlays/**'
              - 'packages/**/*.nix'
              - 'packages/ai-images/**'
              - 'flake.nix'
              - 'flake.lock'
              - '.github/workflows/ci.yaml'
            gitops:
              - 'gitops/**'
              - 'packages/ai-images/**'
              - 'packages/cliproxy-plugins/**'
              - 'modules/flake/check-app.nix'
              - '.github/workflows/ci.yaml'
            builds:
              - 'flake.lock'
              - 'overlays/**'
            tofu:
              - '**/*.tf'
              - '**/.terraform.lock.hcl'
              - 'gitops/espresso/infrastructure/configs/stalwart-tofu/kustomization.yaml'
              - '.github/workflows/ci.yaml'
      - id: list-tofu
        run: |
          dirs=$(printf '%s\n' gitops/espresso/tofu/*/ | sed 's:/$::' | jq -R . | jq -sc .)
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        if: steps.filter.outputs.nix == 'true'
        with:
          ssh-private-key: ${{ secrets.SECRETS_DEPLOY_KEY }}
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: steps.filter.outputs.nix == 'true'
      - id: list-hosts
        if: steps.filter.outputs.nix == 'true'
        run: echo "hosts=$(nix eval --json .#ci.hosts)" >> "$GITHUB_OUTPUT"
  # Formatting, lint rules, the secret scan and every sandboxed test live in
  # the flake's checks, so any file in the repository can fail this job. It
  # builds the checks directly because nix flake check would also evaluate
  # every host, which validate-nix-hosts already does in parallel.
  code-quality:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SECRETS_DEPLOY_KEY }}
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Run the flake checks
        shell: bash
        run: |
          set -euo pipefail
          checks=$(nix eval --json .#checks.x86_64-linux --apply builtins.attrNames |
            jq -r '.[] | ".#checks.x86_64-linux.\(.)"')
          [[ -n $checks ]] || { echo "::error::No flake checks found"; exit 1; }
          xargs nix build --no-link --print-build-logs --show-trace <<<"$checks"
      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: nix run .#check-commits -- "HEAD^1..HEAD^2"
  validate-nix-hosts:
    needs: filter
    if: needs.filter.outputs.nix == 'true'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.filter.outputs.hosts) }}
    name: validate-nix-hosts (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SECRETS_DEPLOY_KEY }}
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Evaluate host
        env:
          ATTRIBUTE: ${{ matrix.attribute }}
        run: nix build ".#$ATTRIBUTE" --dry-run
      # Values in a host's closure can come from the private secrets flake, so
      # the summary names what changed without printing it. HEAD^1 is the base
      # the merge commit was built on, which origin/main may have moved past.
      - name: Summarise what changes on the host
        if: github.event_name == 'pull_request'
        env:
          HOST: ${{ matrix.name }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '```'
            nix run .#diff-hosts -- --names-only HEAD^1 "$HOST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
  # Evaluating a host does not prove its packages compile, and a lock or
  # overlay change is where they stop. Pushes to main are left out: the update
  # workflow runs the same build before it pushes.
  build-servers:
    needs: filter
    if: needs.filter.outputs.builds == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SECRETS_DEPLOY_KEY }}
      - name: Free disk for the server builds
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift \
            /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
          sudo docker image prune --all --force >/dev/null
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Build the deployed x86 servers
        env:
          HOSTS: ${{ needs.filter.outputs.hosts }}
        run: |
          jq -r '.[] | select(.deployed and .system == "x86_64-linux") | ".#\(.attribute)"' <<<"$HOSTS" |
            xargs nix build --no-link
  validate-kubernetes:
    needs: filter
    if: needs.filter.outputs.gitops == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SECRETS_DEPLOY_KEY }}
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Run the checks that need network access
        run: nix run .#check
      - name: Summarise what changes on the cluster
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '```'
            nix run .#diff-manifests -- HEAD^1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Test AI usage dashboard and ClickHouse permissions
        run: python3 gitops/espresso/tests/ai-usage.py
      - name: Test conversation normalisation against ClickHouse
        run: nix develop --command python3 gitops/espresso/tests/llm-conversations.py
      - name: Test Hermes tunnel routing and fail-closed behavior
        # Root avoids Ubuntu's unprivileged user-namespace restrictions. The
        # test changes routes only inside disposable network namespaces.
        run: sudo python3 gitops/espresso/apps/hermes-agent/tests/netbird_egress_smoke.py -v
  validate-tofu-stacks:
    needs: filter
    if: needs.filter.outputs.tofu == 'true'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        tofu-dir: ${{ fromJSON(needs.filter.outputs.tofu-dirs) }}
    env:
      OPENTOFU_VERSION: 1.11.5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.OPENTOFU_VERSION }}
          tofu_wrapper: false
      # The registry still points trozz/pocketid at the pre-transfer GitHub
      # name, which 404s since a fork took it. Remove once upstream fixes
      # https://github.com/pocket-id/terraform-provider/issues/127.
      - name: Install Pocket ID provider mirror
        if: matrix.tofu-dir == 'gitops/espresso/tofu/pocket-id' || matrix.tofu-dir == 'gitops/espresso/tofu/hermes-auth'
        run: |
          version=2.5.0
          archive="terraform-provider-pocketid_${version}_linux_amd64.zip"
          mirror="$RUNNER_TEMP/provider-mirror/registry.opentofu.org/trozz/pocketid"
          mkdir -p "$mirror"
          curl -fsSL "https://github.com/pocket-id/terraform-provider/releases/download/v${version}/${archive}" -o "$mirror/$archive"
          echo "640d92b75f5c9e0d18e888eb8248eb61560e01b611898286b3d852e952d4d2f2  $mirror/$archive" | sha256sum -c -
          cat > "$RUNNER_TEMP/tofurc" <<EOF
          provider_installation {
            filesystem_mirror {
              path    = "$RUNNER_TEMP/provider-mirror"
              include = ["registry.opentofu.org/trozz/pocketid"]
            }
            direct {
              exclude = ["registry.opentofu.org/trozz/pocketid"]
            }
          }
          EOF
          echo "TF_CLI_CONFIG_FILE=$RUNNER_TEMP/tofurc" >> "$GITHUB_ENV"
      # michaelbrusegard/stalwart is not on the public registry. The cluster
      # installs it from this image, so validate against the same build.
      - name: Install Stalwart provider mirror
        if: matrix.tofu-dir == 'gitops/espresso/tofu/stalwart'
        run: |
          image=$(grep -m1 -o 'ghcr.io/michaelbrusegard/terraform-provider-stalwart:[^ ]*' \
            gitops/espresso/infrastructure/configs/stalwart-tofu/kustomization.yaml)
          mkdir -p "$RUNNER_TEMP/provider-mirror"
          docker create --name stalwart-provider "$image" /bin/cp >/dev/null
          docker cp stalwart-provider:/provider-mirror/. "$RUNNER_TEMP/provider-mirror/"
          docker rm stalwart-provider >/dev/null
          cat > "$RUNNER_TEMP/tofurc" <<EOF
          provider_installation {
            filesystem_mirror {
              path    = "$RUNNER_TEMP/provider-mirror"
              include = ["registry.opentofu.org/michaelbrusegard/stalwart"]
            }
            direct {
              exclude = ["registry.opentofu.org/michaelbrusegard/stalwart"]
            }
          }
          EOF
          echo "TF_CLI_CONFIG_FILE=$RUNNER_TEMP/tofurc" >> "$GITHUB_ENV"
      - name: Check OpenTofu formatting
        env:
          STACK: ${{ matrix.tofu-dir }}
        run: tofu -chdir="$STACK" fmt -check
      - name: Initialize OpenTofu
        env:
          STACK: ${{ matrix.tofu-dir }}
        run: tofu -chdir="$STACK" init -backend=false
      - name: Validate OpenTofu
        env:
          STACK: ${{ matrix.tofu-dir }}
        run: tofu -chdir="$STACK" validate
  # Branch protection requires these stable names, not matrix-expanded names.
  validate-nix:
    needs: [filter, validate-nix-hosts]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Require all relevant host checks
        env:
          FILTER_RESULT: ${{ needs.filter.result }}
          REQUESTED: ${{ needs.filter.outputs.nix }}
          MATRIX_RESULT: ${{ needs.validate-nix-hosts.result }}
        run: |
          case "$FILTER_RESULT:$REQUESTED:$MATRIX_RESULT" in
            success:true:success|success:false:skipped) ;;
            *) echo "::error::Host checks did not complete as required"; exit 1 ;;
          esac
  validate-tofu:
    needs: [filter, validate-tofu-stacks]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Require all relevant OpenTofu checks
        env:
          FILTER_RESULT: ${{ needs.filter.result }}
          REQUESTED: ${{ needs.filter.outputs.tofu }}
          MATRIX_RESULT: ${{ needs.validate-tofu-stacks.result }}
        run: |
          case "$FILTER_RESULT:$REQUESTED:$MATRIX_RESULT" in
            success:true:success|success:false:skipped) ;;
            *) echo "::error::OpenTofu checks did not complete as required"; exit 1 ;;
          esac
