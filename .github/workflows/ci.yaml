name: CI
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  filter:
    runs-on: ubuntu-24.04
    outputs:
      nix: ${{ steps.filter.outputs.nix }}
      gitops: ${{ steps.filter.outputs.gitops }}
      tofu: ${{ steps.filter.outputs.tofu }}
      tofu-dirs: ${{ steps.list-tofu.outputs.dirs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            nix:
              - '**/*.nix'
              - 'flake.nix'
              - 'flake.lock'
              - '.github/workflows/ci.yaml'
            gitops:
              - 'gitops/**'
              - '.github/workflows/ci.yaml'
            tofu:
              - '**/*.tf'
              - '**/.terraform.lock.hcl'
              - '.github/workflows/ci.yaml'
      - id: list-tofu
        run: |
          dirs=$(printf '%s\n' gitops/espresso/tofu/*/ | sed 's:/$::' | jq -R . | jq -sc .)
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
  code-quality:
    needs: filter
    if: needs.filter.outputs.nix == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SECRETS_DEPLOY_KEY }}
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      - name: Check code quality (Nix)
        run: nix fmt -- --fail-on-change --no-cache
      - name: Validate flake (Nix)
        run: nix flake check --show-trace
  validate-nix:
    needs: filter
    if: needs.filter.outputs.nix == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: lungo
            os: macos-latest
          - host: ristretto
            os: ubuntu-24.04
          - host: forte
            os: ubuntu-24.04
          - host: macchiato
            os: ubuntu-24.04
          - host: espresso-0
            os: ubuntu-24.04
          - host: leggero
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SECRETS_DEPLOY_KEY }}
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      - name: Evaluate Host (NixOS)
        if: runner.os == 'Linux'
        run: nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel --dry-run
      - name: Evaluate Host (Darwin)
        if: runner.os == 'macOS'
        run: nix build .#darwinConfigurations.${{ matrix.host }}.system --dry-run
  validate-kubernetes:
    needs: filter
    if: needs.filter.outputs.gitops == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      - name: Install Tools
        run: nix profile install nixpkgs#kustomize nixpkgs#kubeconform
      - name: Validate Kubernetes Manifests
        run: |
          kustomize build gitops/espresso | \
          kubeconform \
            -strict \
            -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -verbose
  validate-tofu:
    needs: filter
    if: needs.filter.outputs.tofu == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        tofu-dir: ${{ fromJSON(needs.filter.outputs.tofu-dirs) }}
    env:
      OPENTOFU_VERSION: 1.11.5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.OPENTOFU_VERSION }}
          tofu_wrapper: false
      - name: Check OpenTofu formatting
        run: tofu -chdir=${{ matrix.tofu-dir }} fmt -check
      - name: Initialize OpenTofu
        run: tofu -chdir=${{ matrix.tofu-dir }} init -backend=false
      - name: Validate OpenTofu
        run: tofu -chdir=${{ matrix.tofu-dir }} validate
