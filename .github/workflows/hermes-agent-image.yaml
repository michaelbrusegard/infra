name: Hermes Agent Image

'on':
  push:
    branches:
      - main
    paths:
      - packages/hermes-agent-image/**
      - .github/workflows/hermes-agent-image.yaml
  pull_request:
    paths:
      - packages/hermes-agent-image/**
      - .github/workflows/hermes-agent-image.yaml

concurrency:
  group: image-digests-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_REF: ghcr.io/michaelbrusegard/hermes-agent

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.IMAGE_BUMP_DEPLOY_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: NousResearch/hermes-agent
          ref: 3ef6bbd201263d354fd83ec55b3c306ded2eb72a
          path: .upstream/hermes-agent
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Apply local Hermes patches
        working-directory: .upstream/hermes-agent
        run: git apply --check --unidiff-zero ../../packages/hermes-agent-image/stateless-mattermost.patch && git apply --unidiff-zero ../../packages/hermes-agent-image/stateless-mattermost.patch

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.event_name == 'push'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build declarative image
        run: |
          nix build --impure --expr '
            let
              upstream = builtins.getFlake (toString ./.upstream/hermes-agent);
              system = builtins.currentSystem;
              pkgs = upstream.inputs.nixpkgs.legacyPackages.${system};
              hermes-agent = upstream.packages.${system}.minimal.override {
                extraDependencyGroups = [ "hindsight" "messaging" "web" ];
              };
            in
            pkgs.callPackage ./packages/hermes-agent-image {
              inherit hermes-agent;
            }
          '

      - name: Smoke test image
        run: |
          docker load < result
          docker run --rm "$IMAGE_REF:nix" --help
          for binary in blogwatcher-cli flux gh helm himalaya jq jupyter jupyter-live-kernel kubectl nano-pdf node ocrmypdf pdftoppm sed stern tesseract tofu yq; do
            docker run --rm --entrypoint "$binary" "$IMAGE_REF:nix" --help >/dev/null
          done
          docker run --rm --entrypoint agent-browser "$IMAGE_REF:nix" --version
          docker run --rm --env HOME=/tmp --entrypoint chromium "$IMAGE_REF:nix" --version
          docker run --rm --env HOME=/tmp --entrypoint soffice "$IMAGE_REF:nix" --version
          docker run --rm --entrypoint python3 "$IMAGE_REF:nix" -c '
          import defusedxml
          import docx
          import markitdown
          import nbformat
          import PIL
          import pymupdf
          import pymupdf4llm
          import pptx
          import requests
          import websocket
          import youtube_transcript_api
          '
          docker run --rm --entrypoint node "$IMAGE_REF:nix" -e '
          for (const name of ["pptxgenjs", "react", "react-dom/server", "react-icons/fa", "sharp"]) {
            require(name);
          }
          '
          docker run --rm --entrypoint bash "$IMAGE_REF:nix" -c '
            for binary in apk apt-get nix-env npm pip uv; do
              if command -v "$binary" >/dev/null; then
                echo "unexpected runtime package manager: $binary" >&2
                exit 1
              fi
            done
            if command -v opencode >/dev/null; then
              echo "unexpected excluded tool: opencode" >&2
              exit 1
            fi
          '

      - name: Publish image
        id: publish
        if: github.event_name == 'push'
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          nix profile install nixpkgs#skopeo
          registries_conf="$RUNNER_TEMP/registries.conf"
          printf '%s\n' 'unqualified-search-registries = ["docker.io"]' > "$registries_conf"
          skopeo --registries-conf "$registries_conf" copy \
            "docker-archive:result" "docker://$IMAGE_REF:sha-$GIT_SHA"
          skopeo --registries-conf "$registries_conf" copy \
            "docker-archive:result" "docker://$IMAGE_REF:main"
          digest=$(skopeo --registries-conf "$registries_conf" inspect \
            "docker://$IMAGE_REF:sha-$GIT_SHA" | jq -r .Digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sync main before digest update
        if: github.event_name == 'push'
        run: git pull --rebase origin main

      - name: Update Hermes Agent image reference
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          GIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("gitops/espresso/apps/hermes-agent/statefulset.yaml")
          image = f"{os.environ['IMAGE_REF']}:sha-{os.environ['GIT_SHA']}@{os.environ['DIGEST']}"
          content = path.read_text()
          updated, replacements = re.subn(
              r"(?m)^\s*image:\s*ghcr\.io/michaelbrusegard/hermes-agent:.*$",
              f"          image: {image}",
              content,
          )
          if replacements not in (2, 3):
              raise SystemExit("Failed to update Hermes Agent image reference")
          path.write_text(updated)
          PY

      - name: Commit image digest update
        if: github.event_name == 'push'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if git diff --quiet -- gitops/espresso/apps/hermes-agent/statefulset.yaml; then
            exit 0
          fi

          git add gitops/espresso/apps/hermes-agent/statefulset.yaml
          git commit -m "chore(hermes-agent): update image digest [skip ci]"
          git pull --rebase origin main
          git push
