name: Hermes Agent Images

'on':
  push:
    branches:
      - main
    paths:
      - flake.nix
      - flake.lock
      - packages/default.nix
      - packages/hermes-agent-image/**
      - packages/hermes-browser-image/**
      - packages/chromium-seccomp-profile/**
      - .github/workflows/hermes-agent-image.yaml
      - gitops/espresso/apps/hermes-agent/tests/*_smoke.py
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - packages/default.nix
      - packages/hermes-agent-image/**
      - packages/hermes-browser-image/**
      - packages/chromium-seccomp-profile/**
      - .github/workflows/hermes-agent-image.yaml
      - gitops/espresso/apps/hermes-agent/tests/*_smoke.py

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  AGENT_IMAGE_REF: ghcr.io/michaelbrusegard/hermes-agent
  BROWSER_IMAGE_REF: ghcr.io/michaelbrusegard/hermes-browser
  ROLLOUT_AGENT_IMAGE: "true"

jobs:
  build-and-publish:
    runs-on: ubuntu-26.04
    # The digest-bump deploy key bypasses the main ruleset, so it lives in
    # the image-bump environment (main only) and never reaches PR runs.
    environment: ${{ github.event_name != 'pull_request' && 'image-bump' || '' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ssh-key: ${{ github.event_name != 'pull_request' && secrets.IMAGE_BUMP_DEPLOY_KEY || '' }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: NousResearch/hermes-agent
          ref: fcbd1076a93841fa88855acce810e342a5b78101 # v2026.8.19
          path: .upstream/hermes-agent
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Apply local Hermes patches
        working-directory: .upstream/hermes-agent
        run: |
          git apply --check ../../packages/hermes-agent-image/hermes-v2026.8.19.patch
          git apply ../../packages/hermes-agent-image/hermes-v2026.8.19.patch
          git apply --check ../../packages/hermes-agent-image/delegation-profiles.patch
          git apply ../../packages/hermes-agent-image/delegation-profiles.patch
          install -m 0644 ../../packages/hermes-agent-image/browser_session_router.py tools/browser_session_router.py
          git add -f tools/browser_session_router.py

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        if: github.event_name == 'push'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build declarative images
        run: |
          # shellcheck disable=SC2016
          nix build --impure --out-link result-agent --expr '
            let
              upstream = builtins.getFlake (toString ./.upstream/hermes-agent);
              system = builtins.currentSystem;
              pkgs = upstream.inputs.nixpkgs.legacyPackages.${system};
              hermes-agent = upstream.packages.${system}.minimal.override {
                extraDependencyGroups = [ "hindsight" "messaging" "web" ];
              };
            in
            pkgs.callPackage ./packages/hermes-agent-image {
              inherit hermes-agent;
            }
          '
          # shellcheck disable=SC2016
          nix build --impure --out-link result-browser --expr '
            let
              upstream = builtins.getFlake (toString ./.upstream/hermes-agent);
              system = builtins.currentSystem;
              pkgs = upstream.inputs.nixpkgs.legacyPackages.${system};
            in
            pkgs.callPackage ./packages/hermes-browser-image {}
          '
          nix build --out-link result-chromium-seccomp .#chromium-seccomp-profile

      - name: Smoke test images
        run: packages/hermes-agent-image/smoke-test.sh

      - name: Publish images
        id: publish
        if: github.event_name == 'push'
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          nix profile install nixpkgs#skopeo nixpkgs#rootlesskit
          registries_conf="$RUNNER_TEMP/registries.conf"
          printf '%s\n' 'unqualified-search-registries = ["docker.io"]' > "$registries_conf"
          skopeo --registries-conf "$registries_conf" copy \
            "docker-archive:result-agent" "docker://$AGENT_IMAGE_REF:sha-$GIT_SHA"
          skopeo --registries-conf "$registries_conf" copy \
            "docker-archive:result-agent" "docker://$AGENT_IMAGE_REF:main"
          skopeo --registries-conf "$registries_conf" copy \
            "docker-archive:result-browser" "docker://$BROWSER_IMAGE_REF:sha-$GIT_SHA"
          skopeo --registries-conf "$registries_conf" copy \
            "docker-archive:result-browser" "docker://$BROWSER_IMAGE_REF:main"
          agent_digest=$(skopeo --registries-conf "$registries_conf" inspect \
            "docker://$AGENT_IMAGE_REF:sha-$GIT_SHA" | jq -r .Digest)
          browser_digest=$(skopeo --registries-conf "$registries_conf" inspect \
            "docker://$BROWSER_IMAGE_REF:sha-$GIT_SHA" | jq -r .Digest)

          # Validate with the same containerd release and overlay snapshotter
          # used by k3s. OCI unpackers accept deep dockerTools images that
          # containerd rejects while applying the overlay chain.
          containerd_dir="$RUNNER_TEMP/containerd-2.2.3"
          mkdir -p "$containerd_dir"
          curl --fail --location --silent --show-error \
            --output "$containerd_dir/containerd.tar.gz" \
            https://github.com/containerd/containerd/releases/download/v2.2.3/containerd-2.2.3-linux-amd64.tar.gz
          echo "ca26ef5138f17b847bbeeec36d4bf5e002b54d25858197a870c125d57f44d32f  $containerd_dir/containerd.tar.gz" \
            | sha256sum --check
          tar -xzf "$containerd_dir/containerd.tar.gz" -C "$containerd_dir"

          docker image rm "$AGENT_IMAGE_REF:nix" "$BROWSER_IMAGE_REF:nix" || true
          rm -f result-agent result-browser
          nix store gc

          cat > "$RUNNER_TEMP/containerd-validate.toml" <<EOF
          version = 3
          root = "$RUNNER_TEMP/containerd-root"
          state = "$RUNNER_TEMP/containerd-state"
          disabled_plugins = ["io.containerd.cri.v1.runtime", "io.containerd.cri.v1.images", "io.containerd.grpc.v1.cri", "io.containerd.server.v1.ttrpc"]

          [grpc]
            address = "$RUNNER_TEMP/containerd.sock"
            uid = 0
            gid = 0
          EOF
          cat > "$RUNNER_TEMP/validate-containerd-images" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          "$containerd_dir/bin/containerd" \
            --config "$RUNNER_TEMP/containerd-validate.toml" \
            >"$RUNNER_TEMP/containerd.log" 2>&1 &
          containerd_pid=\$!
          trap 'kill "\$containerd_pid" 2>/dev/null || true' EXIT
          for _ in \$(seq 1 100); do
            [ -S "$RUNNER_TEMP/containerd.sock" ] && break
            sleep 0.2
          done
          "$containerd_dir/bin/ctr" --address "$RUNNER_TEMP/containerd.sock" \
            images pull --snapshotter overlayfs "$AGENT_IMAGE_REF@$agent_digest"
          "$containerd_dir/bin/ctr" --address "$RUNNER_TEMP/containerd.sock" \
            images pull --snapshotter overlayfs "$BROWSER_IMAGE_REF@$browser_digest"
          EOF
          chmod +x "$RUNNER_TEMP/validate-containerd-images"
          rootlesskit --net=host "$RUNNER_TEMP/validate-containerd-images"

          echo "agent_digest=$agent_digest" >> "$GITHUB_OUTPUT"
          echo "browser_digest=$browser_digest" >> "$GITHUB_OUTPUT"

      - name: Sync main before digest update
        if: github.event_name == 'push'
        run: git pull --rebase origin main

      - name: Update Hermes image references
        if: github.event_name == 'push'
        env:
          AGENT_DIGEST: ${{ steps.publish.outputs.agent_digest }}
          BROWSER_DIGEST: ${{ steps.publish.outputs.browser_digest }}
          GIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("gitops/espresso/apps/hermes-agent/statefulset.yaml")
          agent_ref = os.environ["AGENT_IMAGE_REF"]
          browser_ref = os.environ["BROWSER_IMAGE_REF"]
          git_sha = os.environ["GIT_SHA"]
          agent_image = f"{agent_ref}:sha-{git_sha}@{os.environ['AGENT_DIGEST']}"
          browser_image = f"{browser_ref}:sha-{git_sha}@{os.environ['BROWSER_DIGEST']}"
          content = path.read_text()

          # Keep the current reference when the digest is unchanged. Its tag
          # names a commit, so rewriting it would restart Hermes for nothing.
          def pin(image, digest):
              return lambda match: match.group(0) if match.group(2).endswith("@" + digest) else f"{match.group(1)} {image}"

          if os.environ["ROLLOUT_AGENT_IMAGE"] == "true":
              content, agent_replacements = re.subn(
                  r"(?m)^(\s*- name: (?:gateway|android-companion)\n\s*image:)\s*(.*)$",
                  pin(agent_image, os.environ["AGENT_DIGEST"]),
                  content,
              )
              if agent_replacements != 2:
                  raise SystemExit("Failed to update Hermes Agent image reference")
          content, browser_replacements = re.subn(
              r"(?m)^(\s*- name: (?:browser|android-viewer)\n\s*image:)\s*(.*)$",
              pin(browser_image, os.environ["BROWSER_DIGEST"]),
              content,
          )
          if browser_replacements != 2:
              raise SystemExit("Failed to update Hermes Browser image reference")
          path.write_text(content)
          PY

      - name: Commit image digest update
        if: github.event_name == 'push'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if git diff --quiet -- gitops/espresso/apps/hermes-agent/statefulset.yaml; then
            exit 0
          fi

          git add gitops/espresso/apps/hermes-agent/statefulset.yaml
          git commit -m "chore(hermes-agent): update image digests [skip ci]"
          .github/scripts/push-to-main.sh
