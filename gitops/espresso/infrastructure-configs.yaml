apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-controllers
    - name: infrastructure-secrets
  interval: 10m
  path: ./gitops/espresso/infrastructure/configs
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
