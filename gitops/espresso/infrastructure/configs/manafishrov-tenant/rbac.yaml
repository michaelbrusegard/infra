  namespace: manafishrov-stalwart
subjects:
  - kind: ServiceAccount
    name: manafishrov
    namespace: flux-system
roleRef:
  kind: ClusterRole
  name: manafishrov-secrets
  apiGroup: rbac.authorization.k8s.io
---
# In flux-system the manafishrov SA only needs access to the specific
# tf-controller input Secrets it ships from infra-secrets. Allowlisted by
# name so it cannot read sops-age, webhook tokens, or other operator
# Secrets. Append new entries here when a new tofu input Secret is added.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: manafishrov-flux-secrets
  namespace: flux-system
rules:
  - apiGroups: [""]
    resources:
      - secrets
    resourceNames:
      - manafishrov-pocket-id-credentials
    verbs: ["get", "patch", "update", "delete"]
  - apiGroups: [""]
    resources:
      - secrets
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: manafishrov-flux-secrets
  namespace: flux-system
subjects:
  - kind: ServiceAccount
    name: manafishrov
    namespace: flux-system
roleRef:
  kind: Role
  name: manafishrov-flux-secrets
  apiGroup: rbac.authorization.k8s.io
