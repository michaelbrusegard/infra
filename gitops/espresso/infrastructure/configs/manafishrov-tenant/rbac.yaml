  name: manafishrov-secrets
  namespace: manafishrov-nextcloud
subjects:
  - kind: ServiceAccount
    name: manafishrov
    namespace: flux-system
roleRef:
  kind: ClusterRole
  name: manafishrov-secrets
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
