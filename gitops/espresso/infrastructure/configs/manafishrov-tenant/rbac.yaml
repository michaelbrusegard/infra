apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: manafishrov-secrets
  namespace: manafishrov-public
subjects:
  - kind: ServiceAccount
    name: manafishrov
    namespace: flux-system
roleRef:
