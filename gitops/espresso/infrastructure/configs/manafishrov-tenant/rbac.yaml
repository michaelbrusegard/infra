  name: manafishrov-secrets
  namespace: manafishrov-n8n
subjects:
  - kind: ServiceAccount
    name: manafishrov
    namespace: flux-system
roleRef:
  kind: ClusterRole
  name: manafishrov-secrets
  apiGroup: rbac.authorization.k8s.io
