---
# Secrets access is split out of the cluster-wide grant so the manafishrov
# SA cannot read Secrets in foreign namespaces (e.g. flux-system/sops-age).
# The ClusterRole below is bound per-namespace via RoleBindings; reads and
# writes only succeed inside namespaces with an explicit binding.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manafishrov-secrets
rules:
  - apiGroups: [""]
    resources:
      - secrets
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: manafishrov-secrets
  namespace: manafishrov
subjects:
  - kind: ServiceAccount
    name: manafishrov
    namespace: flux-system
roleRef:
  kind: ClusterRole
  name: manafishrov-secrets
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: manafishrov-secrets
  namespace: manafishrov-vaultwarden
subjects:
  - kind: ServiceAccount
    name: manafishrov
    namespace: flux-system
roleRef:
  kind: ClusterRole
  name: manafishrov-secrets
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: manafishrov-secrets
  namespace: manafishrov-pocket-id
subjects:
  - kind: ServiceAccount
    name: manafishrov
    namespace: flux-system
