apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../manafishrov-tofu-base
patches:
  - target:
      kind: Terraform
      name: manafishrov-base
    patch: |
      - op: replace
        path: /metadata/name
        value: manafishrov-pocket-id
  - target:
      kind: Terraform
      name: manafishrov-pocket-id
    patch: |
      apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      metadata:
        name: manafishrov-pocket-id
      spec:
        path: ./tofu/pocket-id
        backendConfig:
          secretSuffix: manafishrov-pocket-id
        varsFrom:
          - kind: Secret
            name: manafishrov-pocket-id-credentials
            varsKeys:
              - pocketid_api_token:manafishrov_pocketid_api_token
        writeOutputsToSecret:
          name: manafishrov-pocket-id-outputs
          outputs:
            - manafishrov_vaultwarden_pocketid_client_id
            - manafishrov_vaultwarden_pocketid_client_secret
            - manafishrov_nextcloud_pocketid_client_id
            - manafishrov_nextcloud_pocketid_client_secret
            - manafishrov_n8n_pocketid_client_id
            - manafishrov_n8n_pocketid_client_secret
            - manafishrov_roundcube_pocketid_client_id
            - manafishrov_roundcube_pocketid_client_secret
            - manafishrov_twenty_pocketid_client_id
            - manafishrov_twenty_pocketid_client_secret
