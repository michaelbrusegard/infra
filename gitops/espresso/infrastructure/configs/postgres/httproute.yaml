apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pgweb-internal
  namespace: postgres
spec:
  parentRefs:
    - name: internal
      namespace: gateway
      sectionName: https
  hostnames:
    - pgweb.asgard.michaelbrusegard.com
  rules:
    - backendRefs:
        - name: pgweb
          port: 80
