apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: public-https-redirect
  namespace: gateway
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: http
  hostnames:
    - id.asgard.michaelbrusegard.com
    - cloud.asgard.michaelbrusegard.com
    - status.asgard.michaelbrusegard.com
    - netbird.asgard.michaelbrusegard.com
    - michaelbrusegard.com
    - www.michaelbrusegard.com
    - old.michaelbrusegard.com
    - s3.manafishrov.com
    - status.manafishrov.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# The old personal website lives on old.michaelbrusegard.com until a new one
# takes over the apex, so this redirect is temporary (302).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: michaelbrusegard-old-redirect
  namespace: gateway
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: https
  hostnames:
    - michaelbrusegard.com
    - www.michaelbrusegard.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: old.michaelbrusegard.com
            statusCode: 302
