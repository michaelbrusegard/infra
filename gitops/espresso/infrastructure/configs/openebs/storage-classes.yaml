apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nvme-ha
provisioner: io.openebs.csi-mayastor
parameters:
  protocol: nvmf
  repl: "3"
  ioTimeout: "60"
  poolAffinityTopologyLabel: openebs.io/disk-type
volumeBindingMode: WaitForFirstConsumer
allowedTopologies:
  - matchLabelExpressions:
      - key: openebs.io/disk-type
        values:
          - nvme
allowVolumeExpansion: true
reclaimPolicy: Delete
---
