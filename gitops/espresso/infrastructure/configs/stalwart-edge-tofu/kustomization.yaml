apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../tofu-base
  - provider-config.yaml
patches:
  - target:
      kind: Terraform
      name: tofu-base
    patch: |
      - op: replace
        path: /metadata/name
        value: stalwart-edge
  - target:
      kind: Terraform
      name: stalwart-edge
    patch: |
      apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      metadata:
        name: stalwart-edge
      spec:
        # Bootstrap and native qualification completed; adopt existing state.
        suspend: true
        path: ./gitops/espresso/tofu/stalwart-edge
        backendConfig:
          secretSuffix: stalwart-edge
        varsFrom:
          - kind: Secret
            name: stalwart-edge-tofu
            varsKeys:
              - bootstrap_internal_domain_id
              - bootstrap_certificate_id
              - bootstrap_https_listener_id
              - bootstrap_webui_id
        runnerPodTemplate:
          spec:
            # The audited local provider lock is Linux amd64 only.
            nodeSelector:
              kubernetes.io/arch: amd64
            env:
              - name: TF_CLI_CONFIG_FILE
                value: /etc/tofu/tofurc
              - name: STALWART_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: stalwart-edge-tofu
                    key: STALWART_TOKEN
            # tf-controller supplies bootstrap variables through varsFrom;
            # manually injecting TF_VAR_* environment variables is forbidden.
            # Never mount this configuration-writer identity in the mail pod.
            initContainers:
              - name: install-stalwart-provider
                image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
                command:
                  - /bin/sh
                  - -ec
                  - |
                    test "$(uname -m)" = x86_64
                    version=0.2.3
                    checksum=9b4b3dc07a73055d7116fc426c6009de86479df7776ab23b6795132eeca8c119
                    archive="terraform-provider-stalwart_${version}_linux_amd64.zip"
                    wget -q "https://github.com/tahacodes/terraform-provider-stalwart/releases/download/v${version}/${archive}" -O "/tmp/${archive}"
                    echo "${checksum}  /tmp/${archive}" | sha256sum -c -
                    destination="/provider-mirror/registry.opentofu.org/tahacodes/stalwart/${version}/linux_amd64"
                    mkdir -p "${destination}"
                    unzip -q "/tmp/${archive}" -d "${destination}"
                resources:
                  requests:
                    cpu: 10m
                    memory: 32Mi
                  limits:
                    cpu: 100m
                    memory: 64Mi
                volumeMounts:
                  - name: provider-mirror
                    mountPath: /provider-mirror
            volumeMounts:
              - name: tofu-cli-config
                mountPath: /etc/tofu
                readOnly: true
              - name: provider-mirror
                mountPath: /provider-mirror
                readOnly: true
            volumes:
              - name: tofu-cli-config
                configMap:
                  name: stalwart-edge-tofu-provider
              - name: provider-mirror
                emptyDir:
                  sizeLimit: 128Mi
