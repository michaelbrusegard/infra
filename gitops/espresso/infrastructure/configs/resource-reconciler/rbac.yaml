apiVersion: v1
kind: ServiceAccount
metadata:
  name: resource-reconciler
  namespace: postgres
---
# Read-only cluster-wide: discover tenant ConfigMaps by label
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: resource-reconciler-reader
rules:
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: resource-reconciler-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: resource-reconciler-reader
subjects:
  - kind: ServiceAccount
    name: resource-reconciler
    namespace: postgres
---
# Write scoped per-tenant: only secrets in allowed namespaces
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: resource-reconciler-writer
  namespace: manafishrov
rules:
  - apiGroups: [""]
    resources:
      - secrets
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: resource-reconciler-writer
  namespace: manafishrov
subjects:
  - kind: ServiceAccount
    name: resource-reconciler
    namespace: postgres
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: resource-reconciler-writer
