apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: public-records
  namespace: gateway
spec:
  endpoints:
    - dnsName: id.asgard.michaelbrusegard.com
      recordType: CNAME
      targets:
        - router.asgard.michaelbrusegard.com
    - dnsName: cloud.asgard.michaelbrusegard.com
      recordType: CNAME
      targets:
        - router.asgard.michaelbrusegard.com
    - dnsName: status.asgard.michaelbrusegard.com
      recordType: CNAME
      targets:
        - router.asgard.michaelbrusegard.com
    - dnsName: netbird.asgard.michaelbrusegard.com
      recordType: CNAME
      targets:
        - router.asgard.michaelbrusegard.com
    # Proxied like the apex record in tofu/dns, so Cloudflare's edge answers
    # for the redirect to old.michaelbrusegard.com.
    - dnsName: www.michaelbrusegard.com
      recordType: CNAME
      targets:
        - router.asgard.michaelbrusegard.com
      providerSpecific:
        - name: external-dns.alpha.kubernetes.io/cloudflare-proxied
          value: "true"
