apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../manafishrov-tofu-base
patches:
  - target:
      kind: Terraform
      name: manafishrov-base
    patch: |
      - op: replace
        path: /metadata/name
        value: manafishrov-rustfs
  - target:
      kind: Terraform
      name: manafishrov-rustfs
    patch: |
      apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      metadata:
        name: manafishrov-rustfs
      spec:
        path: ./tofu/rustfs
        backendConfig:
          secretSuffix: manafishrov-rustfs
        # The minio provider is large; `tofu init` unpacking it OOM-kills the
        # runner at the shared 1Gi base limit (exit 137), which surfaces to the
        # controller as "terraform session error: instance id is empty" (the
        # runner dies before registering its session). 2Gi still OOM'd, so give
        # this stack's runner 4Gi; the nodes have ample headroom.
        runnerPodTemplate:
          spec:
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: "1"
                memory: 4Gi
        varsFrom:
          - kind: Secret
            name: rustfs-secret
            varsKeys:
              - RUSTFS_ACCESS_KEY:rustfs_access_key
              - RUSTFS_SECRET_KEY:rustfs_secret_key
              - manafishrov_firmware_ci_secret_key
              - manafishrov_twenty_app_secret_key
        writeOutputsToSecret:
          name: manafishrov-rustfs-outputs
          outputs:
            - manafishrov_twenty_rustfs_access_key_id
            - manafishrov_twenty_rustfs_secret_access_key
