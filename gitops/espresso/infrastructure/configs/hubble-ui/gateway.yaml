apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: hubble-ui
  namespace: kube-system
spec:
  addresses:
    - type: IPAddress
      value: 10.0.188.2
    - type: IPAddress
      value: fd7a:115c:a1e0:188::2
  gatewayClassName: cilium
  infrastructure:
    labels:
      advertise-via-bgp: "true"
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
