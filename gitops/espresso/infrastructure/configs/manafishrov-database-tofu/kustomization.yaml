apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../manafishrov-tofu-base
patches:
  - target:
      kind: Terraform
      name: manafishrov-base
    patch: |
      - op: replace
        path: /metadata/name
        value: manafishrov-database
  - target:
      kind: Terraform
      name: manafishrov-database
    patch: |
      apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      metadata:
        name: manafishrov-database
      spec:
        path: ./tofu/database
        backendConfig:
          secretSuffix: manafishrov-database
        varsFrom:
          - kind: Secret
            name: postgres-admin
            varsKeys:
              - POSTGRES_USER:pg_admin_user
              - POSTGRES_PASSWORD:pg_admin_password
          - kind: Secret
            name: manafishrov-nextcloud-db
            varsKeys:
              - nextcloud_db_password
        writeOutputsToSecret:
          name: manafishrov-tofu-outputs
          outputs:
            - nextcloud_db_password
