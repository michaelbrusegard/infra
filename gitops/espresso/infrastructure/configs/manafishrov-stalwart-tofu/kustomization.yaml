apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../manafishrov-tofu-base
  - provider-config.yaml
patches:
  - target:
      kind: Terraform
      name: manafishrov-base
    patch: |
      - op: replace
        path: /metadata/name
        value: manafishrov-stalwart
  - target:
      kind: Terraform
      name: manafishrov-stalwart
    patch: |
      apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      metadata:
        name: manafishrov-stalwart
      spec:
        # Keep the committed mirror checksums, including the Linux runner.
        upgradeOnInit: false
        path: ./tofu/stalwart
        vars:
          - name: smtp_edge_activation_ready
            value: true
          - name: smtp_edge_exact_recipients_ready
            value: true
          - name: smtp_edge_proxy_networks
            value: ["10.42.0.0/16", "fd42::/56"]
        backendConfig:
          secretSuffix: manafishrov-stalwart-v1
        runnerPodTemplate:
          spec:
            # The published provider contains only linux_amd64.
            nodeSelector:
              kubernetes.io/arch: amd64
            env:
              - name: TF_CLI_CONFIG_FILE
                value: /etc/tofu/tofurc
            envFrom:
              - secretRef:
                  name: manafishrov-stalwart-tofu
            initContainers:
              - name: install-stalwart-provider
                image: ghcr.io/michaelbrusegard/terraform-provider-stalwart:1.0.3@sha256:4832706a856de04f0af6a1a7b4aee5277f74eab0285f089b3c585de3cf7dd1aa
                command: ["/bin/cp", "-R", "/provider-mirror/.", "/mnt/provider-mirror/"]
                volumeMounts:
                  - name: provider-mirror
                    mountPath: /mnt/provider-mirror
            volumeMounts:
              - name: tofu-cli-config
                mountPath: /etc/tofu
                readOnly: true
              - name: provider-mirror
                mountPath: /provider-mirror
                readOnly: true
            volumes:
              - name: tofu-cli-config
                configMap:
                  name: manafishrov-stalwart-tofu-provider
              - name: provider-mirror
                emptyDir: {}
