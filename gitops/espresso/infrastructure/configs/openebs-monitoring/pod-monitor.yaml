apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: openebs-mayastor
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - openebs
  # The exporter is a sidecar container of the io-engine pods.
  selector:
    matchLabels:
      app: io-engine
  podMetricsEndpoints:
    - port: metrics
