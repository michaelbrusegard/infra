apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: storage
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: storage
      rules:
        # Mayastor exports no volume health, so compare each volume's replicas
        # on online pools with the count its StorageClass asks for.
        - record: mayastor:volume_expected_replicas
          expr: |
            max by (pv_name, claim_namespace, claim) (
              label_replace(
                label_replace(
                  (
                    kube_persistentvolume_info{storageclass="nvme-ha"} * 0 + 3
                    or kube_persistentvolume_info{storageclass="ssd-ha"} * 0 + 2
                    or kube_persistentvolume_info{storageclass="openebs-single-replica"} * 0 + 1
                  )
                  * on (persistentvolume) group_left (claim_namespace, name) kube_persistentvolume_claim_ref,
                  "pv_name", "$1", "persistentvolume", "(.+)"
                ),
                "claim", "$1", "name", "(.+)"
              )
            )
        - record: mayastor:volume_replicas
          expr: |
            max by (pv_name) (
              count by (pv_name) (replica_num_read_ops)
              or mayastor:volume_expected_replicas * 0
            )
        - alert: MayastorVolumeDegraded
          expr: |
            mayastor:volume_expected_replicas > on (pv_name) mayastor:volume_replicas
              and on (pv_name) mayastor:volume_replicas > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.claim_namespace }}/{{ $labels.claim }} is missing a replica"
            description: "It has fewer than {{ $value }} replicas. One more disk failure can lose it."
        - alert: MayastorVolumeFaulted
          expr: |
            mayastor:volume_expected_replicas
              and on (pv_name) mayastor:volume_replicas == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.claim_namespace }}/{{ $labels.claim }} has no replica left"
            description: "Its data is unavailable."
        - alert: MayastorPoolNotOnline
          expr: openebs_diskpool_status{status="Online"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.name }} on {{ $labels.node }} is not online"
            description: "Its replicas are unavailable and volumes on it run degraded. Check the disk and the DiskPool status."
        - alert: MayastorPoolIoErrors
          expr: diskpool_io_alert_status > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.name }} on {{ $labels.node }} reports I/O errors or stalls"
            description: "Check the disk behind the pool."
        - alert: MayastorPoolAlmostFull
          expr: diskpool_used_size_bytes / diskpool_total_size_bytes > 0.9
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.name }} on {{ $labels.node }} is {{ $value | humanizePercentage }} full"
            description: "Replicas may not fit for new volumes or rebuilds."
        - alert: MayastorNodeOffline
          expr: mayastor_node_online == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Mayastor node {{ $labels.node_id }} is offline"
            description: "Volume replicas on it are unavailable."
