apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs-console
  namespace: rustfs
spec:
  parentRefs:
    - name: rustfs
      namespace: rustfs
      sectionName: console
  rules:
    - backendRefs:
        - name: rustfs
          port: 9001
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs-api
  namespace: rustfs
spec:
  parentRefs:
    - name: rustfs
      namespace: rustfs
      sectionName: api
  rules:
    - backendRefs:
        - name: rustfs
          port: 9000
