apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
  namespace: k8s-gateway
spec:
  interval: 15m
  chart:
    spec:
      chart: k8s-gateway
      version: "3.7.2"
      sourceRef:
        kind: HelmRepository
        name: k8s-gateway
        namespace: flux-system
      interval: 1h
  values:
    # Multi-zone Corefile: serves both zones. Fallthrough below sends names
    # without a matching HTTPRoute (e.g. files.manafishrov.com) to upstream
    # DNS so non-cluster subdomains still resolve on LAN.
    domain: "asgard.michaelbrusegard.com manafishrov.com eldians.com"
    apex: macchiato.gateway
    watchedResources:
      - HTTPRoute
      - Service
    fallthrough:
      enabled: true
      zones:
        - asgard.michaelbrusegard.com
        - manafishrov.com
        - eldians.com
    ttl: 300
    # Forward fallthrough queries directly to public DNS instead of the cluster
    # resolver. Otherwise the chart's default `/etc/resolv.conf` would route
    # back through CoreDNS in kube-system, which forwards back to macchiato's
    # blocky, which conditionally forwards manafishrov.com back here — a loop
    # that prevents non-cluster subdomains from ever resolving on LAN.
    extraZonePlugins:
      - name: log
      - name: errors
      - name: health
        configBlock: |-
          lameduck 5s
      - name: ready
      - name: prometheus
        parameters: 0.0.0.0:9153
      - name: forward
        parameters: . 1.1.1.1 9.9.9.9
      - name: loop
      - name: reload
      - name: loadbalance
    service:
      type: LoadBalancer
      port: 53
      useTcp: true
      ipFamilyPolicy: PreferDualStack
      ipFamilies:
        - IPv4
        - IPv6
      annotations:
        lbipam.cilium.io/ips: "10.0.188.5,fd7a:115c:a1e0:188::5"
    replicaCount: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi
