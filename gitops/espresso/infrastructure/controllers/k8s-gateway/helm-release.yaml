apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
  namespace: k8s-gateway
spec:
  interval: 15m
  chart:
    spec:
      chart: k8s-gateway
      version: "3.7.1"
      sourceRef:
        kind: HelmRepository
        name: k8s-gateway
        namespace: flux-system
      interval: 1h
  values:
    # Multi-zone Corefile: serves both zones. Fallthrough below sends names
    # without a matching HTTPRoute (e.g. files.manafishrov.com) to upstream
    # DNS so non-cluster subdomains still resolve on LAN.
    domain: "gullhaugveien.michaelbrusegard.com manafishrov.com"
    apex: macchiato.gateway
    watchedResources:
      - HTTPRoute
      - Service
    fallthrough:
      enabled: true
      zones:
        - gullhaugveien.michaelbrusegard.com
        - manafishrov.com
    ttl: 300
    service:
      type: LoadBalancer
      port: 53
      useTcp: true
      ipFamilyPolicy: PreferDualStack
      ipFamilies:
        - IPv4
        - IPv6
      annotations:
        lbipam.cilium.io/ips: "10.0.188.5,fd7a:115c:a1e0:188::5"
    replicaCount: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi
