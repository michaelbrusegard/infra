apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: disks
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: disks
      rules:
        - alert: SmartctlExporterDown
          expr: up{job="smartctl"} == 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: SMART exporter on {{ $labels.instance }} is unreachable
            description: "Disk health on {{ $labels.instance }} is not being monitored."
        - alert: DiskSmartFailing
          expr: smartctl_device_smart_status == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.device }} on {{ $labels.instance }} fails its SMART health check"
            description: "Replace the disk."
        # A failing Samsung SSD drops into a firmware safe mode that reports a
        # 1 GB capacity, and a vanished disk makes smartctl fail outright.
        - alert: DiskCapacityChanged
          expr: changes(smartctl_device_capacity_bytes[1h]) > 0
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.device }} on {{ $labels.instance }} changed capacity"
            description: "The disk now reports {{ $value | humanize1024 }}B. Check the kernel log for ATA errors."
        - alert: DiskUnreadable
          # smartctl exit bits 0-2: bad arguments, device open failed, or a
          # device command failed.
          expr: smartctl_device_smartctl_exit_status % 8 > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "smartctl cannot read {{ $labels.device }} on {{ $labels.instance }}"
            description: "The disk may have dropped off its bus."
        - alert: DiskMediaErrors
          expr: |
            smartctl_device_attribute{attribute_value_type="raw",attribute_name=~"Reallocated_Sector_Ct|Used_Rsvd_Blk_Cnt_Tot|Offline_Uncorrectable|Reported_Uncorrect"} > 0
              or smartctl_device_media_errors > 0
              or smartctl_device_critical_warning > 0
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.device }} on {{ $labels.instance }} reports media errors"
            description: "{{ $labels.attribute_name }} is {{ $value }}. Plan a replacement."
        - alert: DiskWearingOut
          expr: |
            smartctl_device_percentage_used > 80
              or smartctl_device_attribute{attribute_value_type="value",attribute_name="Wear_Leveling_Count"} < 20
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.device }} on {{ $labels.instance }} is near the end of its write endurance"
            description: "Plan a replacement."
