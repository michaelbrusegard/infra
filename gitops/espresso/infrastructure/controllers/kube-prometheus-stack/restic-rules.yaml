apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: backup-host-restic
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: backup-host-restic
      rules:
        - alert: ResticMaintenanceFailed
          expr: node_systemd_unit_state{instance=~"freddo|manata",name=~"restic-(rest-server|maintenance|prune|check|unlock|metrics)\\.service",state="failed"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Restic maintenance failed on {{ $labels.instance }}
            description: "{{ $labels.name }} is in the failed state."
        - alert: ResticBackupStale
          expr: time() - restic_repository_latest_snapshot_timestamp_seconds{instance=~"freddo|manata"} > restic_repository_max_age_seconds{instance=~"freddo|manata"}
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: Restic backup is stale
            description: "{{ $labels.repository }} has no snapshot within its configured freshness window."
        - alert: ResticBackupMetricsMissing
          expr: (up{job="node-exporter",instance=~"freddo|manata"} == 1) unless on (instance) restic_repository_latest_snapshot_timestamp_seconds{instance=~"freddo|manata"}
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: Restic backup metrics are missing on {{ $labels.instance }}
            description: "{{ $labels.instance }} has not published repository freshness metrics."
