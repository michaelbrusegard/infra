apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "92.22.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # k3s uses embedded etcd and Cilium replaces kube-proxy
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    defaultRules:
      rules:
        etcd: false
        kubeProxy: false
      # Fires for every failed Job until someone deletes it, including
      # CronJob runs that later succeeded. job-rules.yaml replaces it.
      disabled:
        KubeJobFailed: true

    # DiskPool status for storage-rules.yaml: the io-engine exporter only
    # reports pools it has imported, so a pool that fails to import vanishes.
    # ReplicationSources for backup-rules.yaml: VolSync keeps reporting
    # deleted sources and cannot tell a paused source from a failing one.
    kube-state-metrics:
      rbac:
        extraRules:
          - apiGroups: ["openebs.io"]
            resources: ["diskpools"]
            verbs: ["list", "watch"]
          - apiGroups: ["volsync.backube"]
            resources: ["replicationsources"]
            verbs: ["list", "watch"]
      customResourceState:
        enabled: true
        config:
          kind: CustomResourceStateMetrics
          spec:
            resources:
              - groupVersionKind:
                  group: openebs.io
                  version: v1beta3
                  kind: DiskPool
                metricNamePrefix: openebs_diskpool
                labelsFromPath:
                  name: [metadata, name]
                  node: [spec, node]
                metrics:
                  - name: status
                    help: DiskPool status reported by the OpenEBS operator.
                    each:
                      type: StateSet
                      stateSet:
                        labelName: status
                        path: [status, status]
                        list: [Online, Offline, Unknown]
              - groupVersionKind:
                  group: volsync.backube
                  version: v1alpha1
                  kind: ReplicationSource
                metricNamePrefix: volsync_replicationsource
                labelsFromPath:
                  obj_namespace: [metadata, namespace]
                  obj_name: [metadata, name]
                metrics:
                  - name: paused
                    help: Whether the ReplicationSource is paused.
                    each:
                      type: Gauge
                      gauge:
                        path: [spec, paused]
                        nilIsZero: true

    prometheus-node-exporter:
      extraArgs:
        - --no-collector.kernel_hung
      service:
        ipDualStack:
          enabled: true
          ipFamilies: ["IPv4", "IPv6"]
          ipFamilyPolicy: RequireDualStack

    prometheus:
      prometheusSpec:
        retention: 21d
        retentionSize: 40GB
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ssd-ha
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Gi
        # Discover ServiceMonitors and PodMonitors across all namespaces
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        additionalScrapeConfigs:
          - job_name: node-exporter
            static_configs:
              - targets: ["10.0.187.1:9100"]
                labels:
                  instance: macchiato
              - targets: ["10.0.186.17:9100"]
                labels:
                  instance: freddo
              - targets: ["10.0.186.18:9100"]
                labels:
                  instance: manata
          - job_name: smartctl
            static_configs:
              - targets: ["10.0.187.2:9633"]
                labels:
                  instance: espresso-0
              - targets: ["10.0.187.3:9633"]
                labels:
                  instance: espresso-1
              - targets: ["10.0.187.4:9633"]
                labels:
                  instance: espresso-2
          - job_name: node-exporter-ipv6
            static_configs:
              - targets: ["[fd7a:115c:a1e0:187::2]:9100"]
                labels:
                  instance: espresso-0
                  ip_family: IPv6
              - targets: ["[fd7a:115c:a1e0:187::3]:9100"]
                labels:
                  instance: espresso-1
                  ip_family: IPv6
              - targets: ["[fd7a:115c:a1e0:187::4]:9100"]
                labels:
                  instance: espresso-2
                  ip_family: IPv6
          - job_name: blocky
            static_configs:
              - targets: ["10.0.187.1:4000"]
                labels:
                  instance: macchiato

    alertmanager:
      alertmanagerSpec:
        secrets:
          - mattermost-outputs
          - hermes-alert-webhook
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ssd-ha
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 5Gi
      config:
        global:
          resolve_timeout: 5m
        route:
          group_by: ["namespace", "alertname"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          receiver: "null"
          routes:
            - matchers:
                - alertname = "Watchdog"
              receiver: "null"
            - matchers:
                - severity =~ "warning|critical"
              receiver: mattermost
        inhibit_rules:
          - source_matchers:
              - severity = "critical"
            target_matchers:
              - severity =~ "warning|info"
            equal: ["namespace", "alertname"]
          - source_matchers:
              - severity = "warning"
            target_matchers:
              - severity = "info"
            equal: ["namespace", "alertname"]
          - source_matchers:
              - alertname = "InfoInhibitor"
            target_matchers:
              - severity = "info"
            equal: ["namespace"]
        receivers:
          - name: "null"
          - name: mattermost
            mattermost_configs:
              - webhook_url_file: /etc/alertmanager/secrets/mattermost-outputs/alertmanager_webhook_url
                channel: alerts
                username: Alertmanager
                send_resolved: true
            webhook_configs:
              - url: http://hermes-agent-gateway.hermes-agent.svc.cluster.local:8644/webhooks/alertmanager
                send_resolved: false
                http_config:
                  http_headers:
                    X-Gitlab-Token:
                      files:
                        - /etc/alertmanager/secrets/hermes-alert-webhook/WEBHOOK_SECRET

    grafana:
      plugins:
        - grafana-clickhouse-datasource@4.23.4
      deploymentStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
      admin:
        existingSecret: grafana-credentials
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: true
        storageClassName: nvme-ha
        size: 5Gi
      sidecar:
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
          searchNamespace: ALL
      additionalDataSources:
        - name: Loki
          type: loki
          url: http://loki.monitoring.svc.cluster.local:3100
          access: proxy
        - name: AI usage
          uid: ai-usage-clickhouse
          type: grafana-clickhouse-datasource
          access: proxy
          editable: false
          jsonData:
            host: clickhouse.clickhouse.svc.cluster.local
            port: 8123
            protocol: http
            username: grafana
            defaultDatabase: llm
            defaultTable: usage_metrics
            dialTimeout: 5
            queryTimeout: 30
            maxOpenConns: 4
            maxIdleConns: 2
            enableMapKeysDiscovery: false
