apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "88.3.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # k3s uses embedded etcd and Cilium replaces kube-proxy
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    defaultRules:
      rules:
        etcd: false
        kubeProxy: false

    prometheus-node-exporter:
      extraArgs:
        - --no-collector.kernel_hung
      service:
        ipDualStack:
          enabled: true
          ipFamilies: ["IPv4", "IPv6"]
          ipFamilyPolicy: RequireDualStack

    prometheus:
      prometheusSpec:
        retention: 21d
        retentionSize: 40GB
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ssd-ha
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Gi
        # Discover ServiceMonitors and PodMonitors across all namespaces
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        additionalScrapeConfigs:
          - job_name: node-exporter
            static_configs:
              - targets: ["10.0.187.1:9100"]
                labels:
                  instance: macchiato
              - targets: ["10.0.186.17:9100"]
                labels:
                  instance: freddo
              - targets: ["10.0.186.18:9100"]
                labels:
                  instance: manata
          - job_name: node-exporter-ipv6
            static_configs:
              - targets: ["[fd7a:115c:a1e0:187::2]:9100"]
                labels:
                  instance: espresso-0
                  ip_family: IPv6
              - targets: ["[fd7a:115c:a1e0:187::3]:9100"]
                labels:
                  instance: espresso-1
                  ip_family: IPv6
              - targets: ["[fd7a:115c:a1e0:187::4]:9100"]
                labels:
                  instance: espresso-2
                  ip_family: IPv6
          - job_name: blocky
            static_configs:
              - targets: ["10.0.187.1:4000"]
                labels:
                  instance: macchiato

    alertmanager:
      alertmanagerSpec:
        secrets:
          - mattermost-outputs
          - hermes-alert-webhook
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ssd-ha
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 5Gi
      config:
        global:
          resolve_timeout: 5m
        route:
          group_by: ["namespace", "alertname"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          receiver: "null"
          routes:
            - matchers:
                - alertname = "Watchdog"
              receiver: "null"
            - matchers:
                - severity =~ "warning|critical"
              receiver: mattermost
        inhibit_rules:
          - source_matchers:
              - severity = "critical"
            target_matchers:
              - severity =~ "warning|info"
            equal: ["namespace", "alertname"]
          - source_matchers:
              - severity = "warning"
            target_matchers:
              - severity = "info"
            equal: ["namespace", "alertname"]
          - source_matchers:
              - alertname = "InfoInhibitor"
            target_matchers:
              - severity = "info"
            equal: ["namespace"]
        receivers:
          - name: "null"
          - name: mattermost
            mattermost_configs:
              - webhook_url_file: /etc/alertmanager/secrets/mattermost-outputs/alertmanager_webhook_url
                channel: alerts
                username: Alertmanager
                send_resolved: true
            webhook_configs:
              - url: http://hermes-agent-gateway.hermes-agent.svc.cluster.local:8644/webhooks/alertmanager
                send_resolved: false
                http_config:
                  http_headers:
                    X-Gitlab-Token:
                      files:
                        - /etc/alertmanager/secrets/hermes-alert-webhook/WEBHOOK_SECRET

    grafana:
      deploymentStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
      admin:
        existingSecret: grafana-credentials
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: true
        storageClassName: nvme-ha
        size: 5Gi
      sidecar:
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
          searchNamespace: ALL
      additionalDataSources:
        - name: Loki
          type: loki
          url: http://loki.monitoring.svc.cluster.local:3100
          access: proxy
