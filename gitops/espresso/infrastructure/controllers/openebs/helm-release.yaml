apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
  namespace: openebs
spec:
  interval: 15m
  chart:
    spec:
      chart: openebs
      version: "4.5.1"
      sourceRef:
        kind: HelmRepository
        name: openebs
        namespace: flux-system
      interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    engines:
      replicated:
        mayastor:
          enabled: true
      local:
        lvm:
          enabled: false
        zfs:
          enabled: false
        hostpath:
          enabled: true
        rawfile:
          enabled: false
    loki:
      enabled: false
    alloy:
      enabled: false
    localpv-provisioner:
      localpv:
        basePath: /var/local/openebs/local
    mayastor:
      base:
        metrics:
          enabled: true
      apis:
        rest:
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
      csi:
        controller:
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 25m
              memory: 64Mi
      io_engine:
        interruptMode:
          enabled: true
          nvmeIoQueuePollPeriod: 1000us
      obs:
        callhome:
          enabled: false
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: openebs-csi-controller
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: openebs-csi-controller
              spec:
                template:
                  spec:
                    containers:
                      - name: csi-provisioner
                        resources:
                          limits:
                            cpu: 100m
                            memory: 128Mi
                          requests:
                            cpu: 25m
                            memory: 32Mi
                      - name: csi-attacher
                        resources:
                          limits:
                            cpu: 100m
                            memory: 128Mi
                          requests:
                            cpu: 25m
                            memory: 32Mi
                      - name: csi-snapshotter
                        resources:
                          limits:
                            cpu: 100m
                            memory: 128Mi
                          requests:
                            cpu: 25m
                            memory: 32Mi
                      - name: csi-snapshot-controller
                        resources:
                          limits:
                            cpu: 100m
                            memory: 128Mi
                          requests:
                            cpu: 25m
                            memory: 32Mi
                      - name: csi-resizer
                        resources:
                          limits:
                            cpu: 100m
                            memory: 128Mi
                          requests:
                            cpu: 25m
                            memory: 32Mi
