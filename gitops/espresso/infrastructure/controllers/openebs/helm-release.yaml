apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
  namespace: openebs
spec:
  interval: 15m
  chart:
    spec:
      chart: openebs
      version: "4.6.2"
      sourceRef:
        kind: HelmRepository
        name: openebs
        namespace: flux-system
      interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
    # The io-engine uses OnDelete; its managed drain/upgrade runs after Helm.
    disableWait: true
  values:
    engines:
      replicated:
        mayastor:
          enabled: true
      local:
        lvm:
          enabled: false
        zfs:
          enabled: false
        hostpath:
          enabled: true
        rawfile:
          enabled: false
    loki:
      enabled: false
    alloy:
      enabled: false
    localpv-provisioner:
      localpv:
        basePath: /var/local/openebs/local
    mayastor:
      base:
        metrics:
          enabled: true
      apis:
        rest:
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
      csi:
        controller:
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 25m
              memory: 64Mi
      io_engine:
        interruptMode:
          enabled: true
          nvmeIoQueuePollPeriod: 1000us
      obs:
        callhome:
          enabled: false
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: DaemonSet
              name: openebs-csi-node
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: openebs-csi-node
              spec:
                template:
                  spec:
                    initContainers:
                      - name: persist-nvme-host-id
                        image: docker.io/openebs/alpine-sh:4.6.0
                        command:
                          - sh
                          - -ec
                          - |
                            # Firmware may omit product_uuid. Reuse the
                            # live identity so mounted volumes stay connected.
                            identity=/csi/host-identity/product_uuid
                            mkdir -p /csi/host-identity
                            if [ ! -s "$identity" ]; then
                              for controller in /host-sys/class/nvme/nvme*; do
                                [ "$(cat "$controller/hostnqn" 2>/dev/null)" = "nqn.2019-05.io.openebs:node-name:$MY_NODE_NAME" ] || continue
                                cat "$controller/hostid" > "$identity"
                                break
                              done
                            fi
                            if [ ! -s "$identity" ]; then
                              if [ -s /host-sys/class/dmi/id/product_uuid ]; then
                                cat /host-sys/class/dmi/id/product_uuid > "$identity"
                              else
                                cat /proc/sys/kernel/random/uuid > "$identity"
                              fi
                            fi
                        env:
                          - name: MY_NODE_NAME
                            valueFrom:
                              fieldRef:
                                fieldPath: spec.nodeName
                        volumeMounts:
                          - name: plugin-dir
                            mountPath: /csi
                          - name: sys
                            mountPath: /host-sys
                            readOnly: true
                    containers:
                      - name: csi-node
                        volumeMounts:
                          # nvmeadm reads this path once at startup.
                          - name: plugin-dir
                            mountPath: /sys/class/dmi/id
                            subPath: host-identity
                            readOnly: true
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: openebs-csi-controller
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: openebs-csi-controller
              spec:
                template:
                  spec:
                    containers:
                      - name: csi-provisioner
                        resources:
                          limits:
                            cpu: 100m
                            memory: 128Mi
                          requests:
                            cpu: 25m
                            memory: 32Mi
                      - name: csi-attacher
                        resources:
                          limits:
                            cpu: 100m
                            memory: 128Mi
                          requests:
                            cpu: 25m
                            memory: 32Mi
                      - name: csi-snapshotter
                        resources:
                          limits:
                            cpu: 100m
                            memory: 128Mi
                          requests:
                            cpu: 25m
                            memory: 32Mi
                      - name: csi-snapshot-controller
                        resources:
                          limits:
                            cpu: 100m
                            memory: 128Mi
                          requests:
                            cpu: 25m
                            memory: 32Mi
                      - name: csi-resizer
                        resources:
                          limits:
                            cpu: 100m
                            memory: 128Mi
                          requests:
                            cpu: 25m
                            memory: 32Mi
