apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cilium
      version: "1.19.3"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: kube-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    ipv4:
      enabled: true
    ipv6:
      enabled: true
    ipam:
      mode: kubernetes
    k8sServiceHost: "10.0.187.2"
    k8sServicePort: 6443
    kubeProxyReplacement: true
    routingMode: native
    autoDirectNodeRoutes: true
    ipv4NativeRoutingCIDR: "10.42.0.0/16"
    ipv6NativeRoutingCIDR: "fd42::/56"
    bandwidthManager:
      enabled: true
      bbr: true
    bpf:
      masquerade: true
      hostRouting: true
    envoyConfig:
      enabled: true
    hostFirewall:
      enabled: true
    bgpControlPlane:
      enabled: true
    externalIPs:
      enabled: true
    gatewayAPI:
      enabled: true
      enableAlpn: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        trustCRDsExist: true
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
    hubble:
      relay:
        enabled: true
      ui:
        enabled: true
      metrics:
        enabled:
          - dns
          - drop
          - tcp
          - flow
          - port-distribution
          - icmp
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
        serviceMonitor:
          enabled: true
