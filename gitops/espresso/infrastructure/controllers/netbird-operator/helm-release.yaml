apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbird-operator
  namespace: netbird
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: netbird-operator
    namespace: netbird
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    managementURL: https://netbird.asgard.michaelbrusegard.com
    cluster:
      name: espresso
    # The pod webhook fails closed, so while the operator is down it blocks
    # every pod it matches. Only hermes-agent has a SidecarProfile; scoping
    # the webhook there keeps an operator outage from stopping CoreDNS,
    # Cilium and storage pods cluster-wide.
    webhook:
      namespaceSelectors:
        - key: kubernetes.io/metadata.name
          operator: In
          values: ["hermes-agent"]
    netbirdAPI:
      keyFromSecret:
        name: netbird-credentials
        key: netbird_token
    operator:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 256Mi
