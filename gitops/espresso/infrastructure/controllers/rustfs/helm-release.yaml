apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rustfs
  namespace: rustfs
spec:
  interval: 15m
  chart:
    spec:
      chart: rustfs
      version: "0.3.0"
      sourceRef:
        kind: HelmRepository
        name: rustfs
        namespace: flux-system
      interval: 1h
  values:
    mode:
      standalone:
        enabled: true
        # PVCs are RWO; rolling updates would multi-attach to the new pod while
        # the old still holds the volumes. Recreate forces full pod termination
        # before the replacement starts.
        strategy:
          type: Recreate
      distributed:
        enabled: false
    secret:
      existingSecret: rustfs-secret
    ingress:
      enabled: false
    storageclass:
      name: ssd-ha
      dataStorageSize: 1Ti
      logStorageSize: 256Mi
    config:
      rustfs:
        log_level: warn
        obs_environment: production
        log_rotation:
          size: 50
          time: hour
          keep_files: 24
    resources:
      limits:
        cpu: "1"
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi
