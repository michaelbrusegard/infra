apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
  namespace: flux-system
spec:
  interval: 15m
  chart:
    spec:
      chart: reflector
      version: "10.0.60"
      sourceRef:
        kind: HelmRepository
        name: emberstack
        namespace: flux-system
      interval: 1h
  values:
    image:
      repository: ghcr.io/emberstack/kubernetes-reflector
    extraEnv:
      - name: DOTNET_GCConserveMemory
        value: "7"
      - name: DOTNET_GCHeapHardLimitPercent
        value: "0x32"
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
