apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgweb
  namespace: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgweb
  template:
    metadata:
      labels:
        app: pgweb
    spec:
      containers:
        - name: pgweb
          image: sosedoff/pgweb:0.17.0@sha256:a5256d416e2e8b92d69a4459058e3eca33a9f075d8325491644411d0bc3bd70b
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mkdir -p /tmp/bookmarks
              until psql "postgres://$PGUSER:$PGPASSWORD@$PGHOST:$PGPORT/postgres?sslmode=$PGSSLMODE" -tAc 'SELECT 1' >/dev/null 2>&1; do
                echo "waiting for postgres..."
                sleep 2
              done
              psql "postgres://$PGUSER:$PGPASSWORD@$PGHOST:$PGPORT/postgres?sslmode=$PGSSLMODE" \
                -tAc "SELECT datname FROM pg_database WHERE datistemplate=false ORDER BY 1" \
              | while IFS= read -r db; do
                  [ -z "$db" ] && continue
                  cat > "/tmp/bookmarks/$db.toml" <<EOF
              host = "$PGHOST"
              port = $PGPORT
              user = "$PGUSER"
              password = "$PGPASSWORD"
              database = "$db"
              sslmode = "$PGSSLMODE"
              EOF
                done
              exec pgweb \
                --bind=0.0.0.0 \
                --listen=8081 \
                --sessions \
                --bookmarks-dir=/tmp/bookmarks \
                --bookmarks-only
          envFrom:
            - secretRef:
                name: postgres-admin
          env:
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
            - name: PGSSLMODE
              value: disable
            - name: PGUSER
              value: $(POSTGRES_USER)
            - name: PGPASSWORD
              value: $(POSTGRES_PASSWORD)
            - name: PGWEB_AUTH_USER
              value: $(POSTGRES_USER)
            - name: PGWEB_AUTH_PASS
              value: $(POSTGRES_PASSWORD)
          ports:
            - containerPort: 8081
              name: http
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
