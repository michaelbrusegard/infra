apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: immich-uploads-backup
  namespace: immich
spec:
  sourcePVC: uploads-immich-0
  trigger: {}
  restic:
    repository: freddo-restic-immich-uploads
    pruneIntervalDays: 36500
    retain:
      within: 100y
    moverSecurityContext:
      runAsUser: 0
      runAsGroup: 0
    copyMethod: Snapshot
    volumeSnapshotClassName: mayastor-snapshot
    cacheStorageClassName: openebs-single-replica
    cacheCapacity: 5Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: immich-backup
  namespace: immich
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: immich-backup-volsync
  namespace: immich
rules:
  - apiGroups: ["volsync.backube"]
    resources:
      - replicationsources
    resourceNames:
      - immich-uploads-backup
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: immich-backup-volsync
  namespace: immich
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: immich-backup-volsync
subjects:
  - kind: ServiceAccount
    name: immich-backup
    namespace: immich
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-backup
  namespace: immich
spec:
  schedule: "30 5 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 43200
      template:
        metadata:
          labels:
            app: immich-backup
        spec:
          restartPolicy: Never
          serviceAccountName: immich-backup
          initContainers:
            - name: dump-postgres
              image: ghcr.io/michaelbrusegard/postgres:sha-d5a65c76cfe6e2f02522d94347067f4408da9a2c@sha256:df8cc436376b921838549a1f35d9bd35a867ff87478f142fb37e7acc7b7c4ac1
              command:
                - sh
                - -c
                - |
                  set -eu
                  ts="$(date -u +%Y%m%dT%H%M%SZ)"
                  pg_dump \
                    --format=custom \
                    --compress=9 \
                    --clean \
                    --if-exists \
                    --no-owner \
                    --no-acl \
                    --dbname=immich \
                    --file="/backup/immich-${ts}.dump"
              env:
                - name: PGHOST
                  value: postgres.postgres.svc.cluster.local
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  value: immich_app
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-outputs
                      key: immich_db_password
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              volumeMounts:
                - name: backup
                  mountPath: /backup
            - name: restic-postgres
              image: docker.io/restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              command:
                - sh
                - -c
                - |
                  set -eu
                  restic --retry-lock 15m backup \
                    --host espresso-postgres \
                    --tag espresso \
                    --tag immich \
                    --tag postgres \
                    /backup
              env:
                - name: RESTIC_CACHE_DIR
                  value: /cache
              envFrom:
                - secretRef:
                    name: freddo-restic-immich-postgres
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              volumeMounts:
                - name: backup
                  mountPath: /backup
                  readOnly: true
                - name: cache
                  mountPath: /cache
          containers:
            - name: trigger-volsync
              image: docker.io/library/python:3.15-slim@sha256:fd2aef5e0d8438208de9fe154ab5b331a2428fc0c9838d41611e611fd7a80d85
              command:
                - python
                - /scripts/trigger-volsync.py
              env:
                - name: VOLSYNC_NAMESPACE
                  value: immich
                - name: VOLSYNC_SOURCE
                  value: immich-uploads-backup
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: backup
              emptyDir: {}
            - name: cache
              emptyDir: {}
            - name: script
              configMap:
                name: immich-backup-orchestrator
                defaultMode: 0755
