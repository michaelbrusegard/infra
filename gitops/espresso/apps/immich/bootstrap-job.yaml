apiVersion: batch/v1
kind: Job
metadata:
  name: immich-bootstrap-admin
  namespace: immich
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: immich-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
          env:
            - name: IMMICH_ADMIN_NAME
              valueFrom:
                secretKeyRef:
                  name: immich-bootstrap
                  key: IMMICH_ADMIN_NAME
            - name: IMMICH_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: immich-bootstrap
                  key: IMMICH_ADMIN_EMAIL
            - name: IMMICH_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-bootstrap
                  key: IMMICH_ADMIN_PASSWORD
          command:
            - sh
            - -c
            - |
              set -eu

              until curl -fsS http://immich/api/server/ping >/dev/null; do
                sleep 5
              done

              # Immich changes the "admin exists" error between releases, so
              # check the server state instead of matching its message.
              if curl -fsS http://immich/api/server/config | grep -q '"isInitialized":true'; then
                exit 0
              fi

              body=$(printf '{"email":"%s","password":"%s","name":"%s"}' \
                "$IMMICH_ADMIN_EMAIL" "$IMMICH_ADMIN_PASSWORD" "$IMMICH_ADMIN_NAME")
              status=$(curl -sS -o /tmp/immich-admin-sign-up.out -w '%{http_code}' \
                -H 'Content-Type: application/json' \
                -X POST \
                -d "$body" \
                http://immich/api/auth/admin-sign-up)

              case "$status" in
                200|201)
                  exit 0
                  ;;
              esac

              cat /tmp/immich-admin-sign-up.out >&2
              exit 1
