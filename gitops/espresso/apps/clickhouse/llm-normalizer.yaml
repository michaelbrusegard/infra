# The LLM conversation normalizer (packages/cliproxy-plugins/
# normalize-conversations): every 10 minutes, it normalizes the proxy
# requests that are not in llm.calls yet, an hour at a time from the
# oldest, for up to 5 minutes a run.
#
# To rebuild the proxy's rows, for example after an extractor fix: suspend
# the job, delete them as the default user through kubectl exec (llm.calls
# and llm.sessions WHERE origin = 'proxy', llm.messages WHERE path = '',
# each with SETTINGS mutations_sync = 1), and resume it; it catches up from
# the first request. Keep the transcript rows: they cannot be rebuilt.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: llm-normalizer
  namespace: clickhouse
spec:
  schedule: "*/10 * * * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 540
      # A failed run stays visible for a day, then stops showing up as an
      # unhealthy pod once later runs have succeeded.
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: llm-normalizer
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            fsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: install-normalizer
              # CI swaps this for each plugin image it builds, which holds the
              # normalizer in /normalizer.
              image: ghcr.io/michaelbrusegard/cliproxy-plugins:sha-7efa828371f9f8fa13734ba65a42ced93432a7be@sha256:9dd9da9cef9fcab79521cc4919f24f15a658aa31f79b0cba3251887fda850e70
              command:
                - cp
                - -r
                - /normalizer/.
                - /opt/normalizer/
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: normalizer
                  mountPath: /opt/normalizer
          containers:
            - name: normalizer
              # The server image, for clickhouse-client.
              image: clickhouse/clickhouse-server:26.8.36.3@sha256:d426d2f612e1e189c90f9a3f8dcd85a03c6851273833817a296bb327e63aa7a7
              command:
                - /opt/normalizer/normalize.sh
                - cron
              env:
                - name: HOME
                  value: /scratch
                - name: SCRATCH
                  value: /scratch
                # clickhouse-client reads it as llm_normalizer's password.
                - name: CLICKHOUSE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: clickhouse-llm-normalizer
                      key: LLM_NORMALIZER_PASSWORD
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              volumeMounts:
                - name: normalizer
                  mountPath: /opt/normalizer
                  readOnly: true
                - name: scratch
                  mountPath: /scratch
          volumes:
            - name: normalizer
              emptyDir: {}
            - name: scratch
              emptyDir:
                sizeLimit: 4Gi
---
# The normalizer only reaches ClickHouse's native port, as llm_normalizer.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: llm-normalizer
  namespace: clickhouse
spec:
  endpointSelector:
    matchLabels:
      app: llm-normalizer
  ingress: []
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: clickhouse
            k8s:app: clickhouse
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
