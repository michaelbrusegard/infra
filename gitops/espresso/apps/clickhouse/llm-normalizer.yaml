# The LLM conversation normalizer of docs/llm-conversations.md: every 10
# minutes, it normalizes the proxy requests that are not in llm.calls yet.
# It starts suspended; the backfill (llm-backfill-job.yaml) runs first, and
# the job is resumed after it, as the design doc's rollout describes.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: llm-normalizer
  namespace: clickhouse
spec:
  schedule: "*/10 * * * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 540
      template:
        metadata:
          labels:
            app: llm-normalizer
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            fsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: install-normalizer
              # CI swaps this for each plugin image it builds, which holds the
              # normalizer in /normalizer.
              image: ghcr.io/michaelbrusegard/cliproxy-plugins:sha-421df0ddcb72e2111319b608734f32bf57880003@sha256:d8b49bfd814002985b28a67c0daa969686abb701350017d8813d7c6185bc6319
              command:
                - cp
                - -r
                - /normalizer/.
                - /opt/normalizer/
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: normalizer
                  mountPath: /opt/normalizer
          containers:
            - name: normalizer
              # The server image, for clickhouse-client.
              image: clickhouse/clickhouse-server:26.8.36.3@sha256:d426d2f612e1e189c90f9a3f8dcd85a03c6851273833817a296bb327e63aa7a7
              command:
                - /opt/normalizer/normalize.sh
                - cron
              env:
                - name: HOME
                  value: /scratch
                - name: SCRATCH
                  value: /scratch
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              volumeMounts:
                - name: normalizer
                  mountPath: /opt/normalizer
                  readOnly: true
                - name: scratch
                  mountPath: /scratch
          volumes:
            - name: normalizer
              emptyDir: {}
            - name: scratch
              emptyDir:
                sizeLimit: 4Gi
---
# The normalizer only reaches ClickHouse's native port, as llm_normalizer.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: llm-normalizer
  namespace: clickhouse
spec:
  endpointSelector:
    matchLabels:
      app: llm-normalizer
  ingress: []
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: clickhouse
            k8s:app: clickhouse
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
