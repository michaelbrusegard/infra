apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: clickhouse
spec:
  selector:
    app: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: http
    # For clickhouse-client in the LLM normalizer; the network policy admits
    # only its pods.
    - name: native
      port: 9000
      targetPort: 9000
