apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse
  namespace: clickhouse
data:
  config.xml: |
    <clickhouse>
      <logger>
        <level>warning</level>
        <console>1</console>
        <log remove="remove"/>
        <errorlog remove="remove"/>
      </logger>

      <!-- HTTP is exposed, and the native port only to the LLM normalizer;
           kubectl exec uses the native port on localhost. -->
      <mysql_port remove="remove"/>
      <postgresql_port remove="remove"/>
      <interserver_http_port remove="remove"/>

      <access_control_improvements>
        <settings_constraints_replace_previous>true</settings_constraints_replace_previous>
      </access_control_improvements>

      <!-- Keep only a short query log; the other system logs grow without bound
           and nothing here reads them. -->
      <query_log>
        <ttl>event_date + INTERVAL 7 DAY DELETE</ttl>
      </query_log>
      <asynchronous_insert_log remove="remove"/>
      <asynchronous_metric_log remove="remove"/>
      <background_schedule_pool_log remove="remove"/>
      <backup_log remove="remove"/>
      <blob_storage_log remove="remove"/>
      <error_log remove="remove"/>
      <latency_log remove="remove"/>
      <metric_log remove="remove"/>
      <opentelemetry_span_log remove="remove"/>
      <part_log remove="remove"/>
      <processors_profile_log remove="remove"/>
      <query_metric_log remove="remove"/>
      <query_thread_log remove="remove"/>
      <query_views_log remove="remove"/>
      <s3queue_log remove="remove"/>
      <session_log remove="remove"/>
      <text_log remove="remove"/>
      <trace_log remove="remove"/>
    </clickhouse>
  users.xml: |
    <clickhouse>
      <profiles>
        <!-- Reject rows with unknown columns instead of dropping the fields:
             a plugin writing a column the table lacks must fail loudly, not
             lose the value. -->
        <cliproxy>
          <profile>default</profile>
          <input_format_skip_unknown_fields>0</input_format_skip_unknown_fields>
        </cliproxy>
        <!-- The normalizer joins each trace's usage with its requests, which
             grows with the square of a websocket trace's calls; one hour
             of them needed 3.7 GiB in memory. Spill joins, sorts and
             aggregations to disk instead of failing. -->
        <llm_normalizer>
          <profile>default</profile>
          <join_algorithm>auto</join_algorithm>
          <max_bytes_in_join>1073741824</max_bytes_in_join>
          <max_bytes_before_external_group_by>1073741824</max_bytes_before_external_group_by>
          <max_bytes_before_external_sort>1073741824</max_bytes_before_external_sort>
        </llm_normalizer>
        <grafana>
          <readonly>1</readonly>
          <max_execution_time>30</max_execution_time>
          <max_memory_usage>536870912</max_memory_usage>
          <max_threads>2</max_threads>
          <max_result_rows>100000</max_result_rows>
          <constraints>
            <!-- Queries use 30s; the driver's connection health check uses 60s. -->
            <max_execution_time>
              <min>1</min>
              <max>60</max>
              <changeable_in_readonly/>
            </max_execution_time>
          </constraints>
        </grafana>
      </profiles>
      <users>
        <!-- Admin access is kubectl exec only. -->
        <default>
          <networks replace="replace">
            <ip>::1</ip>
            <ip>127.0.0.1</ip>
          </networks>
        </default>
        <!-- CLIProxyAPI can append but never read. The network policy limits
             who can reach the port, so the insert-only user needs no secret. -->
        <cliproxy>
          <no_password/>
          <networks>
            <ip>::/0</ip>
          </networks>
          <profile>cliproxy</profile>
          <quota>default</quota>
          <grants>
            <query>GRANT INSERT ON llm.requests</query>
            <query>GRANT INSERT ON llm.request_items</query>
            <query>GRANT INSERT ON llm.usage</query>
          </grants>
        </cliproxy>
        <!-- The LLM normalizer reads the raw capture and the state of the
             canonical tables, and appends to the canonical tables. Pods that
             reach the HTTP port, such as CLIProxy's and Grafana's, could
             otherwise read the raw history as this user, so it needs the
             password of the clickhouse-llm-normalizer secret; only its pods
             have that secret and reach the native port. No network tells
             its pods from theirs. -->
        <llm_normalizer>
          <password from_env="LLM_NORMALIZER_PASSWORD"/>
          <networks>
            <ip>::/0</ip>
          </networks>
          <profile>llm_normalizer</profile>
          <quota>default</quota>
          <grants>
            <query>GRANT SELECT ON llm.requests</query>
            <query>GRANT SELECT ON llm.request_items</query>
            <query>GRANT SELECT ON llm.usage</query>
            <query>GRANT SELECT, INSERT ON llm.sessions</query>
            <query>GRANT SELECT, INSERT ON llm.messages</query>
            <query>GRANT SELECT, INSERT ON llm.calls</query>
            <query>GRANT INSERT ON llm.request_items</query>
          </grants>
        </llm_normalizer>
        <!-- Network policy trusts only CLIProxy and Grafana pods. As with the
             writer, authentication is at that boundary; allowed pods can select
             either passwordless identity, but not the normalizer's. Expose only
             the metrics view here. -->
        <grafana>
          <no_password/>
          <networks>
            <ip>::/0</ip>
          </networks>
          <profile>grafana</profile>
          <quota>default</quota>
          <grants>
            <query>GRANT SELECT ON llm.usage_metrics</query>
          </grants>
        </grafana>
      </users>
    </clickhouse>
  schema.sql: |
    CREATE DATABASE IF NOT EXISTS llm;

    -- One row per proxied model request, written by the archive plugin.
    -- trace_id identifies the inbound HTTP request. Each request body is an
    -- envelope plus references into llm.request_items; llm.request_bodies
    -- rebuilds whole bodies.
    CREATE TABLE IF NOT EXISTS llm.requests
    (
        request_id String,
        trace_id String,
        session_id String,
        started_at DateTime64(3, 'UTC'),
        completed_at DateTime64(3, 'UTC'),
        source_format LowCardinality(String),
        model LowCardinality(String),
        requested_model LowCardinality(String),
        stream Bool,
        outcome LowCardinality(String),
        status_code UInt16,
        error String,
        user_agent LowCardinality(String),
        truncated Bool,
        -- The body's top-level keys that were not split off, as a JSON object.
        -- Empty when the body is not a JSON object.
        request_envelope String CODEC(ZSTD(3)),
        -- The split-off items in body order. position is the index within a
        -- top-level array, or -1 for a whole value.
        request_parts Array(Tuple(field LowCardinality(String), position Int32, hash UInt128)) CODEC(ZSTD(3)),
        response_body String CODEC(ZSTD(3))
    )
    ENGINE = MergeTree
    PARTITION BY toYYYYMM(started_at)
    -- Requests in one session reference mostly the same items; keeping them
    -- adjacent makes their part lists compress.
    ORDER BY (session_id, started_at, request_id);

    -- Each distinct message, tool, or large value of a request body, stored
    -- once however many turns resend it. packages/cliproxy-plugins/requestitems
    -- defines the split. hash is reinterpretAsUInt128(substring(SHA256(item), 1, 16)).
    CREATE TABLE IF NOT EXISTS llm.request_items
    (
        hash UInt128,
        item String CODEC(ZSTD(3))
    )
    ENGINE = ReplacingMergeTree
    ORDER BY hash;

    -- Whole request bodies. Split keys follow the envelope's keys, otherwise
    -- the JSON is unchanged apart from whitespace. Each body is rebuilt in
    -- full, so filter by request, session, or time.
    CREATE OR REPLACE VIEW llm.request_bodies AS
    SELECT
        request_id, trace_id, session_id, started_at,
        if(envelope = '', tupleElement(parts[1], 4), concat(
            substring(envelope, 1, length(envelope) - 1),
            arrayStringConcat(arrayMap(k -> concat(
                -- Open a key at its first item, and close arrays at their last.
                if(tupleElement(parts[k], 3) <= 0,
                    concat(if(k = 1 AND envelope = '{}', '', ','), '"', tupleElement(parts[k], 2), '":',
                        if(tupleElement(parts[k], 3) = 0, '[', '')),
                    ','),
                tupleElement(parts[k], 4),
                if(tupleElement(parts[k], 3) >= 0
                    AND (k = length(parts) OR tupleElement(parts[k + 1], 3) <= 0), ']', '')),
                arrayEnumerate(parts))),
            '}')) AS request_body
    FROM (
        SELECT
            p.request_id AS request_id, p.trace_id AS trace_id,
            p.session_id AS session_id, p.started_at AS started_at,
            any(p.request_envelope) AS envelope,
            -- Items are unique only after merges; duplicates are identical.
            arraySort(arrayDistinct(groupArrayIf((p.n, p.field, p.position, i.item), p.n > 0))) AS parts
        -- Items on the probe side get a runtime filter from the selected
        -- requests' hashes, rather than every item being loaded to join.
        FROM llm.request_items AS i
        RIGHT JOIN (
            SELECT
                request_id, trace_id, session_id, started_at, request_envelope,
                part.field AS field, part.position AS position, part.hash AS hash, n
            FROM llm.requests
            LEFT ARRAY JOIN request_parts AS part, arrayEnumerate(request_parts) AS n
        ) AS p ON i.hash = p.hash
        GROUP BY request_id, trace_id, session_id, started_at
    );

    -- One row per upstream attempt, so retries show up as extra rows. Join to
    -- llm.requests on trace_id.
    CREATE TABLE IF NOT EXISTS llm.usage
    (
        request_id String,
        trace_id String,
        session_id String,
        parent_session_id String,
        requested_at DateTime64(3, 'UTC'),
        provider LowCardinality(String),
        executor_type LowCardinality(String),
        model LowCardinality(String),
        alias LowCardinality(String),
        response_model LowCardinality(String),
        auth_id LowCardinality(String),
        auth_type LowCardinality(String),
        reasoning_effort LowCardinality(String),
        service_tier LowCardinality(String),
        effective_service_tier LowCardinality(String),
        response_service_tier LowCardinality(String),
        stream Bool,
        failed Bool,
        failure_status UInt16,
        failure_body String,
        latency_ms UInt32,
        ttft_ms UInt32,
        input_tokens UInt64,
        output_tokens UInt64,
        reasoning_tokens UInt64,
        cached_tokens UInt64,
        cache_read_tokens UInt64,
        cache_creation_tokens UInt64,
        total_tokens UInt64,
        response_headers Map(String, String)
    )
    ENGINE = MergeTree
    PARTITION BY toYYYYMM(requested_at)
    ORDER BY (requested_at, trace_id, request_id);

    -- Canonical LLM conversations, written by
    -- packages/cliproxy-plugins/normalize-conversations. Proxy rows
    -- reference the raw capture above instead of copying it, and can be
    -- dropped and rebuilt from it. Transcript rows were imported once from a
    -- dump of agent logs that is dropped since, so they hold their own
    -- content.

    -- What does not change as a session grows, per source: a session captured
    -- by both the proxy and transcripts has a row for the proxy and one for each
    -- transcript file, by host and path. The transcripts' messages end where the
    -- proxy's calls begin.
    CREATE TABLE IF NOT EXISTS llm.sessions
    (
        session_id String,
        parent_session_id String,
        client LowCardinality(String),
        origin LowCardinality(String),
        host LowCardinality(String),
        path String,
        title String,
        cwd String
    )
    ENGINE = ReplacingMergeTree
    ORDER BY (session_id, origin, host, path);

    -- One row per node of a session's conversation tree. A node's ID covers its
    -- parent's, so resent context maps to existing nodes. A proxy message's raw
    -- source is referenced: an input by the llm.request_items hash it was read
    -- from (zero when the request's envelope held it), an output by call_id,
    -- whose llm.requests row holds the response. A transcript message's blocks
    -- are all that is kept of it; host, path, and line name the line it came
    -- from, and part what inside the line, if not the whole line. A node written again keeps the row with the
    -- highest version: a model's output over a resent copy, then the earliest,
    -- whatever order the calls were normalized in.
    CREATE TABLE IF NOT EXISTS llm.messages
    (
        session_id String,
        id UInt128,
        parent_id UInt128,
        seq UInt32,
        ts DateTime64(3, 'UTC'),
        role LowCardinality(String),
        output Bool,
        model LowCardinality(String),
        call_id String,
        blocks Array(Tuple(
            type LowCardinality(String),
            source_type LowCardinality(String),
            text String,
            tool_name LowCardinality(String),
            tool_namespace LowCardinality(String),
            tool_call_id String,
            tool_input String,
            is_error Bool,
            media LowCardinality(String))) CODEC(ZSTD(3)),
        format LowCardinality(String),
        item UInt128,
        host LowCardinality(String),
        path String,
        line String,
        part String,
        version UInt64
    )
    ENGINE = ReplacingMergeTree(version)
    -- Conversation order keeps a session's text adjacent, which compresses.
    ORDER BY (session_id, seq, id);

    -- One row per model call. A proxy call names its llm.requests row, which
    -- holds the request and response bodies, trace, status, and error. A
    -- transcript call names its file by host and path, and carries the usage its
    -- lines recorded and, for Claude Code calls with a request log, the system
    -- prompt and tools as items in context, split as request_parts are.
    CREATE TABLE IF NOT EXISTS llm.calls
    (
        call_id String,
        session_id String,
        response_id String,
        started_at DateTime64(3, 'UTC'),
        completed_at DateTime64(3, 'UTC'),
        origin LowCardinality(String),
        client LowCardinality(String),
        request_id String,
        host LowCardinality(String),
        path String,
        source_format LowCardinality(String),
        model LowCardinality(String),
        input_id UInt128,
        output_ids Array(UInt128),
        uncached_input_tokens UInt64,
        cache_read_tokens UInt64,
        cache_write_tokens UInt64,
        cache_write_5m_tokens UInt64,
        cache_write_1h_tokens UInt64,
        output_tokens UInt64,
        reasoning_tokens UInt64,
        context Array(Tuple(field LowCardinality(String), position Int32, hash UInt128))
    )
    ENGINE = ReplacingMergeTree
    PARTITION BY toYYYYMM(started_at)
    ORDER BY (session_id, started_at, call_id);

    -- How transcript sessions went, where no message or call records it: API
    -- errors, refusal fallbacks, interrupted turns, and rollbacks, each with a
    -- detail such as the error. Files that share a session, such as one synced
    -- to two hosts, share line numbers and times, so the file is part of the
    -- key.
    CREATE TABLE IF NOT EXISTS llm.events
    (
        session_id String,
        ts DateTime64(3, 'UTC'),
        host LowCardinality(String),
        path String,
        line String,
        type LowCardinality(String),
        detail String
    )
    ENGINE = ReplacingMergeTree
    ORDER BY (session_id, ts, host, path, line);

    -- Usage history from before the proxy: one row per transcript call with
    -- usage. The provider follows the model.
    CREATE OR REPLACE VIEW llm.call_history AS
    SELECT
        c.call_id AS event_id, c.client AS source, c.host AS host, c.session_id AS session_id,
        c.started_at AS requested_at,
        multiIf(startsWith(c.model, 'claude-'), 'claude', startsWith(c.model, 'gpt-'), 'codex',
            startsWith(c.model, 'kimi-'), 'kimi', startsWith(c.model, 'gemini-'), 'gemini', 'unknown') AS provider,
        if(c.model = '', '(unknown)', c.model) AS model,
        c.uncached_input_tokens AS uncached_input_tokens, c.cache_read_tokens AS cache_read_tokens,
        c.cache_write_tokens AS cache_creation_tokens, c.cache_write_5m_tokens AS cache_write_5m_tokens,
        c.cache_write_1h_tokens AS cache_write_1h_tokens, c.output_tokens AS output_tokens,
        least(c.reasoning_tokens, c.output_tokens) AS reasoning_tokens
    FROM llm.calls AS c FINAL
    WHERE c.origin = 'transcript'
        AND c.uncached_input_tokens + c.cache_read_tokens + c.cache_write_tokens + c.output_tokens > 0;

    -- Grafana cannot read prompt bodies, failure bodies, headers, or account IDs.
    -- A definer view lets it query metrics without access to the source table.
    -- Current standard API-equivalent USD rates, verified 2026-11-09:
    -- https://developers.openai.com/api/docs/models/gpt-6.2-sol (verified 2026-11-19)
    -- https://developers.openai.com/api/docs/models/gpt-6.2-astra (verified 2026-11-19)
    -- https://developers.openai.com/api/docs/models/gpt-6.1-sol
    -- https://developers.openai.com/api/docs/models/gpt-6-astra
    -- https://developers.openai.com/api/docs/models/gpt-6-luna
    -- https://developers.openai.com/api/docs/models/gpt-5.6-sol
    -- https://developers.openai.com/api/docs/models/gpt-5.5
    -- https://developers.openai.com/api/docs/models/gpt-5.4
    -- https://developers.openai.com/api/docs/models/gpt-5.4-mini
    -- https://developers.openai.com/api/docs/models/gpt-6.1-terra
    -- https://platform.claude.com/docs/en/about-claude/pricing
    -- https://platform.kimi.ai/docs/pricing/chat (verified 2026-11-15)
    -- https://aistudio.google.com/docs/pricing (verified 2026-11-15)
    -- Unknown models and cache writes with unknown TTL are explicitly unpriced.
    -- Speed/region/tool fees and subscription billing are outside this estimate.
    CREATE OR REPLACE VIEW llm.usage_metrics
    DEFINER = default SQL SECURITY DEFINER AS
    WITH
        u.cache_read_tokens AS read_tokens,
        u.cache_creation_tokens AS write_tokens,
        u.uncached_input_tokens AS fresh_tokens,
        fresh_tokens + read_tokens + write_tokens AS all_input_tokens,
        -- USD per million tokens: input, reads, output, 5m writes, 1h writes.
        -- Zero write rates mean the archived TTL is insufficient to price them.
        multiIf(
            provider = 'codex' AND model = 'gpt-6.2-sol', tuple(2., 0.1, 10., 0., 0.),
            provider = 'codex' AND model = 'gpt-6.2-astra', tuple(8., 0.4, 40., 0., 0.),
            provider = 'codex' AND model = 'gpt-6.1-sol', tuple(2., 0.1, 10., 0., 0.),
            provider = 'codex' AND model = 'gpt-6.1-terra', tuple(1., 0.05, 5., 0., 0.),
            provider = 'codex' AND model = 'gpt-6-sol', tuple(2., 0.2, 10., 0., 0.),
            provider = 'codex' AND model = 'gpt-6-astra', tuple(10., 1., 50., 0., 0.),
            provider = 'codex' AND model = 'gpt-6-luna', tuple(0.1, 0.01, 0.5, 0., 0.),
            provider = 'codex' AND model = 'gpt-5.6-sol', tuple(4., 0.4, 20., 0., 0.),
            provider = 'codex' AND model = 'gpt-5.5', tuple(5., 0.5, 30., 0., 0.),
            provider = 'codex' AND model = 'gpt-5.4', tuple(2.5, 0.25, 15., 0., 0.),
            provider = 'codex' AND model = 'gpt-5.4-mini', tuple(0.75, 0.075, 4.5, 0., 0.),
            provider = 'claude' AND model = 'claude-opus-5-5', tuple(4., 0.2, 20., 5., 8.),
            provider = 'claude' AND model IN ('claude-opus-5', 'claude-opus-4-8', 'claude-opus-4-7'),
                tuple(5., 0.5, 25., 6.25, 10.),
            provider = 'claude' AND model = 'claude-fable-5-2', tuple(8., 0.2, 40., 10., 16.),
            provider = 'claude' AND model = 'claude-fable-5-1', tuple(10., 0.25, 50., 12.5, 20.),
            provider = 'claude' AND model = 'claude-fable-5', tuple(10., 1., 50., 12.5, 20.),
            provider = 'claude' AND model = 'claude-haiku-4-5', tuple(1., 0.1, 5., 1.25, 2.),
            provider = 'claude' AND model = 'claude-sonnet-4-6', tuple(3., 0.3, 15., 3.75, 6.),
            -- Kimi through its own API or its Anthropic-compatible one.
            model = 'kimi-k3.1-pro', tuple(2., 0.2, 10., 2., 4.),
            model = 'kimi-k3', tuple(3., 0.3, 15., 3., 6.),
            -- Gemini's long prompts have other rates, which are left unpriced.
            provider = 'gemini' AND model = 'gemini-3.1-pro-preview' AND all_input_tokens <= 200000,
                tuple(2., 0.2, 12., 0., 0.),
            tuple(0., 0., 0., 0., 0.)) AS rates,
        rates.1 > 0 AND (write_tokens = 0 OR
            (rates.4 > 0 AND u.cache_write_5m_tokens + u.cache_write_1h_tokens = write_tokens)) AS priced,
        provider = 'codex' AND model != 'gpt-5.4-mini' AND all_input_tokens > 272000 AS long_context
    SELECT
        requested_at, provider, model, auth_type, trace_id, origin,
        failed, failure_status, latency_ms, ttft_ms,
        all_input_tokens AS input_tokens,
        output_tokens, reasoning_tokens,
        read_tokens AS cache_read_tokens, write_tokens AS cache_creation_tokens,
        fresh_tokens AS uncached_input_tokens,
        all_input_tokens + output_tokens AS total_tokens,
        if(priced,
            ((fresh_tokens * rates.1 + read_tokens * rates.2
                + u.cache_write_5m_tokens * rates.4 + u.cache_write_1h_tokens * rates.5) * if(long_context, 2., 1.)
                + output_tokens * rates.3 * if(long_context, 1.5, 1.)) / 1000000.,
            NULL) AS estimated_cost_usd
    FROM (
        SELECT
            requested_at, provider, model, auth_type, trace_id, 'live' AS origin,
            failed, failure_status, latency_ms, ttft_ms,
            greatest(live.cache_read_tokens, if(provider = 'claude', 0, live.cached_tokens)) AS reads,
            cache_creation_tokens,
            if(provider = 'claude', input_tokens,
                toUInt64(greatest(toInt64(input_tokens) - toInt64(reads) - toInt64(cache_creation_tokens), 0))) AS uncached_input_tokens,
            reads AS cache_read_tokens,
            -- llm.usage has no TTL split of cache writes. A trace's one proxy
            -- call has it from the response, which is the attempt's when
            -- that attempt alone in the trace wrote as much.
            split.writes_5m AS cache_write_5m_tokens,
            split.writes_1h AS cache_write_1h_tokens,
            output_tokens, reasoning_tokens
        FROM llm.usage AS live
        LEFT JOIN (
            SELECT c.split_trace AS split_trace, c.writes AS writes, c.writes_5m AS writes_5m,
                c.writes_1h AS writes_1h
            FROM (
                SELECT r.trace_id AS split_trace, sum(k.cache_write_tokens) AS writes,
                    sum(k.cache_write_5m_tokens) AS writes_5m, sum(k.cache_write_1h_tokens) AS writes_1h
                FROM llm.calls AS k FINAL
                INNER JOIN llm.requests AS r ON r.request_id = k.request_id
                WHERE k.origin = 'proxy'
                GROUP BY r.trace_id
                HAVING count() = 1
            ) AS c
            INNER JOIN (
                SELECT trace_id, cache_creation_tokens FROM llm.usage
                GROUP BY trace_id, cache_creation_tokens
                HAVING count() = 1
            ) AS a ON a.trace_id = c.split_trace AND a.cache_creation_tokens = c.writes
        ) AS split ON split.split_trace = live.trace_id AND split.writes = live.cache_creation_tokens
        UNION ALL
        SELECT
            requested_at, provider, model, 'history' AS auth_type, event_id AS trace_id,
            concat('history:', source) AS origin,
            CAST(NULL AS Nullable(Bool)), CAST(NULL AS Nullable(UInt16)),
            CAST(NULL AS Nullable(UInt32)), CAST(NULL AS Nullable(UInt32)),
            cache_read_tokens AS reads, cache_creation_tokens, uncached_input_tokens, cache_read_tokens,
            cache_write_5m_tokens, cache_write_1h_tokens, output_tokens, reasoning_tokens
        FROM llm.call_history
        -- A fixed handover avoids counting transcript copies of proxied calls.
        WHERE requested_at < (SELECT min(requested_at) FROM llm.usage)
    ) AS u;
