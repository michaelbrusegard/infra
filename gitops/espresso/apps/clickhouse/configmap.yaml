apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse
  namespace: clickhouse
data:
  config.xml: |
    <clickhouse>
      <logger>
        <level>warning</level>
        <console>1</console>
        <log remove="remove"/>
        <errorlog remove="remove"/>
      </logger>

      <!-- Only HTTP is exposed; kubectl exec uses the native port on localhost. -->
      <mysql_port remove="remove"/>
      <postgresql_port remove="remove"/>
      <interserver_http_port remove="remove"/>

      <access_control_improvements>
        <settings_constraints_replace_previous>true</settings_constraints_replace_previous>
      </access_control_improvements>

      <!-- Keep only a short query log; the other system logs grow without bound
           and nothing here reads them. -->
      <query_log>
        <ttl>event_date + INTERVAL 7 DAY DELETE</ttl>
      </query_log>
      <asynchronous_insert_log remove="remove"/>
      <asynchronous_metric_log remove="remove"/>
      <background_schedule_pool_log remove="remove"/>
      <backup_log remove="remove"/>
      <blob_storage_log remove="remove"/>
      <error_log remove="remove"/>
      <latency_log remove="remove"/>
      <metric_log remove="remove"/>
      <opentelemetry_span_log remove="remove"/>
      <part_log remove="remove"/>
      <processors_profile_log remove="remove"/>
      <query_metric_log remove="remove"/>
      <query_thread_log remove="remove"/>
      <query_views_log remove="remove"/>
      <s3queue_log remove="remove"/>
      <session_log remove="remove"/>
      <text_log remove="remove"/>
      <trace_log remove="remove"/>
    </clickhouse>
  users.xml: |
    <clickhouse>
      <profiles>
        <grafana>
          <readonly>1</readonly>
          <max_execution_time>30</max_execution_time>
          <max_memory_usage>536870912</max_memory_usage>
          <max_threads>2</max_threads>
          <max_result_rows>100000</max_result_rows>
          <constraints>
            <!-- Queries use 30s; the driver's connection health check uses 60s. -->
            <max_execution_time>
              <min>1</min>
              <max>60</max>
              <changeable_in_readonly/>
            </max_execution_time>
          </constraints>
        </grafana>
      </profiles>
      <users>
        <!-- Admin access is kubectl exec only. -->
        <default>
          <networks replace="replace">
            <ip>::1</ip>
            <ip>127.0.0.1</ip>
          </networks>
        </default>
        <!-- CLIProxyAPI can append but never read. The network policy limits
             who can reach the port, so the insert-only user needs no secret. -->
        <cliproxy>
          <no_password/>
          <networks>
            <ip>::/0</ip>
          </networks>
          <profile>default</profile>
          <quota>default</quota>
          <grants>
            <query>GRANT INSERT ON llm.requests</query>
            <query>GRANT INSERT ON llm.usage</query>
          </grants>
        </cliproxy>
        <!-- Network policy trusts only CLIProxy and Grafana pods. As with the
             writer, authentication is at that boundary; allowed pods can select
             either passwordless identity. Expose only the metrics view here. -->
        <grafana>
          <no_password/>
          <networks>
            <ip>::/0</ip>
          </networks>
          <profile>grafana</profile>
          <quota>default</quota>
          <grants>
            <query>GRANT SELECT ON llm.usage_metrics</query>
          </grants>
        </grafana>
      </users>
    </clickhouse>
  schema.sql: |
    CREATE DATABASE IF NOT EXISTS llm;

    -- One row per proxied model request, written by the archive plugin.
    -- trace_id identifies the inbound HTTP request.
    CREATE TABLE IF NOT EXISTS llm.requests
    (
        request_id String,
        trace_id String,
        session_id String,
        started_at DateTime64(3, 'UTC'),
        completed_at DateTime64(3, 'UTC'),
        source_format LowCardinality(String),
        model LowCardinality(String),
        requested_model LowCardinality(String),
        stream Bool,
        outcome LowCardinality(String),
        status_code UInt16,
        error String,
        user_agent LowCardinality(String),
        truncated Bool,
        request_body String CODEC(ZSTD(3)),
        response_body String CODEC(ZSTD(3))
    )
    ENGINE = MergeTree
    PARTITION BY toYYYYMM(started_at)
    -- Requests in one session resend the same context; keeping them adjacent
    -- is what makes the bodies compress.
    ORDER BY (session_id, started_at, request_id);

    -- One row per upstream attempt, so retries show up as extra rows. Join to
    -- llm.requests on trace_id.
    CREATE TABLE IF NOT EXISTS llm.usage
    (
        request_id String,
        trace_id String,
        session_id String,
        parent_session_id String,
        requested_at DateTime64(3, 'UTC'),
        provider LowCardinality(String),
        executor_type LowCardinality(String),
        model LowCardinality(String),
        alias LowCardinality(String),
        response_model LowCardinality(String),
        auth_id LowCardinality(String),
        auth_type LowCardinality(String),
        reasoning_effort LowCardinality(String),
        service_tier LowCardinality(String),
        effective_service_tier LowCardinality(String),
        response_service_tier LowCardinality(String),
        stream Bool,
        failed Bool,
        failure_status UInt16,
        failure_body String,
        latency_ms UInt32,
        ttft_ms UInt32,
        input_tokens UInt64,
        output_tokens UInt64,
        reasoning_tokens UInt64,
        cached_tokens UInt64,
        cache_read_tokens UInt64,
        cache_creation_tokens UInt64,
        total_tokens UInt64,
        response_headers Map(String, String)
    )
    ENGINE = MergeTree
    PARTITION BY toYYYYMM(requested_at)
    ORDER BY (requested_at, trace_id, request_id);

    -- One normalized usage record per historical provider response. This table
    -- is populated by packages/llm-usage-backfill, never by the live proxy.
    CREATE TABLE IF NOT EXISTS llm.historical_usage
    (
        event_id String,
        source LowCardinality(String),
        host LowCardinality(String),
        session_id String,
        requested_at DateTime64(3, 'UTC'),
        provider LowCardinality(String),
        model LowCardinality(String),
        uncached_input_tokens UInt64,
        cache_read_tokens UInt64,
        cache_creation_tokens UInt64,
        cache_write_5m_tokens UInt64,
        cache_write_1h_tokens UInt64,
        output_tokens UInt64,
        reasoning_tokens UInt64,
        ingested_at DateTime64(3) DEFAULT now64(3)
    )
    ENGINE = ReplacingMergeTree(ingested_at)
    ORDER BY event_id;

    -- Grafana cannot read prompt bodies, failure bodies, headers, or account IDs.
    -- A definer view lets it query metrics without access to the source table.
    -- Current standard API-equivalent USD rates, verified 2026-11-09:
    -- https://developers.openai.com/api/docs/models/gpt-6.1-sol
    -- https://developers.openai.com/api/docs/models/gpt-6-astra
    -- https://developers.openai.com/api/docs/models/gpt-6-luna
    -- https://developers.openai.com/api/docs/models/gpt-5.6-sol
    -- https://developers.openai.com/api/docs/models/gpt-5.5
    -- https://developers.openai.com/api/docs/models/gpt-5.4
    -- https://developers.openai.com/api/docs/models/gpt-5.4-mini
    -- https://platform.claude.com/docs/en/about-claude/pricing
    -- Unknown models and cache writes with unknown TTL are explicitly unpriced.
    -- Speed/region/tool fees and subscription billing are outside this estimate.
    CREATE OR REPLACE VIEW llm.usage_metrics
    DEFINER = default SQL SECURITY DEFINER AS
    WITH
        u.cache_read_tokens AS read_tokens,
        u.cache_creation_tokens AS write_tokens,
        u.uncached_input_tokens AS fresh_tokens,
        fresh_tokens + read_tokens + write_tokens AS all_input_tokens,
        -- USD per million tokens: input, reads, output, 5m writes, 1h writes.
        -- Zero write rates mean the archived TTL is insufficient to price them.
        multiIf(
            provider = 'codex' AND model = 'gpt-6.1-sol', tuple(2., 0.1, 10., 0., 0.),
            provider = 'codex' AND model = 'gpt-6-sol', tuple(2., 0.2, 10., 0., 0.),
            provider = 'codex' AND model = 'gpt-6-astra', tuple(10., 1., 50., 0., 0.),
            provider = 'codex' AND model = 'gpt-6-luna', tuple(0.1, 0.01, 0.5, 0., 0.),
            provider = 'codex' AND model = 'gpt-5.6-sol', tuple(4., 0.4, 20., 0., 0.),
            provider = 'codex' AND model = 'gpt-5.5', tuple(5., 0.5, 30., 0., 0.),
            provider = 'codex' AND model = 'gpt-5.4', tuple(2.5, 0.25, 15., 0., 0.),
            provider = 'codex' AND model = 'gpt-5.4-mini', tuple(0.75, 0.075, 4.5, 0., 0.),
            provider = 'claude' AND model = 'claude-opus-5-5', tuple(4., 0.2, 20., 5., 8.),
            provider = 'claude' AND model IN ('claude-opus-5', 'claude-opus-4-8', 'claude-opus-4-7'),
                tuple(5., 0.5, 25., 6.25, 10.),
            provider = 'claude' AND model = 'claude-fable-5-1', tuple(10., 0.25, 50., 12.5, 20.),
            provider = 'claude' AND model = 'claude-fable-5', tuple(10., 1., 50., 12.5, 20.),
            provider = 'claude' AND model = 'claude-haiku-4-5', tuple(1., 0.1, 5., 1.25, 2.),
            provider = 'claude' AND model = 'claude-sonnet-4-6', tuple(3., 0.3, 15., 3.75, 6.),
            tuple(0., 0., 0., 0., 0.)) AS rates,
        rates.1 > 0 AND (write_tokens = 0 OR
            (rates.4 > 0 AND u.cache_write_5m_tokens + u.cache_write_1h_tokens = write_tokens)) AS priced,
        provider = 'codex' AND model != 'gpt-5.4-mini' AND all_input_tokens > 272000 AS long_context
    SELECT
        requested_at, provider, model, auth_type, trace_id, origin,
        failed, failure_status, latency_ms, ttft_ms,
        all_input_tokens AS input_tokens,
        output_tokens, reasoning_tokens,
        read_tokens AS cache_read_tokens, write_tokens AS cache_creation_tokens,
        fresh_tokens AS uncached_input_tokens,
        all_input_tokens + output_tokens AS total_tokens,
        if(priced,
            ((fresh_tokens * rates.1 + read_tokens * rates.2
                + u.cache_write_5m_tokens * rates.4 + u.cache_write_1h_tokens * rates.5) * if(long_context, 2., 1.)
                + output_tokens * rates.3 * if(long_context, 1.5, 1.)) / 1000000.,
            NULL) AS estimated_cost_usd
    FROM (
        SELECT
            requested_at, provider, model, auth_type, trace_id, 'live' AS origin,
            failed, failure_status, latency_ms, ttft_ms,
            greatest(live.cache_read_tokens, if(provider = 'claude', 0, live.cached_tokens)) AS reads,
            cache_creation_tokens,
            if(provider = 'claude', input_tokens,
                toUInt64(greatest(toInt64(input_tokens) - toInt64(reads) - toInt64(cache_creation_tokens), 0))) AS uncached_input_tokens,
            reads AS cache_read_tokens,
            toUInt64(0) AS cache_write_5m_tokens, toUInt64(0) AS cache_write_1h_tokens,
            output_tokens, reasoning_tokens
        FROM llm.usage AS live
        UNION ALL
        SELECT
            requested_at, provider, model, 'history' AS auth_type, event_id AS trace_id,
            concat('history:', source) AS origin,
            CAST(NULL AS Nullable(Bool)), CAST(NULL AS Nullable(UInt16)),
            CAST(NULL AS Nullable(UInt32)), CAST(NULL AS Nullable(UInt32)),
            cache_read_tokens AS reads, cache_creation_tokens, uncached_input_tokens, cache_read_tokens,
            cache_write_5m_tokens, cache_write_1h_tokens, output_tokens, reasoning_tokens
        FROM llm.historical_usage FINAL
        -- A fixed handover avoids counting transcript copies of proxied calls.
        -- The importer applies the same boundary before creating any rows.
        WHERE requested_at < (SELECT min(requested_at) FROM llm.usage)
    ) AS u;

    -- Raw agent transcript lines from a one-off backfill of each machine's
    -- local history. Agent filenames can repeat under different parent sessions,
    -- so the source file is part of the key used to replace repeated imports.
    CREATE TABLE IF NOT EXISTS llm.transcripts
    (
        source LowCardinality(String),
        host LowCardinality(String),
        session String,
        id String,
        path String,
        line String CODEC(ZSTD(3)),
        ts DateTime64(3, 'UTC') DEFAULT parseDateTime64BestEffortOrZero(JSONExtractString(line, 'timestamp'), 3, 'UTC'),
        ingested_at DateTime DEFAULT now()
    )
    ENGINE = ReplacingMergeTree(ingested_at)
    ORDER BY (source, host, session, path, id);
