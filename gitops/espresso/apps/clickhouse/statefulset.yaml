apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: clickhouse
spec:
  replicas: 1
  serviceName: clickhouse
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
      annotations:
        configmap.reloader.stakater.com/reload: clickhouse
        secret.reloader.stakater.com/reload: clickhouse-llm-normalizer
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:26.8.36.3@sha256:d426d2f612e1e189c90f9a3f8dcd85a03c6851273833817a296bb327e63aa7a7
          # ClickHouse treats an empty from_env password as no password, and
          # Kubernetes accepts an empty secret value, so refuse to start.
          command:
            - /bin/sh
            - -c
            - |
              if [ -z "${LLM_NORMALIZER_PASSWORD:-}" ]; then
                echo "LLM_NORMALIZER_PASSWORD is unset or empty; refusing to start" >&2
                exit 1
              fi
              exec /entrypoint.sh
          env:
            # users.xml owns the default user; the entrypoint must not rewrite it.
            - name: CLICKHOUSE_SKIP_USER_SETUP
              value: "1"
            # schema.sql is idempotent, so new tables land on restart.
            - name: CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS
              value: "1"
            # users.xml reads llm_normalizer's password from it. An unset or
            # empty password would let any pod that reaches the HTTP port
            # use that user, so the secret is required.
            - name: LLM_NORMALIZER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-llm-normalizer
                  key: LLM_NORMALIZER_PASSWORD
          ports:
            - name: http
              containerPort: 8123
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              # Normalizer runs need headroom beside the archive's inserts.
              memory: 8Gi
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: config
              mountPath: /etc/clickhouse-server/config.d/archive.xml
              subPath: config.xml
            - name: config
              mountPath: /etc/clickhouse-server/users.d/archive.xml
              subPath: users.xml
            - name: config
              mountPath: /docker-entrypoint-initdb.d/schema.sql
              subPath: schema.sql
      volumes:
        - name: config
          configMap:
            name: clickhouse
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        # Repeated context is stored once, but the archive only ever accumulates.
        # The SATA pools have the room, and there are no backups to restore.
        storageClassName: ssd-ha
        resources:
          requests:
            # The live PVC was expanded to 75Gi for the request_items
            # migration; a StatefulSet cannot change this field in place.
            storage: 50Gi
