apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: clickhouse
  namespace: clickhouse
spec:
  endpointSelector:
    matchLabels:
      app: clickhouse
  ingress:
    # Kubelet probes.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8123"
              protocol: TCP
    # CLIProxyAPI's archive plugin writes requests and usage. Reads go
    # through kubectl exec as the localhost-only default user.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cliproxy
            k8s:app: cliproxy
      toPorts:
        - ports:
            - port: "8123"
              protocol: TCP
    # Grafana's backend queries the metrics view; no browser-to-database route.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: grafana
            k8s:app.kubernetes.io/instance: kube-prometheus-stack
      toPorts:
        - ports:
            - port: "8123"
              protocol: TCP
    # Kuma can check health without accessing the database HTTP interface.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: uptime-kuma
            k8s:app: uptime-kuma
      toPorts:
        - ports:
            - port: "8123"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: "^/ping$"
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
