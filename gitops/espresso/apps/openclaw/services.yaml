apiVersion: v1
kind: Service
metadata:
  name: openclaw-internal
  namespace: openclaw
spec:
  clusterIP: None
  selector:
    app: openclaw
  ports:
    - name: http
      port: 18789
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw
  namespace: openclaw
  annotations:
    lbipam.cilium.io/ips: 10.0.188.50,fd7a:115c:a1e0:188::50
spec:
  type: LoadBalancer
  ipFamilyPolicy: PreferDualStack
  ipFamilies:
    - IPv4
    - IPv6
  selector:
    app: openclaw
  ports:
    - name: http
      port: 80
      targetPort: http
