    ---
    name: espresso-cluster
    description: Read-only diagnostics and status tools for the Espresso K3S cluster
    ---

    # Espresso Cluster Tools

    ## Available CLI Tools

    ### kubectl (read-only)

    Read-only access to the Kubernetes API.

    Allowed:
    - `kubectl get` — list resources (pods, deployments, services, nodes, events, etc.)
    - `kubectl describe` — inspect resource details
    - `kubectl logs` — read container logs
    - `kubectl top` — check resource usage (CPU/memory)
    - `kubectl get events --sort-by='.lastTimestamp'` — recent cluster events

    Forbidden:
    - Never run `kubectl apply`, `kubectl delete`, `kubectl edit`, `kubectl patch`, or `kubectl exec`
    - Never modify any cluster resource
    - Never expose secrets, tokens, or credentials in responses

    ### flux

    FluxCD CLI for GitOps status and debugging.

    - `flux get kustomizations` — reconciliation status for all kustomizations
    - `flux get helmreleases -A` — Helm release status across namespaces
    - `flux get sources git` — Git repository sync status
    - `flux logs` — FluxCD controller logs
    - `flux events` — recent FluxCD events
    - Never run `flux reconcile`, `flux suspend`, `flux resume`, or any write operation

    ### helm

    Helm CLI for inspecting chart releases.

    - `helm list -A` — list installed releases
    - `helm get values <release> -n <namespace>` — inspect release values
    - `helm history <release> -n <namespace>` — release history
    - `helm status <release> -n <namespace>` — release status
    - Never run `helm install`, `helm upgrade`, `helm uninstall`, or `helm rollback`

    ### curl

    Static curl binary for testing connectivity and service health.

    - `curl -sf http://<service-ip>/health` — check service health endpoints
    - `curl -sf http://<service>.<namespace>.svc.cluster.local:<port>/` — test cluster DNS + connectivity

    ### jq

    JSON processor for parsing kubectl/curl output.

    - `kubectl get pods -o json | jq '.items[] | {name: .metadata.name, status: .status.phase}'`
    - `curl -sf <url> | jq .`

    ## Cluster Overview

    - Nodes: espresso-0, espresso-1, espresso-2 (NixOS, x86_64)
    - Networking: Cilium with dual-stack IPv4/IPv6 (pod CIDR: 10.42.0.0/16), Gateway API
    - Storage: OpenEBS Mayastor (nvme-ha storage class)
    - Observability: Prometheus, Grafana (10.0.188.3), Loki (10.0.188.4:3100), Hubble (10.0.188.2)
    - DNS: CoreDNS
    - GitOps: FluxCD with SOPS/Age encrypted secrets

