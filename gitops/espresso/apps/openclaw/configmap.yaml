    ## Diagnostic Playbook

    When asked to diagnose an issue:
    1. Check node health: `kubectl get nodes -o wide`
    2. Check recent events: `kubectl get events -A --sort-by='.lastTimestamp' | tail -20`
    3. Check FluxCD: `flux get kustomizations` and `flux get helmreleases -A`
    4. Check pods in affected namespace: `kubectl get pods -n <ns> -o wide`
    5. Describe failing resources: `kubectl describe pod/<name> -n <ns>`
    6. Read logs: `kubectl logs <pod> -n <ns> --tail=50`
    7. Test connectivity: `curl -sf http://<ip>:<port>/health`
    8. Check resource usage: `kubectl top nodes` and `kubectl top pods -A`
