apiVersion: v1
kind: ServiceAccount
metadata:
  name: minecraft-backup
  namespace: minecraft
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: minecraft-backup
  namespace: minecraft
rules:
  - apiGroups: [""]
    resources:
      - configmaps
    verbs:
      - create
      - get
      - patch
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
  - apiGroups: [""]
    resources:
      - pods/log
    verbs:
      - get
  - apiGroups: ["apps"]
    resources:
      - statefulsets
    verbs:
      - get
  - apiGroups: ["apps"]
    resources:
      - statefulsets/scale
    verbs:
      - get
      - patch
      - update
  - apiGroups: ["volsync.backube"]
    resources:
      - replicationsources
    verbs:
      - create
      - delete
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: minecraft-backup
  namespace: minecraft
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: minecraft-backup
subjects:
  - kind: ServiceAccount
    name: minecraft-backup
    namespace: minecraft
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: minecraft-backup
  namespace: minecraft
spec:
  schedule: "30 3 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 10800
      template:
        metadata:
          labels:
            app: minecraft-backup
        spec:
          restartPolicy: Never
          serviceAccountName: minecraft-backup
          containers:
            - name: backup
              image: docker.io/library/python:3.15-slim@sha256:fd2aef5e0d8438208de9fe154ab5b331a2428fc0c9838d41611e611fd7a80d85
              command:
                - python
                - /scripts/backup.py
              env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: minecraft-backup-orchestrator
                defaultMode: 0755
