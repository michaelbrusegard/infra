apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: creative
  namespace: minecraft
spec:
  replicas: 1
  selector:
    matchLabels:
      app: creative
  serviceName: creative
  template:
    metadata:
      labels:
        app: creative
        mc-server: "true"
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: minecraft
          image: itzg/minecraft-server:2026.9.0-java25@sha256:4e29d14082d94748f945edad3ee5307b97adc730fec49860199f5e52218a9ae3
          tty: true
          stdin: true
          ports:
            - containerPort: 25565
              name: minecraft
          env:
            - name: EULA
              value: "true"
            - name: TYPE
              value: "FABRIC"
            - name: VERSION
              value: "26.1.2"
            - name: MAX_MEMORY
              value: "4g"
            - name: ENABLE_ROLLING_LOGS
              value: "true"
            - name: ENABLE_RCON
              value: "false"
            - name: TZ
              value: "Europe/Oslo"
            - name: MOTD
              value: "§eEldians §7| §fCreative"
            - name: SEED
              value: "3671431547008281909"
            - name: ENABLE_COMMAND_BLOCK
              value: "true"
            - name: GAMEMODE
              value: "creative"
            - name: FORCE_GAMEMODE
              value: "false"
            - name: DIFFICULTY
              value: "hard"
            - name: MAX_BUILD_HEIGHT
              value: "320"
            - name: SPAWN_PROTECTION
              value: "0"
            - name: VIEW_DISTANCE
              value: "16"
            - name: SNOOPER_ENABLED
              value: "false"
            # Self-hosted via the pack-server sidecar in the vanilla pod, served
            # at packs.eldians.com. After changing a sharecode, read the
            # resulting VanillaTweaks_<hash>.zip filename + SHA1 from
            # /data/resourcepacks in the pod and set them here.
            - name: RESOURCE_PACK
              value: "https://packs.eldians.com/VanillaTweaks_f051f33.zip"
            - name: RESOURCE_PACK_SHA1
              value: "9af07c7ce3880caee9a5dc3585628c7c6d23c4cf"
            - name: RESOURCE_PACK_ENFORCE
              value: "true"
            - name: ENABLE_WHITELIST
              value: "true"
            - name: WHITELIST
              value: |
                Ker4lis
                Eccon
            - name: BROADCAST_CONSOLE_TO_OPS
              value: "false"
            - name: OPS
              value: |
                Ker4lis
            - name: VANILLATWEAKS_SHARECODE
              value: "iHZjYt,IeVAYl,dTFJcr"
            # Server-side mods only: players join with vanilla, no client
            # install required. itzg resolves the newest 26.1.2 fabric build.
            # Accept alpha/beta builds: this early after 26.1.2, several perf
            # mods (c2me, vmp, fsit) only ship pre-release builds. Mods that
            # lag behind Minecraft updates are marked optional (?) so a missing
            # build warns instead of aborting startup.
            - name: MODRINTH_PROJECTS_DEFAULT_VERSION_TYPE
              value: "alpha"
            - name: MODRINTH_PROJECTS
              value: |
                fabric-api
                fabric-language-kotlin
                lithium
                ferrite-core
                krypton
                c2me-fabric?
                vmp-fabric?
                servercore?
                alternate-current?
                clumps?
                chunky?
                no-chat-reports?
                servux?
                collective?
                quick-right-click?
                better-than-mending?
                fsit?
                worldedit?
                beacon-flight-2?
          startupProbe:
            tcpSocket:
              port: minecraft
            periodSeconds: 15
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: minecraft
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: minecraft
            periodSeconds: 15
          resources:
            requests:
              cpu: "1"
              memory: 4500Mi
            limits:
              memory: 5Gi
          volumeMounts:
            - mountPath: /data
              name: data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
        storageClassName: ssd-ha
