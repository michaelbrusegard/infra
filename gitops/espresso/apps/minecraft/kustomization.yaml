apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - backup-orchestrator.yaml
  - vanilla-statefulset.yaml
  - creative-statefulset.yaml
  - revelation-statefulset.yaml
  - services.yaml
  - mc-router.yaml
  - dns.yaml
  - httproute.yaml
  - network-policy.yaml

configMapGenerator:
  - name: minecraft-backup-orchestrator
    namespace: minecraft
    files:
      - backup.py=scripts/backup.py

generatorOptions:
  disableNameSuffixHash: true
