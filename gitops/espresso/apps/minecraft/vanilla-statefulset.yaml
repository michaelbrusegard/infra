apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vanilla
  namespace: minecraft
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vanilla
  serviceName: vanilla
  template:
    metadata:
      labels:
        app: vanilla
        mc-server: "true"
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: minecraft
          image: itzg/minecraft-server:2026.5.4-java25@sha256:f364bae78a0027aee72b01b9b532b1ae0990b3ee8cadbb6a3bc25db77418a25f
          tty: true
          stdin: true
          ports:
            - containerPort: 25565
              name: minecraft
          env:
            - name: EULA
              value: "true"
            - name: TYPE
              value: "FABRIC"
            - name: VERSION
              value: "26.1.2"
            - name: MAX_MEMORY
              value: "8g"
            - name: ENABLE_ROLLING_LOGS
              value: "true"
            - name: ENABLE_RCON
              value: "false"
            - name: TZ
              value: "Europe/Oslo"
            - name: MOTD
              value: "§aEldians §7| §fVanilla"
            - name: SEED
              value: "3671431547008281909"
            - name: ENABLE_COMMAND_BLOCK
              value: "true"
            - name: GAMEMODE
              value: "survival"
            - name: FORCE_GAMEMODE
              value: "true"
            - name: DIFFICULTY
              value: "hard"
            - name: MAX_BUILD_HEIGHT
              value: "320"
            - name: SPAWN_PROTECTION
              value: "0"
            - name: VIEW_DISTANCE
              value: "16"
            - name: SNOOPER_ENABLED
              value: "false"
            # Self-hosted: itzg downloads this VanillaTweaks pack (via the
            # sharecodes below) into /data/resourcepacks, and the pack-server
            # sidecar serves it at packs.eldians.com. After changing a sharecode,
            # read the resulting filename + SHA1 from /data/resourcepacks in the
            # pod (itzg re-zips with its own VanillaTweaks_<hash>.zip name, which
            # differs from the vanillatweaks.net download) and set them here.
            - name: RESOURCE_PACK
              value: "https://packs.eldians.com/VanillaTweaks_b3bb4b9.zip"
            - name: RESOURCE_PACK_SHA1
              value: "29702bf4bc90f2948fa5137d7b994cad53d71b53"
            - name: RESOURCE_PACK_ENFORCE
              value: "true"
            - name: ENABLE_WHITELIST
              value: "true"
            - name: WHITELIST
              value: |
                Ker4lis
                Eccon
            - name: BROADCAST_CONSOLE_TO_OPS
              value: "false"
            - name: OPS
              value: |
                Ker4lis
            - name: VANILLATWEAKS_SHARECODE
              value: "iHZjYt,IeVAYl,m1dmpn"
            # Server-side mods only: players join with vanilla, no client
            # install required. itzg resolves the newest 26.1.2 fabric build.
            # Accept alpha/beta builds: this early after 26.1.2, several perf
            # mods (c2me, vmp, fsit) only ship pre-release builds. Mods that
            # lag behind Minecraft updates are marked optional (?) so a missing
            # build warns instead of aborting startup.
            - name: MODRINTH_PROJECTS_DEFAULT_VERSION_TYPE
              value: "alpha"
            - name: MODRINTH_PROJECTS
              value: |
                fabric-api
                fabric-language-kotlin
                lithium
                ferrite-core
                krypton
                c2me-fabric?
                vmp-fabric?
                servercore?
                alternate-current?
                clumps?
                chunky?
                no-chat-reports?
                servux?
                collective?
                quick-right-click?
                better-than-mending?
                fsit?
                worldedit?
                beacon-flight-2?
          startupProbe:
            tcpSocket:
              port: minecraft
            periodSeconds: 15
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: minecraft
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: minecraft
            periodSeconds: 15
          resources:
            requests:
              cpu: "1"
              memory: 9Gi
            limits:
              memory: 10Gi
          volumeMounts:
            - mountPath: /data
              name: data
        # Serves the VanillaTweaks resource pack (which itzg auto-downloads to
        # /data/resourcepacks) over HTTP so clients can fetch the enforced
        # pack. Exposed publicly at packs.eldians.com via the gateway.
        - name: pack-server
          image: ghcr.io/static-web-server/static-web-server:2.42.0@sha256:2d67e47e22172235e339908777e692006ffdcf42dc4c531aff5d4337a7559a1e
          args:
            - --host=0.0.0.0
            - --port=8080
            - --root=/srv/resourcepacks
            - --health
          ports:
            - containerPort: 8080
              name: packs
          startupProbe:
            httpGet:
              path: /health
              port: packs
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: packs
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - mountPath: /srv
              name: data
              readOnly: true
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
        storageClassName: ssd-ha
