apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: vanilla-world-backup
  namespace: minecraft
spec:
  sourcePVC: data-vanilla-0
  trigger: {}
  restic:
    repository: freddo-restic-minecraft-vanilla
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
    copyMethod: Snapshot
    volumeSnapshotClassName: mayastor-snapshot
    cacheStorageClassName: nvme-ha
    cacheCapacity: 1Gi
---
