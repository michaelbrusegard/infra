apiVersion: v1
kind: Service
metadata:
  name: vanilla
  namespace: minecraft
spec:
  clusterIP: None
  selector:
    app: vanilla
  ports:
    - name: minecraft
      port: 25565
      targetPort: minecraft
---
apiVersion: v1
kind: Service
metadata:
  name: creative
  namespace: minecraft
spec:
  clusterIP: None
  selector:
    app: creative
  ports:
    - name: minecraft
      port: 25565
      targetPort: minecraft
---
apiVersion: v1
kind: Service
metadata:
  name: revelation
  namespace: minecraft
spec:
  clusterIP: None
  selector:
    app: revelation
  ports:
    - name: minecraft
      port: 25565
      targetPort: minecraft
---
# Resource-pack HTTP server (sidecar in the vanilla pod). Both vanilla and
# creative point RESOURCE_PACK at this via packs.eldians.com.
apiVersion: v1
kind: Service
metadata:
  name: pack-server
  namespace: minecraft
spec:
  selector:
    app: vanilla
  ports:
    - name: http
      port: 80
      targetPort: packs
