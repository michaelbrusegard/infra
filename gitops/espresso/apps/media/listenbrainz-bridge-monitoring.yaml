apiVersion: apps/v1
kind: Deployment
metadata:
  name: listenbrainz-bridge-metrics
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: listenbrainz-bridge-metrics
  template:
    metadata:
      labels:
        app: listenbrainz-bridge-metrics
    spec:
      nodeSelector:
        kubernetes.io/hostname: espresso-1
      initContainers:
        - name: init-metrics
          image: busybox:1.38.0@sha256:f97baa533a26513c453a362be331a43eb60214302f449c16571b23cea141dce4
          command:
            - sh
            - -c
            - |
              mkdir -p /state/metrics
              if [ -f /state/metrics/listenbrainz.prom ] && [ ! -f /state/metrics/listenbrainz.txt ]; then
                cp /state/metrics/listenbrainz.prom /state/metrics/listenbrainz.txt
              fi
          volumeMounts:
            - name: state
              mountPath: /state
      containers:
        - name: metrics
          image: busybox:1.38.0@sha256:f97baa533a26513c453a362be331a43eb60214302f449c16571b23cea141dce4
          command:
            - httpd
            - -f
            - -p
            - "9100"
            - -h
            - /metrics
          ports:
            - name: metrics
              containerPort: 9100
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: state
              mountPath: /metrics
              subPath: metrics
              readOnly: true
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: config-listenbrainz-bridge
---
apiVersion: v1
kind: Service
metadata:
  name: listenbrainz-bridge-metrics
  namespace: media
spec:
  selector:
    app: listenbrainz-bridge-metrics
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: listenbrainz-bridge
  namespace: media
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: listenbrainz-bridge-metrics
  podMetricsEndpoints:
    - port: metrics
      path: /listenbrainz.txt
      interval: 1m
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: listenbrainz-bridge
  namespace: media
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: listenbrainz-bridge
      rules:
        - alert: ListenBrainzBridgeRunFailed
          expr: listenbrainz_bridge_last_run_success{namespace="media"} == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: ListenBrainz bridge run failed
            description: The latest ListenBrainz bridge CronJob run did not complete successfully.
        - alert: ListenBrainzBridgeStale
          expr: time() - listenbrainz_bridge_last_success_timestamp_seconds{namespace="media"} > 108000
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: ListenBrainz bridge has not succeeded recently
            description: The ListenBrainz bridge has not completed successfully in more than 30 hours.
