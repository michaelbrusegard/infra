apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: media
  namespace: media
spec:
  endpointSelector:
    matchExpressions:
      - key: app
        operator: NotIn
        values:
          - hermes-media-api
  ingress:
    # Kubelet HTTP probes and node-forwarded LB traffic
    - fromEntities:
        - host
        - remote-node
    # Gateway API traffic (internal gateway)
    - fromEntities:
        - ingress
    # LAN and VPN direct access to LB VIPs
    - fromCIDR:
        - 10.0.186.0/24
        - fd7a:115c:a1e0:186::/64
        - 10.0.187.0/24
        - fd7a:115c:a1e0:187::/64
        - 100.102.0.0/16
    # Intra-namespace (arr stack intercommunication)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
    # Uptime-kuma monitoring. The arr apps expose their HTTP port as the
    # named `http` port on their main container. Transmission's 9091 lives on
    # its `transmission` sidecar (a restartPolicy: Always init container)
    # whose named ports Cilium does not resolve, so the numeric 9091 is needed
    # in addition to cover the transmission monitor.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: uptime-kuma
            k8s:app: uptime-kuma
      toPorts:
        - ports:
            - port: http
              protocol: TCP
            - port: "9091"
              protocol: TCP
    # Prometheus scraping for the ListenBrainz bridge metrics exporter
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: metrics
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # Intra-namespace
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
    # World access: arr metadata, transmission VPN (WireGuard + DoT)
    - toEntities:
        - world
