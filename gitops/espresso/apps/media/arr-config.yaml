apiVersion: batch/v1
kind: CronJob
metadata:
  name: arr-config
  namespace: media
spec:
  schedule: "45 5 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: arr-config
        spec:
          restartPolicy: Never
          containers:
            - name: sync
              image: docker.io/library/python:3.14-slim@sha256:cfe2e24a75302a15934d37c2d86412893c0aa934dc3a97cbb439d04c01890ca9
              command:
                - python
                - /scripts/sync.py
              envFrom:
                - secretRef:
                    name: media-arr-env
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: arr-config
                defaultMode: 0755
