apiVersion: batch/v1
kind: CronJob
metadata:
  name: arr-config
  namespace: media
spec:
  schedule: "45 5 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: arr-config
        spec:
          restartPolicy: Never
          containers:
            - name: sync
              image: docker.io/library/python:3.14-slim@sha256:5b945726c4d7ffe6595dc7498ad17fd0397e373c5181c24819a7028e8b1276dc
              command:
                - python
                - /scripts/sync.py
              envFrom:
                - secretRef:
                    name: media-arr-env
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: arr-config
                defaultMode: 0755
