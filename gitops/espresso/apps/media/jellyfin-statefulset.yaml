apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jellyfin
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  serviceName: jellyfin-internal
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      nodeSelector:
        kubernetes.io/hostname: espresso-1
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:10.11.8@sha256:1694ff069f0c9dafb283c36765175606866769f5d72f2ed56b6a0f1be922fc37
          securityContext:
            privileged: true
          ports:
            - containerPort: 8096
              name: http
          env:
            - name: JELLYFIN_PublishedServerUrl
              value: "http://10.0.188.40"
            - name: TZ
              value: "Europe/Oslo"
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "all"
            - name: LD_LIBRARY_PATH
              value: "/usr/lib/nvidia"
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - echo /usr/lib/nvidia > /etc/ld.so.conf.d/nvidia.conf && ldconfig
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /cache
              name: cache
            - mountPath: /data
              name: media-data
            - mountPath: /dev/nvidia0
              name: nvidia0
            - mountPath: /dev/nvidiactl
              name: nvidiactl
            - mountPath: /dev/nvidia-uvm
              name: nvidia-uvm
            - mountPath: /dev/nvidia-uvm-tools
              name: nvidia-uvm-tools
            - mountPath: /dev/dri/renderD128
              name: render-d128
            - mountPath: /usr/lib/nvidia
              name: nvidia-driver
              readOnly: true
            - mountPath: /nix/store
              name: nix-store
              readOnly: true
      volumes:
        - name: media-data
          persistentVolumeClaim:
            claimName: media-data
        - name: nvidia0
          hostPath:
            path: /dev/nvidia0
        - name: nvidiactl
          hostPath:
            path: /dev/nvidiactl
        - name: nvidia-uvm
          hostPath:
            path: /dev/nvidia-uvm
        - name: nvidia-uvm-tools
          hostPath:
            path: /dev/nvidia-uvm-tools
        - name: render-d128
          hostPath:
            path: /dev/dri/renderD128
        - name: nvidia-driver
          hostPath:
            path: /run/opengl-driver/lib
            type: Directory
        - name: nix-store
          hostPath:
            path: /nix/store
            type: Directory
  volumeClaimTemplates:
    - metadata:
        name: config
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: nvme-ha
    - metadata:
        name: cache
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
        storageClassName: ssd-ha
