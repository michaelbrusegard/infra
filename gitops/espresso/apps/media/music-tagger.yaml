apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config-music-tagger
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: openebs-hostpath
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: music-tagger-dry-run
  namespace: media
spec:
  schedule: "0 0 1 1 *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: music-tagger
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: espresso-1
          containers:
            - name: tagger
              image: lscr.io/linuxserver/beets:2.12.0@sha256:8054f33220337aae66f324c784bf8e3330844462c29759915d1eae9441761db6
              command:
                - python3
                - /scripts/tagger.py
              env:
                - name: TAGGER_MODE
                  value: dry-run
                - name: MUSIC_ROOT
                  value: /music
                - name: BEETS_CONFIG
                  value: /config/config.yaml
              resources:
                requests:
                  cpu: 500m
                  memory: 512Mi
                limits:
                  cpu: "2"
                  memory: 2Gi
              volumeMounts:
                - name: media-data
                  mountPath: /music
                  subPath: media/music
                  readOnly: true
                - name: config
                  mountPath: /config
                - name: config-map
                  mountPath: /config/config.yaml
                  subPath: config.yaml
                - name: config-map
                  mountPath: /scripts/tagger.py
                  subPath: tagger.py
          volumes:
            - name: media-data
              persistentVolumeClaim:
                claimName: media-data
                readOnly: true
            - name: config
              persistentVolumeClaim:
                claimName: config-music-tagger
            - name: config-map
              configMap:
                name: music-tagger-config
                defaultMode: 0755
---
