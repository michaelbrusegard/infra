apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: transmission-config-backup
  namespace: media
spec:
  sourcePVC: config-transmission-0
  trigger:
    schedule: "40 2 * * 0"
  restic:
    repository: freddo-restic-media-transmission
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
    copyMethod: Snapshot
    volumeSnapshotClassName: mayastor-snapshot
    cacheStorageClassName: nvme-ha
    cacheCapacity: 1Gi
---
