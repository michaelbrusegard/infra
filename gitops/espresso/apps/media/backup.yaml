apiVersion: batch/v1
kind: CronJob
metadata:
  name: musicgrabber-config-backup
  namespace: media
spec:
  schedule: "50 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: musicgrabber-config-backup
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: espresso-1
          containers:
            - name: restic
              image: docker.io/restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              command:
                - sh
                - -c
                - |
                  set -eu
                  restic backup \
                    --host espresso-media \
                    --tag espresso \
                    --tag media \
                    --tag musicgrabber \
                    --tag config \
                    /config
              env:
                - name: RESTIC_CACHE_DIR
                  value: /cache
              envFrom:
                - secretRef:
                    name: freddo-restic-musicgrabber-config
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: cache
                  mountPath: /cache
          volumes:
            - name: config
              persistentVolumeClaim:
                claimName: config-musicgrabber-0
            - name: cache
              emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: music-library-backup
  namespace: media
spec:
  schedule: "10 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: music-library-backup
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: espresso-1
          containers:
            - name: restic
              image: docker.io/restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              command:
                - sh
                - -c
                - |
                  set -eu

                  if [ ! -d /data/media/music ]; then
                    echo "missing /data/media/music"
                    exit 1
                  fi

                  restic backup \
                    --host espresso-media \
                    --tag espresso \
                    --tag media \
                    --tag music \
                    --tag library \
                    /data/media/music
              env:
                - name: RESTIC_CACHE_DIR
                  value: /cache
              envFrom:
                - secretRef:
                    name: freddo-restic-media-music
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 2Gi
              volumeMounts:
                - name: media-data
                  mountPath: /data
                  readOnly: true
                - name: cache
                  mountPath: /cache
          volumes:
            - name: media-data
              persistentVolumeClaim:
                claimName: media-data
            - name: cache
              emptyDir: {}
---
