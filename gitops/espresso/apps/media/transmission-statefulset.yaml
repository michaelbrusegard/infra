apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: transmission
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transmission
  serviceName: transmission-internal
  template:
    metadata:
      labels:
        app: transmission
    spec:
      nodeSelector:
        kubernetes.io/hostname: espresso-1
      initContainers:
        - name: init-dirs
          image: busybox:1.38.0@sha256:1cfa4e2b09e127b9c4ed43578d3f3c18e7d44ea47b9ea98475c0cbe9086525f8
          command:
            - sh
            - -c
            - mkdir -p /data/torrents/movies /data/torrents/tv /data/torrents/music /data/torrents/incomplete /data/media/movies /data/media/tv /data/media/music && chown -R 1000:1000 /data
          volumeMounts:
            - mountPath: /data
              name: media-data
        - name: init-transmission-config
          image: busybox:1.38.0@sha256:1cfa4e2b09e127b9c4ed43578d3f3c18e7d44ea47b9ea98475c0cbe9086525f8
          command:
            - sh
            - -c
            - |
              if [ -f /config/settings.json ]; then
                sed -i 's|"download-dir":.*|"download-dir": "/data/torrents",|' /config/settings.json
                sed -i 's|"incomplete-dir":.*|"incomplete-dir": "/data/torrents/incomplete",|' /config/settings.json
                sed -i 's|"incomplete-dir-enabled":.*|"incomplete-dir-enabled": true,|' /config/settings.json
                sed -i 's|"rpc-whitelist-enabled":.*|"rpc-whitelist-enabled": false,|' /config/settings.json
                if grep -q '"rpc-bind-address":' /config/settings.json; then
                  sed -i 's|"rpc-bind-address":.*|"rpc-bind-address": "::",|' /config/settings.json
                else
                  sed -i '2i\  "rpc-bind-address": "::",' /config/settings.json
                fi
                sed -i 's|"ratio-limit":.*|"ratio-limit": 1,|' /config/settings.json
                sed -i 's|"ratio-limit-enabled":.*|"ratio-limit-enabled": true,|' /config/settings.json
                sed -i 's|"idle-seeding-limit":.*|"idle-seeding-limit": 1440,|' /config/settings.json
                sed -i 's|"idle-seeding-limit-enabled":.*|"idle-seeding-limit-enabled": true,|' /config/settings.json
              fi
          volumeMounts:
            - mountPath: /config
              name: config
        - name: gluetun
          restartPolicy: Always
          image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          ports:
            - containerPort: 8000
              name: gluetun-ctrl
          envFrom:
            - secretRef:
                name: media-vpn-env
            # USER/PASS for the port-forward up command: transmission requires
            # RPC auth, so pushing the forwarded peer port needs credentials.
            - secretRef:
                name: media-transmission-env
          env:
            - name: VPN_SERVICE_PROVIDER
              value: "protonvpn"
            - name: VPN_TYPE
              value: "wireguard"
            - name: SERVER_COUNTRIES
              value: "Netherlands"
            - name: VPN_PORT_FORWARDING
              value: "on"
            - name: VPN_PORT_FORWARDING_PROVIDER
              value: "protonvpn"
            # Authenticate (RPC auth is required) and retry for up to 5m:
            # gluetun gets the forwarded port before transmission's RPC is
            # listening, so a single unauthenticated attempt silently fails
            # and the peer port stays on the unreachable default. The session
            # id grep must anchor on the header name: transmission also sends
            # Access-Control-Expose-Headers containing the same substring.
            - name: VPN_PORT_FORWARDING_UP_COMMAND
              value: >-
                /bin/sh -c '
                AUTH="Authorization: Basic $(printf "%s" "$USER:$PASS" | base64 | tr -d "\n")";
                i=0;
                while [ $i -lt 60 ]; do
                SID=$(wget -qS --spider --header="$AUTH" http://127.0.0.1:9091/transmission/rpc 2>&1 | grep -im1 "^ *x-transmission-session-id:" | tr -d " \r");
                [ -n "$SID" ] && wget -qO- --header="Content-Type: application/json" --header="$AUTH" --header="$SID" --post-data="{\"method\":\"session-set\",\"arguments\":{\"peer-port\":{{PORT}}}}" http://127.0.0.1:9091/transmission/rpc 2>/dev/null && exit 0;
                i=$((i+1));
                sleep 5;
                done;
                exit 0
                '
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "10.42.0.0/16,10.43.0.0/16,10.0.186.0/24,10.0.187.0/24,10.0.188.0/24"
            - name: FIREWALL_INPUT_PORTS
              value: "9091"
            - name: DOT
              value: "on"
            - name: DOT_PROVIDERS
              value: "cloudflare,quad9"
            - name: UPDATER_PERIOD
              value: "24h"
            - name: HEALTH_VPN_DURATION_INITIAL
              value: "30s"
            - name: HEALTH_SUCCESS_WAIT_DURATION
              value: "10s"
          # Probe the health server (9999), which only returns 200 while the
          # tunnel actually passes traffic. /v1/vpn/status reports "running"
          # even when every healthcheck fails, so it cannot detect a dead VPN.
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - wget -qO- http://127.0.0.1:9999 2>/dev/null
            periodSeconds: 5
            failureThreshold: 60
          # Fails on a dead tunnel OR a lost forwarded port: Proton NAT-PMP
          # renewals can get refused and wedge gluetun's port-forward loop
          # while the tunnel stays healthy (port 0, no inbound peers). The
          # 5m of failures tolerated covers lease negotiation on startup.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - wget -qO- http://127.0.0.1:9999 2>/dev/null && wget -qO- http://127.0.0.1:8000/v1/openvpn/portforwarded 2>/dev/null | grep -qv '"port":0'
            periodSeconds: 30
            failureThreshold: 10
        - name: transmission
          restartPolicy: Always
          image: lscr.io/linuxserver/transmission:4.1.1-r1-ls338@sha256:653e7394633786ef76b3ad7987299dabf730b68646c7fc27826dbb86d20986d4
          ports:
            - containerPort: 9091
              name: http
          envFrom:
            - secretRef:
                name: media-transmission-env
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Oslo"
            - name: TRANSMISSION_WEB_HOME
              value: "/usr/share/transmission/public_html"
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - nc -z 127.0.0.1 9091
            periodSeconds: 10
            failureThreshold: 18
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - nc -z 127.0.0.1 9091
            periodSeconds: 30
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - nc -z 127.0.0.1 9091
            periodSeconds: 10
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /data
              name: media-data
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10@sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a
      volumes:
        - name: media-data
          persistentVolumeClaim:
            claimName: media-data
  volumeClaimTemplates:
    - metadata:
        name: config
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: nvme-ha
