apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: transmission
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transmission
  serviceName: transmission-internal
  template:
    metadata:
      labels:
        app: transmission
    spec:
      nodeSelector:
        kubernetes.io/hostname: espresso-1
      initContainers:
        - name: init-dirs
          image: busybox:1.37
          command:
            - sh
            - -c
            - mkdir -p /data/torrents/movies /data/torrents/tv /data/torrents/music /data/torrents/incomplete /data/media/movies /data/media/tv /data/media/music && chown -R 1000:1000 /data
          volumeMounts:
            - mountPath: /data
              name: media-data
        - name: init-transmission-config
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              if [ -f /config/settings.json ]; then
                sed -i 's|"download-dir":.*|"download-dir": "/data/torrents",|' /config/settings.json
                sed -i 's|"incomplete-dir":.*|"incomplete-dir": "/data/torrents/incomplete",|' /config/settings.json
                sed -i 's|"incomplete-dir-enabled":.*|"incomplete-dir-enabled": true,|' /config/settings.json
                sed -i 's|"rpc-whitelist-enabled":.*|"rpc-whitelist-enabled": false,|' /config/settings.json
                sed -i 's|"ratio-limit":.*|"ratio-limit": 1,|' /config/settings.json
                sed -i 's|"ratio-limit-enabled":.*|"ratio-limit-enabled": true,|' /config/settings.json
                sed -i 's|"idle-seeding-limit":.*|"idle-seeding-limit": 1440,|' /config/settings.json
                sed -i 's|"idle-seeding-limit-enabled":.*|"idle-seeding-limit-enabled": true,|' /config/settings.json
              fi
          volumeMounts:
            - mountPath: /config
              name: config
        - name: gluetun
          restartPolicy: Always
          image: qmcgaw/gluetun:v3.41.1@sha256:1a5bf4b4820a879cdf8d93d7ef0d2d963af56670c9ebff8981860b6804ebc8ab
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          ports:
            - containerPort: 8000
              name: gluetun-ctrl
          envFrom:
            - secretRef:
                name: media-vpn-env
          env:
            - name: VPN_SERVICE_PROVIDER
              value: "protonvpn"
            - name: VPN_TYPE
              value: "wireguard"
            - name: SERVER_COUNTRIES
              value: "Netherlands"
            - name: VPN_PORT_FORWARDING
              value: "on"
            - name: VPN_PORT_FORWARDING_PROVIDER
              value: "protonvpn"
            - name: VPN_PORT_FORWARDING_UP_COMMAND
              value: >-
                /bin/sh -c '
                SID=$(wget -qS --spider http://127.0.0.1:9091/transmission/rpc 2>&1 | grep -i x-transmission-session-id | tr -d "[:space:]");
                wget -qO- --header="Content-Type: application/json" --header="$SID" --post-data="{\"method\":\"session-set\",\"arguments\":{\"peer-port\":{{PORT}}}}" http://127.0.0.1:9091/transmission/rpc 2>/dev/null || true
                '
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "10.42.0.0/16,10.43.0.0/16,10.0.186.0/24,10.0.187.0/24,10.0.188.0/24"
            - name: FIREWALL_INPUT_PORTS
              value: "9091"
            - name: DOT
              value: "on"
            - name: DOT_PROVIDERS
              value: "cloudflare,quad9"
            - name: HEALTH_VPN_DURATION_INITIAL
              value: "30s"
            - name: HEALTH_SUCCESS_WAIT_DURATION
              value: "10s"
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - wget -qO- http://127.0.0.1:8000/v1/vpn/status 2>/dev/null | grep -q running
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - wget -qO- http://127.0.0.1:8000/v1/vpn/status 2>/dev/null | grep -q running
            periodSeconds: 30
        - name: transmission
          restartPolicy: Always
          image: lscr.io/linuxserver/transmission:4.1.1-r1-ls338@sha256:653e7394633786ef76b3ad7987299dabf730b68646c7fc27826dbb86d20986d4
          ports:
            - containerPort: 9091
              name: http
          envFrom:
            - secretRef:
                name: media-transmission-env
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Oslo"
            - name: TRANSMISSION_WEB_HOME
              value: "/usr/share/transmission/public_html"
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - nc -z 127.0.0.1 9091
            periodSeconds: 10
            failureThreshold: 18
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - nc -z 127.0.0.1 9091
            periodSeconds: 30
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - nc -z 127.0.0.1 9091
              port: http
            periodSeconds: 10
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /data
              name: media-data
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10@sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a
      volumes:
        - name: media-data
          persistentVolumeClaim:
            claimName: media-data
  volumeClaimTemplates:
    - metadata:
        name: config
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: nvme-ha
