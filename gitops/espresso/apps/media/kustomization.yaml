apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - backup.yaml
  - shared-pvc.yaml
  - transmission-statefulset.yaml
  - prowlarr-statefulset.yaml
  - radarr-statefulset.yaml
  - sonarr-statefulset.yaml
  - arr-config.yaml
  - bazarr-statefulset.yaml
  - musicgrabber-statefulset.yaml
  - navidrome-statefulset.yaml
  - music-tagger.yaml
  - listenbrainz-bridge.yaml
  - listenbrainz-bridge-monitoring.yaml
  - recommendation-cleanup.yaml
  - feishin-deployment.yaml
  - jellyfin-statefulset.yaml
  - seerr-statefulset.yaml
  - flaresolverr-deployment.yaml
  - hermes-media-api.yaml
  - hermes-media-api-network-policy.yaml
  - services.yaml
  - httproutes.yaml
  - network-policy.yaml

configMapGenerator:
  - name: arr-config
    namespace: media
    files:
      - sync.py=scripts/arr-config-sync.py
  - name: music-tagger-config
    namespace: media
    files:
      - config.yaml=config/music-tagger.yaml
      - tagger.py=scripts/music-tagger.py
  - name: hermes-media-api
    namespace: media
    files:
      - hermes-media-api.py=scripts/hermes-media-api.py
  - name: listenbrainz-bridge-config
    namespace: media
    literals:
      - LISTENBRAINZ_API_URL=https://api.listenbrainz.org
      - MUSICGRABBER_URL=http://musicgrabber-internal.media.svc.cluster.local:8080
      - MUSIC_ROOT=/music
      - STATE_DB=/state/listenbrainz-bridge.db
      - METRICS_PATH=/state/metrics/listenbrainz.txt
      - MAX_TRACKS_PER_RUN=25
      - PRIORITY_SOURCE=monochrome
      - PREFERRED_SOURCES=all
      - CONVERT_TO_FLAC=true
      - CLEANUP_AFTER_DAYS=30
    files:
      - bridge.py=scripts/listenbrainz-bridge.py
      - cleanup.py=scripts/listenbrainz-cleanup.py

generatorOptions:
  disableNameSuffixHash: true
