apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - backup.yaml
  - shared-pvc.yaml
  - transmission-statefulset.yaml
  - prowlarr-statefulset.yaml
  - radarr-statefulset.yaml
  - sonarr-statefulset.yaml
  - arr-config-configmap.yaml
  - arr-config.yaml
  - bazarr-statefulset.yaml
  - musicgrabber-statefulset.yaml
  - navidrome-statefulset.yaml
  - music-tagger-configmap.yaml
  - music-tagger.yaml
  - listenbrainz-bridge-configmap.yaml
  - listenbrainz-bridge.yaml
  - listenbrainz-bridge-monitoring.yaml
  - recommendation-cleanup.yaml
  - feishin-deployment.yaml
  - jellyfin-statefulset.yaml
  - seerr-statefulset.yaml
  - flaresolverr-deployment.yaml
  - hermes-media-api.yaml
  - hermes-media-api-network-policy.yaml
  - services.yaml
  - httproutes.yaml
  - network-policy.yaml

configMapGenerator:
  - name: hermes-media-api
    namespace: media
    files:
      - hermes-media-api.py=scripts/hermes-media-api.py

generatorOptions:
  disableNameSuffixHash: true
