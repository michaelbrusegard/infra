apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seerr
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seerr
  serviceName: seerr-internal
  template:
    metadata:
      annotations:
        secret.reloader.stakater.com/reload: seerr-api
      labels:
        app: seerr
    spec:
      nodeSelector:
        kubernetes.io/hostname: espresso-1
      initContainers:
        - name: init-config
          image: busybox:1.38.0@sha256:f97baa533a26513c453a362be331a43eb60214302f449c16571b23cea141dce4
          command:
            - sh
            - -c
            - chown -R 1000:1000 /app/config
          volumeMounts:
            - mountPath: /app/config
              name: config
      securityContext:
        fsGroup: 1000
      containers:
        - name: seerr
          image: ghcr.io/seerr-team/seerr:v3.5.1@sha256:d8fab675b55ad293ded98fd71efcfd46054cbad9746534ae1cc4794a88c0b3be
          ports:
            - containerPort: 5055
              name: http
          env:
            - name: LOG_LEVEL
              value: "info"
            - name: TZ
              value: "Europe/Oslo"
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: seerr-api
                  key: API_KEY
          startupProbe:
            httpGet:
              path: /api/v1/status
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            periodSeconds: 10
          volumeMounts:
            - mountPath: /app/config
              name: config
  volumeClaimTemplates:
    - metadata:
        name: config
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
        storageClassName: nvme-ha
