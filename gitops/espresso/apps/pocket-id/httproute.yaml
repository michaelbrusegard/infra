apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pocket-id-public
  namespace: pocket-id
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: https
  hostnames:
    - id.asgard.michaelbrusegard.com
  rules:
    - backendRefs:
        - name: pocket-id
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pocket-id-internal
  namespace: pocket-id
spec:
  parentRefs:
    - name: internal
      namespace: gateway
      sectionName: https
  hostnames:
    - id.asgard.michaelbrusegard.com
  rules:
    - backendRefs:
        - name: pocket-id
          port: 80
