apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: smtp-edge-data-backup
  namespace: smtp-edge
spec:
  paused: false
  sourcePVC: data-smtp-edge-0
  trigger:
    schedule: "50 */6 * * *"
  restic:
    # New /stalwart/smtp-edge-pvc repository under the existing private identity.
    repository: freddo-restic-smtp-edge-pvc
    # freddo forgets and prunes server-side and rejects client deletes.
    pruneIntervalDays: 36500
    retain:
      within: 100y
    moverSecurityContext:
      # Queue owner can read the spool without capabilities. PID files live
      # on an emptyDir, not this PVC. Never set fsGroup here: its recursive
      # chmod changes queue-file bits used by Postfix as delivery flags. The
      # restic cache PVC was chowned to 100 once instead, since restic fails
      # on an unwritable cache.
      runAsUser: 100
      runAsGroup: 100
    copyMethod: Snapshot
    volumeSnapshotClassName: mayastor-snapshot
    cacheStorageClassName: openebs-single-replica
    cacheCapacity: 2Gi
