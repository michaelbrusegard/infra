apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: smtp-edge
  namespace: smtp-edge
  annotations:
    secret.reloader.stakater.com/reload: smtp-edge-resend,wildcard-tls
    configmap.reloader.stakater.com/reload: smtp-edge-backup-client
spec:
  # Pending registry digest, secret provisioning and cutover approval; see README.
  replicas: 1
  serviceName: smtp-edge-internal
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: smtp-edge
  template:
    metadata:
      labels:
        app: smtp-edge
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 660
      securityContext:
        # Root master drops to postfix:100, postdrop:101 and mailforward:102.
        # No fsGroup: queue ownership is managed by native Postfix.
        runAsUser: 0
        runAsGroup: 0
        runAsNonRoot: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postfix
          # .github/workflows/smtp-edge-image.yaml qualifies, publishes and pins this.
          image: ghcr.io/michaelbrusegard/smtp-edge:postfix-3.11.7-curl-8.22.0-sha-c18ceba6f48fcedc5b2db073e592ca2645365a8a@sha256:05dfae1f5fd5864ea35908584473c8c099539516134fffa5f556d4a6c7adbd63
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER, KILL, NET_BIND_SERVICE]
          env:
            - name: POSTFIX_HOSTNAME
              value: edge.asgard.michaelbrusegard.com
            # Space-separated domain=backend routes.
            - name: BACKENDS
              value: manafishrov.com=backend.manafishrov.com
            - name: BACKEND_LMTP_PORT
              value: "24"
            - name: BACKEND_SMTP_PORT
              value: "25"
            - name: BACKEND_LOCAL_SMTP_PORT
              value: "26"
            - name: INBOUND_TLS_CERT_FILE
              value: /run/secrets/smtp-edge/tls/tls.crt
            - name: INBOUND_TLS_KEY_FILE
              value: /run/secrets/smtp-edge/tls/tls.key
            - name: RESEND_PASSWORD_FILE
              value: /run/secrets/smtp-edge/resend/api-key
            - name: BACKUP_CLIENT_FINGERPRINT_FILE
              value: /run/secrets/smtp-edge/backup/fingerprint
          ports:
            - name: smtp
              containerPort: 25
            - name: backup
              containerPort: 2525
          # Do not call the entrypoint's check mode: it rebuilds runtime maps.
          # These native checks need no backend, mail submission or API writer.
          startupProbe:
            exec:
              command: [/bin/bash, -ec, "postfix check && postfix status"]
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [/bin/bash, -ec, "postfix check && postfix status"]
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          # No backend-coupled liveness restart loop; PID 1 is postfix start-fg.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
              ephemeral-storage: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postfix
            - name: run
              mountPath: /run
            # Root-owned PID locks are ephemeral, not part of the queue backup.
            - name: run
              mountPath: /var/lib/postfix/queue/pid
              subPath: postfix-pid
            - name: tmp
              mountPath: /tmp
            - name: tls
              mountPath: /run/secrets/smtp-edge/tls
              readOnly: true
            - name: resend
              mountPath: /run/secrets/smtp-edge/resend
              readOnly: true
            - name: backup-client
              mountPath: /run/secrets/smtp-edge/backup
              readOnly: true
      volumes:
        - name: backup-client
          configMap:
            name: smtp-edge-backup-client
        - name: run
          emptyDir:
            sizeLimit: 128Mi
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: tls
          secret:
            secretName: wildcard-tls
            defaultMode: 0400
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: resend
          secret:
            secretName: smtp-edge-resend
            defaultMode: 0400
            items:
              - key: api-key
                path: api-key
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ssd-ha
        resources:
          requests:
            storage: 20Gi
