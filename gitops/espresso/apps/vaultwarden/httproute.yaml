# Internal only: the vault is reached over the LAN or NetBird.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vaultwarden-internal
  namespace: vaultwarden
spec:
  parentRefs:
    - name: internal
      namespace: gateway
      sectionName: https
  hostnames:
    - vault.asgard.michaelbrusegard.com
  rules:
    - backendRefs:
        - name: vaultwarden
          port: 80
