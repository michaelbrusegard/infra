apiVersion: batch/v1
kind: CronJob
metadata:
  name: hindsight-backup
  namespace: hindsight
spec:
  schedule: "35 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app: hindsight-backup
        spec:
          restartPolicy: Never
          initContainers:
            - name: dump-postgres
              image: postgres:18-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
              command:
                - sh
                - -c
                - |
                  set -eu
                  ts="$(date -u +%Y%m%dT%H%M%SZ)"
                  pg_dump --format=custom --compress=9 --clean --if-exists \
                    --no-owner --no-acl --dbname=hindsight \
                    --file="/backup/hindsight-${ts}.dump"
              env:
                - name: PGHOST
                  value: postgres.postgres.svc.cluster.local
                - name: PGUSER
                  value: hindsight_app
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-outputs
                      key: hindsight_db_password
              volumeMounts:
                - name: backup
                  mountPath: /backup
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
          containers:
            - name: restic
              image: docker.io/restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              command:
                - sh
                - -c
                - restic backup --host espresso-postgres --tag espresso --tag hindsight --tag postgres /backup
              env:
                - name: RESTIC_CACHE_DIR
                  value: /cache
              envFrom:
                - secretRef:
                    name: freddo-restic-hindsight-postgres
              volumeMounts:
                - name: backup
                  mountPath: /backup
                  readOnly: true
                - name: cache
                  mountPath: /cache
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
          volumes:
            - name: backup
              emptyDir: {}
            - name: cache
              emptyDir: {}
