apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ollama
  namespace: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  serviceName: ollama-internal
  template:
    metadata:
      labels:
        app: ollama
    spec:
      initContainers:
        - name: model-pull
          image: ollama/ollama:latest@sha256:2038a264392af4d21f7f14e1568e8dd9aa0f2bd0f31d7d9a59a8cca1e9829663
          command:
            - sh
            - -c
            - |
              ollama serve &
              PID=$!
              until ollama list >/dev/null 2>&1; do sleep 2; done
              ollama pull nomic-embed-text
              kill $PID 2>/dev/null || true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /root/.ollama
      containers:
        - name: ollama
          image: ollama/ollama:latest@sha256:2038a264392af4d21f7f14e1568e8dd9aa0f2bd0f31d7d9a59a8cca1e9829663
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
          ports:
            - containerPort: 11434
              name: http
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /root/.ollama
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
        storageClassName: nvme-ha
