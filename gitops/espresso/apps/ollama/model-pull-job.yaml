apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-pull-nomic-embed-text
  namespace: ollama
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: pull
          image: curlimages/curl:8.12.1@sha256:94e9e444bcba979c2ea12e27ae39bee4cd10bc7041a472c4727a558e213744e6
          command:
            - sh
            - -c
            - |
              until curl -sf http://ollama:11434/api/tags >/dev/null; do sleep 5; done
              curl -sf -X POST http://ollama:11434/api/pull -d '{"name":"nomic-embed-text"}'
