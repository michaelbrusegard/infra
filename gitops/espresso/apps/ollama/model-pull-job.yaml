apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-pull-nomic-embed-text
  namespace: ollama
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: pull
          image: curlimages/curl:8.19.0@sha256:9a6f6a17667960e077f1b153009aaf18ac99a622221084e1938a45a06fff057a
          command:
            - sh
            - -c
            - |
              until curl -sf http://ollama:11434/api/tags >/dev/null; do sleep 5; done
              curl -sf -X POST http://ollama:11434/api/pull -d '{"name":"nomic-embed-text"}'
