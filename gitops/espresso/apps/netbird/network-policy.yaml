apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: netbird
  namespace: netbird
spec:
  endpointSelector: {}
  ingress:
    # Kubelet HTTP probes and node-forwarded LB traffic
    - fromEntities:
        - host
        - remote-node
    # Gateway API traffic (public + internal gateway)
    - fromEntities:
        - ingress
    # LAN and VPN direct access to LB VIPs
    - fromCIDR:
        - 10.0.186.0/24
        - fd7a:115c:a1e0:186::/64
        - 10.0.187.0/24
        - fd7a:115c:a1e0:187::/64
        - 100.102.0.0/16
    # Internet access for coturn STUN/TURN (port-forwarded from router)
    - fromCIDR:
        - 0.0.0.0/0
        - ::/0
      toPorts:
        - ports:
            - port: "3478"
              protocol: UDP
    # Prometheus metrics scraping
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    # Uptime-kuma monitoring
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: uptime-kuma
            k8s:app: uptime-kuma
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # Server needs PostgreSQL
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: postgres
            k8s:app: postgres
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Server needs Pocket ID (OIDC) and internet (OIDC validation)
    # Coturn needs world for UDP relay
    # Relay needs world for WebSocket
    - toEntities:
        - world
