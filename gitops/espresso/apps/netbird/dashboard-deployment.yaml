apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-dashboard
  namespace: netbird
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netbird-dashboard
  template:
    metadata:
      labels:
        app: netbird-dashboard
      annotations:
        secret.reloader.stakater.com/reload: netbird-dashboard-env
    spec:
      containers:
        - name: dashboard
          image: netbirdio/dashboard:v2.95.0@sha256:131dd3dd8704139256f2d1358de7f7aa7c630bf0081cff6370b66443710ce9d0
          envFrom:
            - secretRef:
                name: netbird-dashboard-env
          ports:
            - containerPort: 80
              name: http
