apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-dashboard
  namespace: netbird
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netbird-dashboard
  template:
    metadata:
      labels:
        app: netbird-dashboard
      annotations:
        secret.reloader.stakater.com/reload: netbird-dashboard-env
    spec:
      containers:
        - name: dashboard
          image: netbirdio/dashboard:v2.90.10@sha256:fbfadd3ee7a905ed47f1fc3c54cdca6cf1079928e952bdaa34c138c072a9c236
          envFrom:
            - secretRef:
                name: netbird-dashboard-env
          ports:
            - containerPort: 80
              name: http
