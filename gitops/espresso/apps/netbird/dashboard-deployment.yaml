apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-dashboard
  namespace: netbird
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netbird-dashboard
  template:
    metadata:
      labels:
        app: netbird-dashboard
      annotations:
        secret.reloader.stakater.com/reload: netbird-dashboard-env
    spec:
      containers:
        - name: dashboard
          image: netbirdio/dashboard:v2.93.0@sha256:375d8b249f6c26110a8b8faa9bacb790e5486e2bca7be519e38ae05e57326dc3
          envFrom:
            - secretRef:
                name: netbird-dashboard-env
          ports:
            - containerPort: 80
              name: http
