apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-dashboard
  namespace: netbird
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netbird-dashboard
  template:
    metadata:
      labels:
        app: netbird-dashboard
      annotations:
        secret.reloader.stakater.com/reload: netbird-dashboard-env
    spec:
      containers:
        - name: dashboard
          image: netbirdio/dashboard:v2.96.0@sha256:6f3efefd2e123440a9663f989e121461cc7047e74449763b07332c5e2f99fc27
          env:
            - name: NETBIRD_AGENT_NETWORK_ENABLED
              value: "true"
          envFrom:
            - secretRef:
                name: netbird-dashboard-env
          ports:
            - containerPort: 80
              name: http
