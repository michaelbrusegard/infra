apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: netbird-signal
  namespace: netbird
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: https
  hostnames:
    - netbird.asgard.michaelbrusegard.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /signalexchange.SignalExchange
      backendRefs:
        - name: netbird-signal
          port: 10000
---
apiVersion: gateway.networking.k8s.io/v1
