apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-coturn
  namespace: netbird
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netbird-coturn
  template:
    metadata:
      labels:
        app: netbird-coturn
    spec:
      containers:
        - name: coturn
          image: coturn/coturn:4@sha256:867607152c6ed9504a0b59a2546a9bd2872dcf74313b3bc6cf9b69cc81be6fb3
          command: ["/bin/bash", "-c"]
          args:
            - |
              EXTERNAL_IP=$(/usr/local/bin/detect-external-ip.sh --ipv4 2>/dev/null) || true
              exec turnserver -c /etc/coturn/turnserver.conf ${EXTERNAL_IP:+-X "$EXTERNAL_IP"}
          ports:
            - containerPort: 3478
              name: stun
              protocol: UDP
          volumeMounts:
            - mountPath: /etc/coturn/turnserver.conf
              name: config
              subPath: turnserver.conf
      volumes:
        - name: config
          secret:
            secretName: netbird-coturn-config
