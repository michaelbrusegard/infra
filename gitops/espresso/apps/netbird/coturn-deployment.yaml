apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-coturn
  namespace: netbird
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netbird-coturn
  template:
    metadata:
      labels:
        app: netbird-coturn
      annotations:
        secret.reloader.stakater.com/reload: netbird-coturn-config
    spec:
      containers:
        - name: coturn
          image: coturn/coturn:4.16.0@sha256:0d2550a1c0d3d28660b08b8cef0b6f02fcefe4f438bb4eaf66b76eb06d8ca709
          command: ["/bin/bash", "-c"]
          args:
            - |
              EXTERNAL_IP=$(/usr/local/bin/detect-external-ip.sh --ipv4 2>/dev/null) || true
              exec turnserver -c /etc/coturn/turnserver.conf ${EXTERNAL_IP:+-X "$EXTERNAL_IP"}
          ports:
            - containerPort: 3478
              name: stun
              protocol: UDP
          volumeMounts:
            - mountPath: /etc/coturn/turnserver.conf
              name: config
              subPath: turnserver.conf
      volumes:
        - name: config
          secret:
            secretName: netbird-coturn-config
