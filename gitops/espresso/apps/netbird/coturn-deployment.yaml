apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-coturn
  namespace: netbird
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netbird-coturn
  template:
    metadata:
      labels:
        app: netbird-coturn
      annotations:
        secret.reloader.stakater.com/reload: netbird-coturn-config
    spec:
      containers:
        - name: coturn
          image: coturn/coturn:4.19.2@sha256:2c2a2854c5fc6151c0512a172664a2083b5e1365b32e07b99886d3340cbcd9d0
          command: ["/bin/bash", "-c"]
          args:
            - |
              EXTERNAL_IP=$(/usr/local/bin/detect-external-ip.sh --ipv4 2>/dev/null) || true
              exec turnserver -c /etc/coturn/turnserver.conf ${EXTERNAL_IP:+-X "$EXTERNAL_IP"}
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          ports:
            - containerPort: 3478
              name: stun
              protocol: UDP
            - containerPort: 3478
              name: turn-tcp
          # The entrypoint looks up the public address before it listens, which
          # has taken 80 seconds.
          startupProbe:
            tcpSocket:
              port: turn-tcp
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: turn-tcp
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: turn-tcp
            periodSeconds: 30
          volumeMounts:
            - mountPath: /etc/coturn/turnserver.conf
              name: config
              subPath: turnserver.conf
      volumes:
        - name: config
          secret:
            secretName: netbird-coturn-config
