apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-signal
  namespace: netbird
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netbird-signal
  template:
    metadata:
      labels:
        app: netbird-signal
    spec:
      containers:
        - name: signal
          image: netbirdio/signal:0.68.1@sha256:0f582747b773c4ab53ef5b8c1af91420c12f90b2f13ad5e60eefb9573ebf989d
          args:
            - --port
            - "10000"
            - --log-file
            - console
            - --log-level
            - info
          ports:
            - containerPort: 10000
              name: signal
