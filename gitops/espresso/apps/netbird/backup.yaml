apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: netbird-data-backup
  namespace: netbird
spec:
  sourcePVC: data-netbird-server-0
  trigger:
    schedule: "20 2 * * *"
  restic:
    repository: freddo-restic-netbird-data
    moverSecurityContext:
      runAsUser: 0
      runAsGroup: 0
    copyMethod: Direct
    cacheStorageClassName: openebs-hostpath
    cacheCapacity: 1Gi
