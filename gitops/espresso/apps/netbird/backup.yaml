apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: netbird-data-backup
  namespace: netbird
spec:
  sourcePVC: data-netbird-server-0
  trigger:
    schedule: "20 2 * * *"
  restic:
    repository: freddo-restic-netbird-pvc
    pruneIntervalDays: 36500
    retain:
      within: 100y
    moverSecurityContext:
      runAsUser: 0
      runAsGroup: 0
    copyMethod: Snapshot
    volumeSnapshotClassName: mayastor-snapshot
    cacheStorageClassName: openebs-single-replica
    cacheCapacity: 1Gi
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: netbird-agent-network-data-backup
  namespace: netbird
spec:
  sourcePVC: data-netbird-agent-network-0
  trigger:
    schedule: "25 2 * * *"
  restic:
    repository: freddo-restic-netbird-agent-network
    pruneIntervalDays: 36500
    retain:
      within: 100y
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    copyMethod: Snapshot
    volumeSnapshotClassName: mayastor-snapshot
    cacheStorageClassName: openebs-single-replica
    cacheCapacity: 1Gi
