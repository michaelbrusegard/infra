apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-relay
  namespace: netbird
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netbird-relay
  template:
    metadata:
      labels:
        app: netbird-relay
      annotations:
        secret.reloader.stakater.com/reload: netbird-relay-env
    spec:
      containers:
        - name: relay
          image: netbirdio/relay:0.74.7@sha256:875e11d2f5a08ec9c486decfa187e5585b9eb6969c43fa269b399ffcbb9dc526
          env:
            - name: NB_LOG_LEVEL
              value: info
            - name: NB_LISTEN_ADDRESS
              value: ":33080"
          envFrom:
            - secretRef:
                name: netbird-relay-env
          ports:
            - containerPort: 33080
              name: relay
