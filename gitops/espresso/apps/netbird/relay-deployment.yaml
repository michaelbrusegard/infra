apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-relay
  namespace: netbird
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netbird-relay
  template:
    metadata:
      labels:
        app: netbird-relay
    spec:
      containers:
        - name: relay
          image: netbirdio/relay:0.68.2@sha256:3e02d1813408289bcaf5cc48fa3fb51f9b95d0709f9643fed2c943c22feec326
          env:
            - name: NB_LOG_LEVEL
              value: info
            - name: NB_LISTEN_ADDRESS
              value: ":33080"
          envFrom:
            - secretRef:
                name: netbird-relay-env
          ports:
            - containerPort: 33080
              name: relay
