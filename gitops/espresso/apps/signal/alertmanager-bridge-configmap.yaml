apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-signal-bridge
  namespace: signal
data:
  bridge.py: |
    #!/usr/bin/env python3
    """Tiny alertmanager -> signal-cli JSON-RPC bridge.

    Accepts Alertmanager webhook POST on /alert, batches each contained
    alert into one Signal message, and forwards it to signal-cli's native
    JSON-RPC daemon HTTP endpoint.
    """
    from __future__ import annotations

    import http.server
    import json
    import logging
    import os
    import sys
    import urllib.parse
    import urllib.request

    SIGNAL_URL = os.environ["SIGNAL_URL"]
    SIGNAL_RECIPIENT = os.environ["SIGNAL_RECIPIENT"]
    PORT = int(os.environ.get("PORT", "8080"))
    GRAFANA_BASE_URL = os.environ.get("GRAFANA_BASE_URL", "").rstrip("/")
    GRAFANA_PROMETHEUS_DATASOURCE = os.environ.get(
        "GRAFANA_PROMETHEUS_DATASOURCE", "Prometheus"
    )

    # Label keys we will prefer (in order) when picking a "target" for the message.
    # Generic Prometheus alert labels are way more useful than the kubelet endpoint
    # that ends up in `instance` for kubelet-derived alerts.
    TARGET_LABEL_PRIORITY = (
        "persistentvolumeclaim",
        "pod",
        "deployment",
        "statefulset",
        "daemonset",
        "container",
        "node",
        "service",
        "job",
        "instance",
    )

    logging.basicConfig(
        level=os.environ.get("LOG_LEVEL", "INFO"),
        format="%(asctime)s %(levelname)s %(message)s",
        stream=sys.stdout,
    )
    log = logging.getLogger("bridge")


    def pick_target(labels: dict) -> str:
        ns = labels.get("namespace")
        for key in TARGET_LABEL_PRIORITY:
            value = labels.get(key)
            if not value:
                continue
            if ns and key != "namespace":
                return f"{ns}/{value} ({key})"
            return f"{value} ({key})"
        return ns or ""


    def rewrite_url(generator_url: str) -> str:
        if not generator_url:
            return ""
        if not GRAFANA_BASE_URL:
            return generator_url
        try:
            parsed = urllib.parse.urlparse(generator_url)
            params = urllib.parse.parse_qs(parsed.query)
            expr = (params.get("g0.expr") or [""])[0]
        except (ValueError, KeyError):
            return generator_url
        if not expr:
            return generator_url
        left = json.dumps(
            {
                "datasource": GRAFANA_PROMETHEUS_DATASOURCE,
                "queries": [
                    {
                        "refId": "A",
                        "expr": expr,
                        "datasource": {"type": "prometheus", "uid": GRAFANA_PROMETHEUS_DATASOURCE},
                    }
                ],
                "range": {"from": "now-1h", "to": "now"},
            },
            separators=(",", ":"),
        )
        query = urllib.parse.urlencode({"orgId": "1", "left": left})
        return f"{GRAFANA_BASE_URL}/explore?{query}"


    def format_alert(alert: dict) -> str:
        status = alert.get("status", "firing")
        labels = alert.get("labels", {})
        annotations = alert.get("annotations", {})
        severity = labels.get("severity", "unknown")
        name = labels.get("alertname", "alert")
        body = annotations.get("description") or annotations.get("summary") or ""
        icon = "🔥" if status == "firing" else "✅"

        lines = [f"{icon} [{severity.upper()}] {name} ({status})"]
        if body:
            lines.append(body)
        target = pick_target(labels)
        if target:
            lines.append(f"target: {target}")
        runbook = annotations.get("runbook_url")
        if runbook:
            lines.append(f"runbook: {runbook}")
        link = rewrite_url(alert.get("generatorURL", ""))
        if link:
            lines.append(link)
        return "\n".join(lines).strip()


    def send_signal(message: str) -> None:
        body = json.dumps(
            {
                "jsonrpc": "2.0",
                "method": "send",
                "params": {
                    "recipient": [SIGNAL_RECIPIENT],
                    "message": message,
                },
                "id": 1,
            }
        ).encode()
        req = urllib.request.Request(
            SIGNAL_URL,
            data=body,
            headers={"content-type": "application/json"},
            method="POST",
        )
        with urllib.request.urlopen(req, timeout=20) as resp:
            payload = resp.read().decode()
            log.info("signal-cli response: %s", payload[:300])


    class Handler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):  # noqa: N802
            if self.path == "/healthz":
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"ok")
                return
            self.send_response(404)
            self.end_headers()

        def do_POST(self):  # noqa: N802
            if self.path != "/alert":
                self.send_response(404)
                self.end_headers()
                return
            length = int(self.headers.get("content-length", 0) or 0)
            try:
                payload = json.loads(self.rfile.read(length) or b"{}")
            except json.JSONDecodeError as err:
                log.error("invalid JSON: %s", err)
                self.send_response(400)
                self.end_headers()
                return

            alerts = payload.get("alerts", [])
            log.info(
                "received %d alert(s); status=%s receiver=%s",
                len(alerts),
                payload.get("status"),
                payload.get("receiver"),
            )

            errors: list[str] = []
            for alert in alerts:
                msg = format_alert(alert)
                try:
                    send_signal(msg)
                except Exception as err:  # noqa: BLE001
                    log.exception("send failed: %s", err)
                    errors.append(str(err))

            if errors:
                self.send_response(502)
                self.end_headers()
                self.wfile.write(json.dumps({"errors": errors}).encode())
                return
            self.send_response(204)
            self.end_headers()

        def log_message(self, format, *args):  # noqa: A002,N802
            log.info("%s - %s", self.address_string(), format % args)


    if __name__ == "__main__":
        log.info(
            "alertmanager-signal-bridge listening on :%d -> %s recipient=%s",
            PORT,
            SIGNAL_URL,
            SIGNAL_RECIPIENT,
        )
        http.server.ThreadingHTTPServer(("0.0.0.0", PORT), Handler).serve_forever()
