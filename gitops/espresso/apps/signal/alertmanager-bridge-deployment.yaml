apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-signal-bridge
  namespace: signal
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: alertmanager-signal-bridge
  template:
    metadata:
      labels:
        app: alertmanager-signal-bridge
      annotations:
        checksum/config: replace-on-bridge-script-change
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bridge
          image: python:3.13-alpine@sha256:9b4929a72599b6c6389ece4ecbf415fd1355129f22bb92bb137eea098f05e975
          command:
            - python3
            - -u
            - /app/bridge.py
          env:
            - name: SIGNAL_URL
              value: http://signal-cli.signal.svc.cluster.local:3000/api/v1/rpc
            - name: SIGNAL_RECIPIENT
              valueFrom:
                secretKeyRef:
                  name: signal-cli-env
                  key: SIGNAL_ACCOUNT
            - name: PORT
              value: "8080"
            - name: LOG_LEVEL
              value: INFO
            - name: GRAFANA_BASE_URL
              value: https://grafana.gullhaugveien.michaelbrusegard.com
            - name: GRAFANA_PROMETHEUS_DATASOURCE
              value: Prometheus
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 128Mi
              cpu: 200m
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: alertmanager-signal-bridge
            items:
              - key: bridge.py
                path: bridge.py
