apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
  namespace: searxng
data:
  run.sh: |
    #!/bin/sh
    set -eu

    range_file=/ipv6-rotation/ipv6-range

    read_range() {
      range="$(cat "$range_file" 2>/dev/null || true)"
      printf '%s\n' "${range:-::}"
    }

    active_range="$(read_range)"
    sed "s|__IPV6_RANGE__|$active_range|g" \
      /template/settings.yml > /etc/searxng/settings.yml

    /usr/local/searxng/entrypoint.sh &
    searxng_pid=$!

    terminate() {
      kill -TERM "$searxng_pid" 2>/dev/null || true
      wait "$searxng_pid" 2>/dev/null || true
      exit 0
    }
    trap terminate INT TERM

    while kill -0 "$searxng_pid" 2>/dev/null; do
      sleep 30 &
      wait "$!" || true
      current_range="$(read_range)"
      if [ "$current_range" != "$active_range" ]; then
        echo "IPv6 rotation range changed; restarting SearXNG"
        terminate
      fi
    done

    wait "$searxng_pid"

  settings.yml: |
    use_default_settings: true

    general:
      instance_name: Espresso Search

    search:
      formats:
        - html
        - json

    server:
      image_proxy: true
      method: GET

    ui:
      query_in_title: false

    outgoing:
      networks:
        # Every request leaves from a different address in a /120 slice of the
        # ISP-delegated GUA /64, spreading per-IP rate limits and CAPTCHAs.
        # The container renders the range from the node's
        # /run/searxng/ipv6-range (hosts/espresso/ipv6-rotation.nix) and
        # restarts itself when that range changes.
        rotating_ipv6:
          local_addresses:
            - "__IPV6_RANGE__"

    # Google CSE has native IPv6 endpoints and uses the rotating range.
    # Brave, DuckDuckGo, Startpage, and Mojeek are disabled because they
    # failed the rotation canary, returned CAPTCHAs, or produced no usable
    # results.
    engines:
      - name: google cse
        network: rotating_ipv6
      - name: brave
        disabled: true
      - name: startpage
        disabled: true
      - name: duckduckgo
        disabled: true
