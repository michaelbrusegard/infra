apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      automountServiceAccountToken: false
      # hostNetwork: binding arbitrary source addresses from the delegated GUA
      # range (hosts/espresso/ipv6-rotation.nix) requires the host namespace.
      # The pod is reached through its node IP; the cilium host firewall
      # already allows cluster and remote-node traffic to it.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: searxng
              topologyKey: kubernetes.io/hostname
      securityContext:
        fsGroup: 977
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 977
        runAsNonRoot: true
        runAsUser: 977
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: searxng
          image: docker.io/searxng/searxng:2026.8.1-8892414dc@sha256:ec536bcd1e83577aad4cc07f7ecb9a30858a9a905d2d57c8796abc83f872a036
          command:
            - /bin/sh
            - /template/run.sh
          env:
            - name: FORCE_OWNERSHIP
              value: "false"
            - name: SEARXNG_BASE_URL
              value: https://search.asgard.michaelbrusegard.com/
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: searxng-env
                  key: SEARXNG_SECRET
          ports:
            - containerPort: 8080
              name: http
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config-template
              mountPath: /template
              readOnly: true
            - name: ipv6-rotation
              mountPath: /ipv6-rotation
              readOnly: true
            - name: config
              mountPath: /etc/searxng
            - name: cache
              mountPath: /var/cache/searxng
            - name: tmp
              mountPath: /tmp
            - name: marginalia-api-key
              mountPath: /run/secrets/marginalia-api-key
              subPath: MARGINALIA_API_KEY
              readOnly: true
      volumes:
        - name: config-template
          configMap:
            name: searxng-config
        - name: config
          emptyDir: {}
        - name: ipv6-rotation
          hostPath:
            path: /run/searxng
            type: DirectoryOrCreate
        - name: cache
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
        - name: marginalia-api-key
          secret:
            secretName: searxng-env
            items:
              - key: MARGINALIA_API_KEY
                path: MARGINALIA_API_KEY
