apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      automountServiceAccountToken: false
      # hostNetwork: binding arbitrary source addresses from the delegated GUA
      # range (hosts/espresso/ipv6-rotation.nix) requires the host namespace.
      # The pod is reached through its node IP; the cilium host firewall
      # already allows cluster and remote-node traffic to it.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        fsGroup: 977
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 977
        runAsNonRoot: true
        runAsUser: 977
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: render-config
          image: busybox:1.38.0@sha256:1cfa4e2b09e127b9c4ed43578d3f3c18e7d44ea47b9ea98475c0cbe9086525f8
          command:
            - sh
            - -c
            - |
              set -eu
              range="$(cat /ipv6-rotation/range 2>/dev/null || true)"
              [ -n "$range" ] || range="::"
              sed "s|__IPV6_RANGE__|$range|g" /template/settings.yml > /config/settings.yml
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: config-template
              mountPath: /template
              readOnly: true
            - name: config
              mountPath: /config
            - name: ipv6-rotation
              mountPath: /ipv6-rotation
              readOnly: true
      containers:
        - name: searxng
          image: docker.io/searxng/searxng:2026.8.1-8892414dc@sha256:ec536bcd1e83577aad4cc07f7ecb9a30858a9a905d2d57c8796abc83f872a036
          env:
            - name: FORCE_OWNERSHIP
              value: "false"
            - name: SEARXNG_BASE_URL
              value: https://search.asgard.michaelbrusegard.com/
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: searxng-env
                  key: SEARXNG_SECRET
          ports:
            - containerPort: 8080
              name: http
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
              readOnly: true
            - name: cache
              mountPath: /var/cache/searxng
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config-template
          configMap:
            name: searxng-config
        - name: config
          emptyDir: {}
        - name: ipv6-rotation
          hostPath:
            path: /run/searxng
            type: DirectoryOrCreate
        - name: cache
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
