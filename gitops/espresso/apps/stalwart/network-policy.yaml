apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: stalwart
  namespace: stalwart
spec:
  endpointSelector:
    matchLabels:
      app: stalwart
  ingress:
    # Kubelet HTTP probes and node-forwarded LB traffic
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "25"
              protocol: TCP
            - port: "465"
              protocol: TCP
            - port: "587"
              protocol: TCP
            - port: "993"
              protocol: TCP
            - port: "4190"
              protocol: TCP
            - port: "8080"
              protocol: TCP
    # Gateway API traffic (public mta-sts + internal admin/JMAP/autoconfig)
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # The headless inbound edge may deliver over LMTP and read the address
    # inventory over the management API. Neither port is exposed by the edge.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: stalwart-edge
            k8s:app: stalwart-edge
      toPorts:
        - ports:
            - port: "24"
              protocol: TCP
            - port: "443"
              protocol: TCP
    # Public-facing mail ports: inbound SMTP, client submission, and IMAP.
    # Auth ports are exposed to the world so mail clients work without VPN;
    # Stalwart's built-in fail2ban handles brute-force noise.
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "25"
              protocol: TCP
            - port: "465"
              protocol: TCP
            - port: "587"
              protocol: TCP
            - port: "993"
              protocol: TCP
    # WebUI/JMAP (443) and ManageSieve (4190) stay LAN + NetBird VPN only -
    # admin stays off the public internet.
    - fromCIDR:
        - 10.0.186.0/24
        - fd7a:115c:a1e0:186::/64
        - 10.0.187.0/24
        - fd7a:115c:a1e0:187::/64
        - 100.102.0.0/16
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "4190"
              protocol: TCP
    # Uptime-kuma monitoring (TCP probes on all listeners)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: uptime-kuma
            k8s:app: uptime-kuma
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "25"
              protocol: TCP
            - port: "465"
              protocol: TCP
            - port: "587"
              protocol: TCP
            - port: "993"
              protocol: TCP
            - port: "4190"
              protocol: TCP
    # Nextcloud Mail in the manafishrov tenant: IMAPS + Submissions for
    # the master-user impersonation flow.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: manafishrov-nextcloud
            k8s:app: nextcloud
      toPorts:
        - ports:
            - port: "993"
              protocol: TCP
            - port: "465"
              protocol: TCP
    # Roundcube webmail in the manafishrov tenant: IMAPS + Submissions.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: manafishrov-roundcube
            k8s:app: roundcube
      toPorts:
        - ports:
            - port: "993"
              protocol: TCP
            - port: "465"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # Outbound SMTP delivery to the world (port 25) + TLS lookups (443) for
    # MTA-STS policy fetching / WebPKI revocation.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "25"
              protocol: TCP
            - port: "465"
              protocol: TCP
            - port: "587"
              protocol: TCP
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
