apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: stalwart-data-backup
  namespace: stalwart
spec:
  sourcePVC: data-stalwart-0
  trigger:
    schedule: "10 3 * * *"
  restic:
    repository: freddo-restic-stalwart-pvc
    pruneIntervalDays: 36500
    retain:
      within: 100y
    moverSecurityContext:
      runAsUser: 2000
      runAsGroup: 2000
    copyMethod: Snapshot
    volumeSnapshotClassName: mayastor-snapshot
    cacheStorageClassName: openebs-hostpath
    cacheCapacity: 2Gi
