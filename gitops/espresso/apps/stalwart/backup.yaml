apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: stalwart-data-backup
  namespace: stalwart
spec:
  sourcePVC: data-stalwart-0
  trigger:
    schedule: "20 */6 * * *"
  restic:
    # New mail/* group; the retired stalwart/* repositories keep their history.
    repository: freddo-restic-mail-stalwart
    pruneIntervalDays: 30
    retain:
      daily: 14
      weekly: 8
      monthly: 12
    moverSecurityContext:
      runAsUser: 2000
      runAsGroup: 2000
    copyMethod: Snapshot
    volumeSnapshotClassName: mayastor-snapshot
    cacheStorageClassName: openebs-single-replica
    cacheCapacity: 2Gi
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: bulwark-settings-backup
  namespace: stalwart
spec:
  sourcePVC: bulwark-settings
  trigger:
    schedule: "40 */6 * * *"
  restic:
    repository: freddo-restic-mail-bulwark-settings
    pruneIntervalDays: 30
    retain:
      daily: 14
      weekly: 8
      monthly: 12
    moverSecurityContext:
      runAsUser: 1001
      runAsGroup: 1001
    copyMethod: Snapshot
    volumeSnapshotClassName: mayastor-snapshot
    cacheStorageClassName: openebs-single-replica
    cacheCapacity: 1Gi
