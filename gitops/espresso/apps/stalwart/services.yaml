apiVersion: v1
kind: Service
metadata:
  name: stalwart-internal
  namespace: stalwart
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: stalwart
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: https
      port: 443
      targetPort: https
    - name: edge-lmtp
      port: 24
      targetPort: edge-lmtp
    - name: edge-smtp
      port: 25
      targetPort: edge-smtp
    - name: edge-smtp-local
      port: 26
      targetPort: edge-smtp-local
    - name: submissions
      port: 465
      targetPort: submissions
    - name: submission
      port: 587
      targetPort: submission
    - name: imaps
      port: 993
      targetPort: imaps
    - name: sieve
      port: 4190
      targetPort: sieve
---
apiVersion: v1
kind: Service
metadata:
  name: stalwart
  namespace: stalwart
  annotations:
    lbipam.cilium.io/ips: 10.0.188.13,fd7a:115c:a1e0:188::13
    # k8s-gateway publishes this LAN-only name; it matches the wildcard TLS certificate.
    coredns.io/hostname: mail-backend.asgard.michaelbrusegard.com
spec:
  type: LoadBalancer
  ipFamilyPolicy: PreferDualStack
  ipFamilies:
    - IPv4
    - IPv6
  externalTrafficPolicy: Local
  selector:
    app: stalwart
  ports:
    # Edge ports are reachable only by the smtp-edge Cilium identity.
    - name: edge-lmtp
      port: 24
      targetPort: edge-lmtp
    - name: edge-smtp
      port: 25
      targetPort: edge-smtp
    - name: edge-smtp-local
      port: 26
      targetPort: edge-smtp-local
    - name: https
      port: 443
      targetPort: https
    - name: submissions
      port: 465
      targetPort: submissions
    - name: submission
      port: 587
      targetPort: submission
    - name: imaps
      port: 993
      targetPort: imaps
    - name: sieve
      port: 4190
      targetPort: sieve
