apiVersion: v1
kind: ServiceAccount
metadata:
  name: stalwart-seed
  namespace: stalwart
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stalwart-seed
  namespace: stalwart
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/exec
    verbs:
      - get
      - list
      - create
  - apiGroups:
      - apps
    resources:
      - statefulsets
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stalwart-seed
  namespace: stalwart
subjects:
  - kind: ServiceAccount
    name: stalwart-seed
    namespace: stalwart
roleRef:
  kind: Role
  name: stalwart-seed
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: stalwart-seed
  namespace: stalwart
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app: stalwart-seed
        spec:
          serviceAccountName: stalwart-seed
          restartPolicy: OnFailure
          containers:
            - name: seed
              image: alpine:3.20
              envFrom:
                - secretRef:
                    name: stalwart-env
              env:
                - name: STALWART_URL
                  value: http://stalwart-internal.stalwart.svc.cluster.local:8080
                - name: STALWART_CLI_VERSION
                  value: v1.0.7
                - name: KUBECTL_VERSION
                  value: v1.34.5
                - name: STALWART_HOSTNAME
                  value: mail.asgard.michaelbrusegard.com
              command:
                - sh
                - -c
                - |
                  set -eu

                  apk add --no-cache curl jq xz

                  curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" -o /usr/local/bin/kubectl
                  chmod +x /usr/local/bin/kubectl

                  if kubectl exec -n stalwart stalwart-0 -- test -f /var/lib/stalwart/.seeded 2>/dev/null; then
                    echo "stalwart already seeded"
                    exit 0
                  fi

                  ARCH=$(uname -m)
                  case "$ARCH" in
                    x86_64) TARGET=x86_64-unknown-linux-musl ;;
                    aarch64) TARGET=aarch64-unknown-linux-musl ;;
                    *) echo "unsupported arch: $ARCH"; exit 1 ;;
                  esac
                  CLI_URL="https://github.com/stalwartlabs/cli/releases/download/${STALWART_CLI_VERSION}/stalwart-cli-${TARGET}.tar.xz"
                  curl -fsSL "$CLI_URL" | tar -xJ -C /usr/local/bin/ --strip-components=1 "stalwart-cli-${TARGET}/stalwart-cli"
                  chmod +x /usr/local/bin/stalwart-cli

                  for i in $(seq 1 60); do
                    if curl -sf -o /dev/null --max-time 3 "$STALWART_URL/" || curl -sf -o /dev/null --max-time 3 "$STALWART_URL/healthz/live"; then
                      echo "stalwart recovery listener reachable"
                      break
                    fi
                    echo "waiting for stalwart recovery listener ($i/60)"
                    sleep 5
                  done

                  STALWART_USER=$(echo "$STALWART_RECOVERY_ADMIN" | cut -d: -f1)
                  STALWART_PASSWORD=$(echo "$STALWART_RECOVERY_ADMIN" | cut -d: -f2-)
                  ADMIN_LOCAL_JSON=$(printf '%s' "infra" | jq -Rs .)
                  ADMIN_PASSWORD_JSON=$(printf '%s' "$STALWART_ADMIN_PASSWORD" | jq -Rs .)
                  export STALWART_URL STALWART_USER STALWART_PASSWORD

                  sed \
                    -e "s|__ADMIN_LOCAL_JSON__|${ADMIN_LOCAL_JSON}|g" \
                    -e "s|__ADMIN_PASSWORD_JSON__|${ADMIN_PASSWORD_JSON}|g" \
                    /seed/plan-template.ndjson > /tmp/plan.ndjson

                  stalwart-cli apply --file /tmp/plan.ndjson

                  DOMAIN_ID=$(stalwart-cli query Domain --no-color 2>/dev/null | awk 'NR>1 && /^[a-z0-9]+/{print $1; exit}')
                  CERT_ID=$(stalwart-cli query Certificate --no-color 2>/dev/null | awk 'NR>1 && /^[a-z0-9]+/{print $1; exit}')
                  if [ -z "$DOMAIN_ID" ] || [ -z "$CERT_ID" ]; then
                    echo "failed to resolve Domain or Certificate id after apply"
                    exit 1
                  fi

                  stalwart-cli update SystemSettings \
                    --field "defaultHostname=$STALWART_HOSTNAME" \
                    --field "defaultDomainId=$DOMAIN_ID" \
                    --field "defaultCertificateId=$CERT_ID"

                  kubectl exec -n stalwart stalwart-0 -- touch /var/lib/stalwart/.seeded
                  kubectl rollout restart statefulset/stalwart -n stalwart
                  echo "stalwart seed complete"
              volumeMounts:
                - name: plan
                  mountPath: /seed
                  readOnly: true
          volumes:
            - name: plan
              configMap:
                name: stalwart-seed-plan
