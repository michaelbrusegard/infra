apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stalwart
  namespace: stalwart
  annotations:
    configmap.reloader.stakater.com/reload: stalwart-config
    secret.reloader.stakater.com/reload: stalwart-env,stalwart-dkim,wildcard-tls
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stalwart
  serviceName: stalwart-internal
  template:
    metadata:
      labels:
        app: stalwart
    spec:
      securityContext:
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: stalwart
          # Same patched native-SCIM build as the manafishrov tenant.
          image: ghcr.io/michaelbrusegard/stalwart-native-scim:1.0.3@sha256:67083aba390b26e3ee97c0f3c016bc473f10831dad4f7244b979e5dfcaf29ad8
          command:
            - /usr/local/bin/stalwart
            - --config
            - /var/lib/stalwart/config.json
          env:
            - name: STALWART_PUBLIC_URL
              value: https://mail.asgard.michaelbrusegard.com
            # Pocket ID admins get session-only Stalwart administration.
            - name: STALWART_OIDC_ADMIN_GROUP
              value: admin
          envFrom:
            - secretRef:
                name: stalwart-env
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 443
              name: https
            - containerPort: 24
              name: edge-lmtp
            - containerPort: 25
              name: edge-smtp
            - containerPort: 26
              name: edge-smtp-local
            - containerPort: 465
              name: submissions
            - containerPort: 587
              name: submission
            - containerPort: 993
              name: imaps
            - containerPort: 4190
              name: sieve
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - curl -fsS --max-time 3 http://127.0.0.1:8080/healthz/ready >/dev/null
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - mountPath: /var/lib/stalwart
              name: data
            - mountPath: /var/lib/stalwart/config.json
              name: config
              subPath: config.json
              readOnly: true
            - mountPath: /var/lib/stalwart/private/tls
              name: tls
              readOnly: true
            - mountPath: /var/lib/stalwart/private/dkim
              name: dkim
              readOnly: true
            - mountPath: /tmp
              name: temp
      volumes:
        - name: temp
          emptyDir: {}
        - name: config
          configMap:
            name: stalwart-config
        - name: tls
          secret:
            secretName: wildcard-tls
        - name: dkim
          secret:
            secretName: stalwart-dkim
            defaultMode: 0400
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
        storageClassName: ssd-ha
