apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stalwart
  namespace: stalwart
  annotations:
    configmap.reloader.stakater.com/reload: stalwart-config,stalwart-resolver
    secret.reloader.stakater.com/reload: stalwart-env,stalwart-dkim,wildcard-tls
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stalwart
  serviceName: stalwart-internal
  template:
    metadata:
      labels:
        app: stalwart
    spec:
      securityContext:
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # Stalwart builds the OIDC directory once at startup and never retries.
        # A transient discovery failure (e.g. a 403 from the Gateway while
        # Cilium converges after a node reboot) otherwise leaves every OIDC
        # login failing until the next restart.
        - name: wait-for-oidc
          image: ghcr.io/michaelbrusegard/stalwart-native-scim:1.0.3@sha256:46d8d1b0817f4c6b27ebbfac446353b977b61efde0a5563a1dbbed3e930ddde8
          command:
            - /bin/sh
            - -c
            - |
              until curl -fsS --max-time 5 -o /dev/null https://id.asgard.michaelbrusegard.com/.well-known/openid-configuration; do
                echo "waiting for Pocket ID discovery"
                sleep 5
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      containers:
        - name: stalwart
          # Same patched native-SCIM build as the manafishrov tenant.
          image: ghcr.io/michaelbrusegard/stalwart-native-scim:1.0.3@sha256:46d8d1b0817f4c6b27ebbfac446353b977b61efde0a5563a1dbbed3e930ddde8
          command:
            - /usr/local/bin/stalwart
            - --config
            - /var/lib/stalwart/config.json
          env:
            - name: STALWART_PUBLIC_URL
              value: https://mail.asgard.michaelbrusegard.com
            # Pocket ID admins get session-only Stalwart administration.
            - name: STALWART_OIDC_ADMIN_GROUP
              value: admin
            # Pocket ID groups here are access control, not shared mailboxes.
            - name: STALWART_SCIM_GROUPS
              value: ignore
          envFrom:
            - secretRef:
                name: stalwart-env
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 443
              name: https
            - containerPort: 24
              name: edge-lmtp
            - containerPort: 25
              name: edge-smtp
            - containerPort: 26
              name: edge-smtp-local
            - containerPort: 465
              name: submissions
            - containerPort: 587
              name: submission
            - containerPort: 993
              name: imaps
            - containerPort: 4190
              name: sieve
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - curl -fsS --max-time 3 http://127.0.0.1:8080/healthz/ready >/dev/null
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - mountPath: /var/lib/stalwart
              name: data
            - mountPath: /var/lib/stalwart/config.json
              name: config
              subPath: config.json
              readOnly: true
            - mountPath: /var/lib/stalwart/private/tls
              name: tls
              readOnly: true
            - mountPath: /var/lib/stalwart/private/dkim
              name: dkim
              readOnly: true
            - mountPath: /tmp
              name: temp
        # Recursive resolver for Stalwart's own lookups; see stalwart-resolver.
        - name: resolver
          image: docker.io/klutchell/unbound:v1.26.2@sha256:de8e624f84337bdb2d16540c0b203d5df2a981180421cb50ab4212b67542d8b4
          args:
            - -d
            - -c
            - /etc/unbound/unbound.conf
          readinessProbe:
            exec:
              command: ["drill", "-p", "5335", "@127.0.0.1", "localhost"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["drill", "-p", "5335", "@127.0.0.1", "localhost"]
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - mountPath: /etc/unbound/unbound.conf
              name: resolver
              subPath: unbound.conf
              readOnly: true
      volumes:
        - name: temp
          emptyDir: {}
        - name: resolver
          configMap:
            name: stalwart-resolver
        - name: config
          configMap:
            name: stalwart-config
        - name: tls
          secret:
            secretName: wildcard-tls
        - name: dkim
          secret:
            secretName: stalwart-dkim
            defaultMode: 0400
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
        storageClassName: ssd-ha
