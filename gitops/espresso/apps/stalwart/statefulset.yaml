apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stalwart
  namespace: stalwart
  annotations:
    configmap.reloader.stakater.com/reload: stalwart-plan,stalwart-reconciler,stalwart-entrypoint
    # wildcard-tls included so the pod rolls on renewal - Stalwart reads file
    # certs only at startup.
    secret.reloader.stakater.com/reload: stalwart-env,stalwart-dkim,wildcard-tls
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stalwart
  serviceName: stalwart-internal
  template:
    metadata:
      labels:
        app: stalwart
    spec:
      shareProcessNamespace: true
      securityContext:
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: stalwart
          image: stalwartlabs/stalwart:v0.16.13@sha256:254320d6d9af6bafce85fcf301aaa29fa0a4a07e2b91e19fe97588ecfb230fab
          command:
            - /entrypoint/entrypoint.sh
          env:
            - name: STALWART_PUBLIC_URL
              value: https://mail.asgard.michaelbrusegard.com
          envFrom:
            - secretRef:
                name: stalwart-env
                optional: true
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 443
              name: https
            - containerPort: 25
              name: smtp
            - containerPort: 465
              name: submissions
            - containerPort: 587
              name: submission
            - containerPort: 993
              name: imaps
            - containerPort: 4190
              name: sieve
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - mountPath: /var/lib/stalwart
              name: data
            - mountPath: /var/lib/stalwart/config.json
              name: config
              subPath: config.json
              readOnly: true
            - mountPath: /var/lib/stalwart/private/tls
              name: tls
              readOnly: true
            - mountPath: /var/lib/stalwart/private/dkim
              name: dkim
              readOnly: true
            - mountPath: /entrypoint
              name: entrypoint
              readOnly: true
        - name: reconciler
          image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          command:
            - /reconciler/reconciler.sh
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          env:
            - name: STALWART_CLI_VERSION
              value: v1.0.7
          envFrom:
            - secretRef:
                name: stalwart-env
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - mountPath: /var/lib/stalwart
              name: data
            - mountPath: /plan
              name: plan
              readOnly: true
            - mountPath: /reconciler
              name: reconciler
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: stalwart-config
        - name: tls
          secret:
            secretName: wildcard-tls
        - name: dkim
          secret:
            secretName: stalwart-dkim
        - name: entrypoint
          configMap:
            name: stalwart-entrypoint
            defaultMode: 0555
        - name: plan
          configMap:
            name: stalwart-plan
        - name: reconciler
          configMap:
            name: stalwart-reconciler
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
        storageClassName: ssd-ha
