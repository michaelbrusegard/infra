apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stalwart
  namespace: stalwart
spec:
  parentRefs:
    - name: internal
      namespace: gateway
      sectionName: https
    - name: public
      namespace: gateway
      sectionName: https
  hostnames:
    - mail.asgard.michaelbrusegard.com
  rules:
    - backendRefs:
        - name: stalwart-internal
          port: 8080
---
# Serves Stalwart's MTA-STS policy. Inert until the dns stack's
# mail_on_stalwart publishes the mta-sts names.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stalwart-mta-sts
  namespace: stalwart
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: https
    - name: internal
      namespace: gateway
      sectionName: https
  hostnames:
    - mta-sts.michaelbrusegard.com
    - mta-sts.michbrus.com
  rules:
    - matches:
        - path:
            type: Exact
            value: /.well-known/mta-sts.txt
      backendRefs:
        - name: stalwart-internal
          port: 8080
