apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stalwart
  namespace: stalwart
spec:
  parentRefs:
    - name: internal
      namespace: gateway
      sectionName: https
    - name: public
      namespace: gateway
      sectionName: https
  hostnames:
    - mail.asgard.michaelbrusegard.com
  rules:
    - backendRefs:
        - name: stalwart-internal
          port: 8080
