apiVersion: v1
kind: ServiceAccount
metadata:
  name: stalwart-seed
  namespace: stalwart
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stalwart-seed
  namespace: stalwart
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec"]
    verbs: ["get", "list", "create"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stalwart-seed
  namespace: stalwart
subjects:
  - kind: ServiceAccount
    name: stalwart-seed
    namespace: stalwart
roleRef:
  kind: Role
  name: stalwart-seed
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: stalwart-seed
  namespace: stalwart
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: stalwart-seed
    spec:
      serviceAccountName: stalwart-seed
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: alpine:3.20
          envFrom:
            - secretRef:
                name: stalwart-env
          env:
            - name: STALWART_URL
              value: http://stalwart-internal.stalwart.svc.cluster.local:8080
            - name: STALWART_CLI_VERSION
              value: v1.0.7
            - name: KUBECTL_VERSION
              value: v1.34.5
          command:
            - sh
            - -c
            - |
              set -eu
              apk add --no-cache curl xz
              echo "::: install kubectl"
              curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" -o /usr/local/bin/kubectl
              chmod +x /usr/local/bin/kubectl
              echo "::: check if already seeded"
              if kubectl exec -n stalwart stalwart-0 -- test -f /var/lib/stalwart/.seeded 2>/dev/null; then
                echo "marker present -> skipping (run on a fresh PVC if you need to re-seed)"
                exit 0
              fi
              echo "::: install stalwart-cli ${STALWART_CLI_VERSION}"
              ARCH=$(uname -m)
              case "$ARCH" in
                x86_64)  TARGET=x86_64-unknown-linux-musl ;;
                aarch64) TARGET=aarch64-unknown-linux-musl ;;
                *) echo "unsupported arch: $ARCH"; exit 1 ;;
              esac
              CLI_URL="https://github.com/stalwartlabs/cli/releases/download/${STALWART_CLI_VERSION}/stalwart-cli-${TARGET}.tar.xz"
              curl -fsSL "$CLI_URL" | tar -xJ -C /usr/local/bin/ stalwart-cli
              chmod +x /usr/local/bin/stalwart-cli
              echo "::: wait for stalwart-0 recovery listener"
              for i in $(seq 1 60); do
                if curl -sf -o /dev/null "$STALWART_URL/healthz/live" || curl -sf -o /dev/null "$STALWART_URL/"; then
                  echo "stalwart reachable on $STALWART_URL"
                  break
                fi
                echo "waiting ($i/60)..."
                sleep 5
              done
              echo "::: extract recovery admin credentials"
              STALWART_USER=$(echo "$STALWART_RECOVERY_ADMIN" | cut -d: -f1)
              STALWART_PASSWORD=$(echo "$STALWART_RECOVERY_ADMIN" | cut -d: -f2-)
              export STALWART_URL STALWART_USER STALWART_PASSWORD
              echo "::: apply seed plan"
              stalwart-cli apply --file /seed/plan.ndjson --continue-on-error
              echo "::: write marker to PVC via pod exec"
              kubectl exec -n stalwart stalwart-0 -- sh -c 'touch /var/lib/stalwart/.seeded'
              echo "::: trigger rollout to drop recovery mode"
              kubectl rollout restart statefulset/stalwart -n stalwart
              echo "::: seed complete"
          volumeMounts:
            - name: plan
              mountPath: /seed
              readOnly: true
      volumes:
        - name: plan
          configMap:
            name: stalwart-seed-plan
