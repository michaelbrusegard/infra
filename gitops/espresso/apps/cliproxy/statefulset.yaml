apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cliproxy
  namespace: cliproxy
spec:
  replicas: 1
  serviceName: cliproxy-internal
  selector:
    matchLabels:
      app: cliproxy
  template:
    metadata:
      labels:
        app: cliproxy
      annotations:
        configmap.reloader.stakater.com/reload: cliproxy
        secret.reloader.stakater.com/reload: cliproxy,cliproxy-management
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: render-config
          image: busybox:1.38.0@sha256:f97baa533a26513c453a362be331a43eb60214302f449c16571b23cea141dce4
          command:
            - sh
            - -c
            - |
              set -eu
              api_key="$(cat /secret/API_KEY)"
              management_key="$(cat /management-secret/MANAGEMENT_KEY)"
              sed \
                -e "s|__API_KEY__|$api_key|g" \
                -e "s|__MANAGEMENT_KEY__|$management_key|g" \
                /template/config.yaml > /config/config.yaml
              mkdir -p /data/auths
              chown -R 10000:10000 /config /data
              chmod 0600 /config/config.yaml
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: config-template
              mountPath: /template
              readOnly: true
            - name: secret
              mountPath: /secret
              readOnly: true
            - name: management-secret
              mountPath: /management-secret
              readOnly: true
            - name: config
              mountPath: /config
            - name: auth
              mountPath: /data
        - name: install-plugins
          # CI swaps this for the plugin image once it is built and publicly
          # pullable. Until then there is nothing to copy.
          image: busybox:1.38.0@sha256:f97baa533a26513c453a362be331a43eb60214302f449c16571b23cea141dce4
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /plugins/linux/amd64
              if [ -d /plugin ]; then
                cp /plugin/*.so /plugins/linux/amd64/
              fi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: plugins
              mountPath: /plugins
      containers:
        - name: cliproxy
          image: docker.io/eceasy/cli-proxy-api:v8.0.47@sha256:d1874eba7f9819f3a19a0fea0333b457d6fdd4cf290d4bfe4283be102dc489d9
          command:
            - /CLIProxyAPI/CLIProxyAPI
          args:
            - -config
            - /config/config.yaml
          ports:
            - name: http
              containerPort: 8317
            - name: oauth-8085
              containerPort: 8085
            - name: oauth-1455
              containerPort: 1455
            - name: oauth-54545
              containerPort: 54545
            - name: oauth-51121
              containerPort: 51121
            - name: oauth-11451
              containerPort: 11451
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: GOMEMLIMIT
              value: 900MiB
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /config
            - name: auth
              mountPath: /data
            - name: plugins
              mountPath: /plugins
              readOnly: true
      volumes:
        - name: config-template
          configMap:
            name: cliproxy
        - name: secret
          secret:
            secretName: cliproxy
        - name: management-secret
          secret:
            secretName: cliproxy-management
        - name: config
          emptyDir: {}
        - name: plugins
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: auth
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: nvme-ha
        resources:
          requests:
            storage: 2Gi
