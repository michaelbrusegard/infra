apiVersion: v1
kind: ConfigMap
metadata:
  name: cliproxy
  namespace: cliproxy
data:
  config.yaml: |
    host: ""
    port: 8317
    auth-dir: /data/auths
    api-keys:
      - __API_KEY__
    remote-management:
      allow-remote: true
      secret-key: __MANAGEMENT_KEY__
      disable-control-panel: false
    debug: false
    logging-to-file: false
    usage-statistics-enabled: true
    request-retry: 3
    max-retry-interval: 30
    # Keep each conversation on one account; prompt caches are per account.
    # Ignored while the soonest-reset plugin picks, which does the same.
    routing:
      session-affinity: true
    quota-exceeded:
      switch-project: true
      switch-preview-model: true
    plugins:
      enabled: true
      dir: /plugins
      configs:
        # Archives requests, responses, and usage into ClickHouse.
        clickhouse-archive:
          enabled: true
        # Sends new sessions to the account whose quota resets soonest.
        soonest-reset:
          enabled: true
