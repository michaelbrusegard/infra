apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uptime-kuma
  serviceName: uptime-kuma-internal
  template:
    metadata:
      labels:
        app: uptime-kuma
    spec:
      initContainers:
        - name: uptime-kuma
          restartPolicy: Always
          image: louislam/uptime-kuma:2.5.3@sha256:c332e5ac61496258fae91483c9d2b50557cfd8e1584d98844feb9145d292c4d3
          ports:
            - containerPort: 3001
              name: http
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          volumeMounts:
            - mountPath: /app/data
              name: data
      containers:
        - name: autokuma
          image: ghcr.io/bigboot/autokuma:2.0.0@sha256:8acbd3ad3ec8cb6c066aa0ee541154921283ec78159015937128541921c47974
          env:
            - name: AUTOKUMA__KUMA__URL
              value: "http://localhost:3001"
            - name: AUTOKUMA__STATIC_MONITORS
              value: "/monitors"
            - name: AUTOKUMA__DOCKER__ENABLED
              value: "false"
            - name: AUTOKUMA__FILES__ENABLED
              value: "true"
            - name: AUTOKUMA__FILES__FOLLOW_SYMLINKS
              value: "true"
            - name: AUTOKUMA__ON_DELETE
              value: "delete"
          envFrom:
            - secretRef:
                name: uptime-kuma-env
          volumeMounts:
            - mountPath: /monitors
              name: monitors
              readOnly: true
            - mountPath: /data
              name: autokuma-data
      volumes:
        - name: monitors
          projected:
            sources:
              - configMap:
                  name: uptime-kuma-monitors
              - configMap:
                  name: uptime-kuma-monitors-manafish
                  optional: true
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: nvme-ha
    - metadata:
        name: autokuma-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 100Mi
        storageClassName: nvme-ha
