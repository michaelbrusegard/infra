apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - statefulset.yaml
  - services.yaml
  - monitors.yaml
  - status-pages.yaml
  - reconciler.yaml
  - httproute.yaml
  - network-policy.yaml

configMapGenerator:
  - name: uptime-kuma-status-page-reconciler
    namespace: uptime-kuma
    files:
      - reconcile.py=scripts/reconcile.py

generatorOptions:
  disableNameSuffixHash: true
