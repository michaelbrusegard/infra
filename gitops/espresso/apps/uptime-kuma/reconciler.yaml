apiVersion: v1
kind: ConfigMap
metadata:
  name: uptime-kuma-status-page-reconciler
  namespace: uptime-kuma
data:
  reconcile.py: |
    #!/usr/bin/env python3
    # AutoKuma does not resolve monitor names in status_page entities and
    # never updates them after creation (sync.rs update_entity match falls
    # through to `_ => {}`). This script reconciles status pages
    # declaratively: resolve monitor names to numeric IDs against the live
    # Kuma API, then upsert via add_status_page / save_status_page.
    import json
    import os
    import pathlib
    import sys
    import time

    from uptime_kuma_api import UptimeKumaApi, UptimeKumaException

    URL = "http://uptime-kuma-internal.uptime-kuma.svc.cluster.local:3001"
    USERNAME = os.environ["AUTOKUMA__KUMA__USERNAME"]
    PASSWORD = os.environ["AUTOKUMA__KUMA__PASSWORD"]

    CONFIG_KEYS = {
        "title",
        "description",
        "theme",
        "published",
        "showTags",
        "domainNameList",
        "googleAnalyticsId",
        "customCSS",
        "footerText",
        "showPoweredBy",
        "showCertificateExpiry",
        "icon",
    }
    DEFAULT_THEME = "auto"
    DEFAULT_ICON = "/icon.svg"


    def connect() -> UptimeKumaApi:
        last: Exception | None = None
        for _ in range(60):
            try:
                api = UptimeKumaApi(URL, timeout=30)
                api.login(USERNAME, PASSWORD)
                return api
            except Exception as exc:  # noqa: BLE001
                last = exc
                print("Waiting for uptime-kuma API...", flush=True)
                time.sleep(2)
        raise SystemExit(f"uptime-kuma API never became ready: {last}")


    def resolve(page: dict, monitors_by_name: dict[str, int]) -> dict:
        groups = page.get("publicGroupList") or []
        for group in groups:
            resolved = []
            for entry in group.get("monitorList") or []:
                name = entry.get("name")
                mid = monitors_by_name.get(name)
                if mid is None:
                    raise SystemExit(f"monitor not found: {name!r}")
                resolved.append({"id": mid, "name": name})
            group["monitorList"] = resolved
        return page


    def save_page(api: UptimeKumaApi, slug: str, page: dict) -> None:
        config = {
            "slug": slug,
            "title": page.get("title", slug),
            "description": page.get("description") or "",
            "theme": page.get("theme", DEFAULT_THEME),
            "autoRefreshInterval": page.get("autoRefreshInterval", 300),
            "showTags": page.get("showTags", False),
            "footerText": page.get("footerText") or "",
            "customCSS": page.get("customCSS", ""),
            "showPoweredBy": page.get("showPoweredBy", True),
            "rssTitle": page.get("rssTitle", ""),
            "showOnlyLastHeartbeat": page.get("showOnlyLastHeartbeat", False),
            "showCertificateExpiry": page.get("showCertificateExpiry", False),
            "domainNameList": page.get("domainNameList") or [],
            "analyticsId": page.get("analyticsId") or "",
            "analyticsScriptUrl": page.get("analyticsScriptUrl") or "",
            "analyticsType": page.get("analyticsType"),
        }
        icon = page.get("icon", DEFAULT_ICON)
        public_group_list = page.get("publicGroupList") or []
        api._call("saveStatusPage", (slug, config, icon, public_group_list))


    def main() -> int:
        api = connect()
        try:
            monitors_by_name = {m["name"]: m["id"] for m in api.get_monitors()}
            existing_slugs = {p["slug"] for p in api.get_status_pages()}

            pages_dir = pathlib.Path("/pages")
            for page_file in sorted(pages_dir.glob("*.json")):
                page = json.loads(page_file.read_text())
                slug = page["slug"]
                title = page.get("title", slug)
                print(f"Reconciling status page: {slug}", flush=True)

                resolve(page, monitors_by_name)

                if slug not in existing_slugs:
                    api.add_status_page(slug, title)
                    existing_slugs.add(slug)
                    print(f"  Created: {slug}", flush=True)

                try:
                    save_page(api, slug, page)
                except UptimeKumaException as exc:
                    print(f"  FAILED:  {slug}: {exc}", file=sys.stderr, flush=True)
                    return 1
                print(f"  Updated: {slug}", flush=True)
        finally:
            api.disconnect()

        print("Reconciliation complete.", flush=True)
        return 0


    if __name__ == "__main__":
        raise SystemExit(main())
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: uptime-kuma-status-page-reconciler
  namespace: uptime-kuma
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app: uptime-kuma-status-page-reconciler
        spec:
          restartPolicy: OnFailure
          containers:
            - name: reconciler
              image: docker.io/library/python:3.14-slim@sha256:d6e0850f13fda0e2305d4c3c1c2f7930fe1042d34ddd958e49bba6ef685d0bb2
              command:
                - sh
                - -c
                - |
                  set -eu
                  pip install --quiet --no-cache-dir --root-user-action=ignore \
                    'uptime-kuma-api==1.2.1'
                  exec python /scripts/reconcile.py
              envFrom:
                - secretRef:
                    name: uptime-kuma-env
              volumeMounts:
                - mountPath: /scripts
                  name: script
                  readOnly: true
                - mountPath: /pages
                  name: pages
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: script
              configMap:
                name: uptime-kuma-status-page-reconciler
                defaultMode: 0755
            - name: pages
              projected:
                sources:
                  - configMap:
                      name: uptime-kuma-status-pages
                  - configMap:
                      name: uptime-kuma-status-pages-manafish
                      optional: true
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: uptime-kuma-status-page-reconciler
  namespace: uptime-kuma
spec:
  endpointSelector:
    matchLabels:
      app: uptime-kuma-status-page-reconciler
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            app: uptime-kuma
      toPorts:
        - ports:
            - port: "3001"
              protocol: TCP
    # pip install at runtime: PyPI + warehouse file CDN.
    - toFQDNs:
        - matchName: "pypi.org"
        - matchName: "files.pythonhosted.org"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
