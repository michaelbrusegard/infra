apiVersion: batch/v1
kind: CronJob
metadata:
  name: uptime-kuma-status-page-reconciler
  namespace: uptime-kuma
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app: uptime-kuma-status-page-reconciler
        spec:
          restartPolicy: OnFailure
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reconciler
              image: docker.io/library/python:3.15-slim@sha256:fd2aef5e0d8438208de9fe154ab5b331a2428fc0c9838d41611e611fd7a80d85
              command:
                - sh
                - -c
                - |
                  set -eu
                  pip install --quiet --no-cache-dir --root-user-action=ignore \
                    'uptime-kuma-api==1.2.1'
                  exec python /scripts/reconcile.py
              envFrom:
                - secretRef:
                    name: uptime-kuma-env
              volumeMounts:
                - mountPath: /scripts
                  name: script
                  readOnly: true
                - mountPath: /pages
                  name: pages
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                runAsNonRoot: true
                runAsUser: 10000
                runAsGroup: 10000
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: script
              configMap:
                name: uptime-kuma-status-page-reconciler
                defaultMode: 0755
            - name: pages
              projected:
                sources:
                  - configMap:
                      name: uptime-kuma-status-pages
                  - configMap:
                      name: uptime-kuma-status-pages-manafish
                      optional: true
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: uptime-kuma-status-page-reconciler
  namespace: uptime-kuma
spec:
  endpointSelector:
    matchLabels:
      app: uptime-kuma-status-page-reconciler
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            app: uptime-kuma
      toPorts:
        - ports:
            - port: "3001"
              protocol: TCP
    # pip install at runtime: PyPI + warehouse file CDN.
    - toFQDNs:
        - matchName: "pypi.org"
        - matchName: "files.pythonhosted.org"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
