apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: uptime-kuma-public
  namespace: uptime-kuma
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: https
  hostnames:
    - status.gullhaugveien.michaelbrusegard.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /status
      backendRefs:
        - name: uptime-kuma
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /api/status-page
      backendRefs:
        - name: uptime-kuma
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /assets
      backendRefs:
        - name: uptime-kuma
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /upload
      backendRefs:
        - name: uptime-kuma
          port: 80
    - matches:
        - path:
            type: Exact
            value: /icon.svg
      backendRefs:
        - name: uptime-kuma
          port: 80
    - matches:
        - path:
            type: Exact
            value: /favicon.ico
      backendRefs:
        - name: uptime-kuma
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /status/
            statusCode: 302
---
