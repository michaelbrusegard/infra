apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mealie
  namespace: mealie
spec:
  replicas: 1
  serviceName: mealie-internal
  selector:
    matchLabels:
      app: mealie
  template:
    metadata:
      labels:
        app: mealie
      annotations:
        secret.reloader.stakater.com/reload: postgres-outputs,pocket-id-outputs
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mealie
          image: ghcr.io/mealie-recipes/mealie:v3.22.0@sha256:36c28f0642fb6c75fae8997a2d55994631b9b4bcffba3016c208fc132a4c1e69
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Los_Angeles
            - name: BASE_URL
              value: https://mealie.asgard.michaelbrusegard.com
            - name: DB_ENGINE
              value: postgres
            - name: POSTGRES_SERVER
              value: postgres.postgres.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: mealie
            - name: POSTGRES_USER
              value: mealie_app
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-outputs
                  key: mealie_db_password
            - name: OIDC_AUTH_ENABLED
              value: "true"
            - name: OIDC_SIGNUP_ENABLED
              value: "true"
            - name: OIDC_CONFIGURATION_URL
              value: https://id.asgard.michaelbrusegard.com/.well-known/openid-configuration
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: pocket-id-outputs
                  key: mealie_pocketid_client_id
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pocket-id-outputs
                  key: mealie_pocketid_client_secret
            - name: OIDC_PROVIDER_NAME
              value: Pocket ID
            - name: OIDC_AUTO_REDIRECT
              value: "false"
            - name: OIDC_ADMIN_GROUP
              value: admin
          ports:
            - name: http
              containerPort: 9000
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /api/app/about
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/app/about
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/app/about
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /app/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: nvme-ha
        resources:
          requests:
            storage: 10Gi
