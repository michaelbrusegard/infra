apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stalwart-edge
  namespace: stalwart-edge
  annotations:
    configmap.reloader.stakater.com/reload: stalwart-edge-plan,stalwart-edge-reconciler,stalwart-edge-entrypoint,stalwart-edge-directory-sync
    secret.reloader.stakater.com/reload: stalwart-edge-env,wildcard-tls
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stalwart-edge
  serviceName: stalwart-edge-internal
  template:
    metadata:
      labels:
        app: stalwart-edge
    spec:
      shareProcessNamespace: true
      securityContext:
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: stalwart
          image: stalwartlabs/stalwart:v0.16.21@sha256:93c574e52249c1ebf90061da2c4c0756a7b72abfcc1fec34506a03c2e38b5977
          command:
            - /entrypoint/entrypoint.sh
          envFrom:
            - secretRef:
                name: stalwart-edge-env
          ports:
            - containerPort: 25
              name: smtp
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - curl -fsS --max-time 3 http://127.0.0.1:8080/healthz/live >/dev/null || curl -fsS --max-time 3 http://127.0.0.1:8080/ >/dev/null
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - curl -fsS --max-time 3 http://127.0.0.1:8080/healthz/live >/dev/null || curl -fsS --max-time 3 http://127.0.0.1:8080/ >/dev/null
            periodSeconds: 30
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -f /var/lib/stalwart/routing/.recipients-ready && (curl -fsS --max-time 3 http://127.0.0.1:8080/healthz/live >/dev/null || curl -fsS --max-time 3 http://127.0.0.1:8080/ >/dev/null)
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - mountPath: /var/lib/stalwart
              name: data
            - mountPath: /var/lib/stalwart/config.json
              name: config
              subPath: config.json
              readOnly: true
            - mountPath: /var/lib/stalwart/private/tls
              name: tls
              readOnly: true
            - mountPath: /entrypoint
              name: entrypoint
              readOnly: true
        - name: reconciler
          image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          command:
            - /reconciler/reconciler.sh
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          env:
            - name: STALWART_CLI_VERSION
              value: v1.0.7
            - name: PERSONAL_SYNC_URL
              value: https://stalwart-internal.stalwart.svc.cluster.local
            - name: PERSONAL_SYNC_DOMAIN
              value: michaelbrusegard.com
            - name: MANAFISH_SYNC_URL
              value: https://stalwart-internal.manafishrov-stalwart.svc.cluster.local
            - name: MANAFISH_SYNC_DOMAIN
              value: manafishrov.com
          envFrom:
            - secretRef:
                name: stalwart-edge-env
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - mountPath: /var/lib/stalwart
              name: data
            - mountPath: /plan
              name: plan
              readOnly: true
            - mountPath: /reconciler
              name: reconciler
              readOnly: true
            - mountPath: /sync
              name: directory-sync
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: stalwart-edge-config
        - name: tls
          secret:
            secretName: wildcard-tls
        - name: entrypoint
          configMap:
            name: stalwart-edge-entrypoint
            defaultMode: 0555
        - name: plan
          configMap:
            name: stalwart-edge-plan
        - name: reconciler
          configMap:
            name: stalwart-edge-reconciler
            defaultMode: 0555
        - name: directory-sync
          configMap:
            name: stalwart-edge-directory-sync
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
        storageClassName: ssd-ha
