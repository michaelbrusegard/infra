apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stalwart-edge
  namespace: stalwart-edge
  annotations:
    configmap.reloader.stakater.com/reload: stalwart-edge-config,stalwart-edge-entrypoint,stalwart-edge-policy,stalwart-edge-policy-runtime
    secret.reloader.stakater.com/reload: stalwart-edge-resend,stalwart-edge-reader,stalwart-edge-readiness,stalwart-edge-inventory,wildcard-tls
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stalwart-edge
  serviceName: stalwart-edge-internal
  template:
    metadata:
      labels:
        app: stalwart-edge
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: routing-directory
          image: docker.io/library/python:3.14-slim@sha256:810da6270e43d30a1f3e0e1eabbeb6fbd9d78ad9dd2e754d5297a3d6cb42df46
          command:
            - python3
            - -c
            - "from pathlib import Path; Path('/var/lib/stalwart/routing').mkdir(mode=0o700, exist_ok=True)"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - mountPath: /var/lib/stalwart
              name: data
      containers:
        - name: stalwart
          # Exact approved OSS artifact, despite the historical registry name.
          image: ghcr.io/michaelbrusegard/stalwart-native-scim:sha-f5918b808ac9f481f63deeeb8a9c0a526faf57a5-670b02fc450a@sha256:ee91efd83fd1c4ab51d1462e7b0188546449093e7960ead09f4917c068dbbd2d
          command:
            - /entrypoint/entrypoint.sh
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
          env:
            - name: STALWART_RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: stalwart-edge-resend
                  key: api-key
            # Parent creates temporarily, then removes after the normal restart.
            # Entrypoint unsets this even if the Secret was accidentally retained.
            - name: STALWART_RECOVERY_ADMIN
              valueFrom:
                secretKeyRef:
                  name: stalwart-edge-bootstrap
                  key: STALWART_RECOVERY_ADMIN
                  optional: true
          ports:
            - containerPort: 25
              name: smtp
            - containerPort: 443
              name: https
          startupProbe:
            exec:
              command: [/entrypoint/health.sh]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command: [/entrypoint/health.sh]
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - test -f /var/lib/stalwart/.bootstrapped && /entrypoint/health.sh
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - mountPath: /var/lib/stalwart
              name: data
            - mountPath: /var/lib/stalwart/config.json
              name: config
              subPath: config.json
              readOnly: true
            - mountPath: /var/lib/stalwart/private/tls
              name: tls
              readOnly: true
            - mountPath: /entrypoint
              name: entrypoint
              readOnly: true
            - mountPath: /tmp
              name: stalwart-temp
        - name: policy
          image: docker.io/library/python:3.14-slim@sha256:810da6270e43d30a1f3e0e1eabbeb6fbd9d78ad9dd2e754d5297a3d6cb42df46
          command: [python3, /policy/policy.py, serve]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: STALWART_EDGE_POLICY_DB
              value: /var/lib/stalwart/routing/recipients.sqlite3
            - name: STALWART_EDGE_POLICY_QUALIFIED
              valueFrom:
                configMapKeyRef:
                  name: stalwart-edge-policy-runtime
                  key: STALWART_EDGE_POLICY_QUALIFIED
            - name: STALWART_EDGE_POLICY_INVENTORY
              valueFrom:
                configMapKeyRef:
                  name: stalwart-edge-policy-runtime
                  key: STALWART_EDGE_POLICY_INVENTORY
            - name: STALWART_EDGE_POLICY_SOURCES
              valueFrom:
                configMapKeyRef:
                  name: stalwart-edge-policy-runtime
                  key: STALWART_EDGE_POLICY_SOURCES
            - name: STALWART_MANAFISH_SYNC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: stalwart-edge-reader
                  key: token
            - name: STALWART_EDGE_READINESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: stalwart-edge-readiness
                  key: token
                  # Bootstrap creates this through the recovery port-forward.
                  # Missing credentials still fail the mandatory readiness check.
                  optional: true
          # Parent-owned script checks native config AND actual SMTP behavior.
          # Never substitute a marker-only or policy-/healthz-only check.
          readinessProbe:
            exec:
              command: [python3, /policy/readiness.py]
            periodSeconds: 20
            timeoutSeconds: 15
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          volumeMounts:
            - mountPath: /var/lib/stalwart
              name: data
              readOnly: true
            - mountPath: /var/lib/stalwart/routing
              name: data
              subPath: routing
            - mountPath: /policy
              name: policy
              readOnly: true
            - mountPath: /policy-inventory
              name: policy-inventory
              readOnly: true
            - mountPath: /tmp
              name: policy-temp
      volumes:
        - name: config
          configMap:
            name: stalwart-edge-config
        - name: tls
          secret:
            secretName: wildcard-tls
        - name: entrypoint
          configMap:
            name: stalwart-edge-entrypoint
            defaultMode: 0555
        - name: policy
          configMap:
            name: stalwart-edge-policy
        - name: policy-inventory
          secret:
            secretName: stalwart-edge-inventory
        - name: stalwart-temp
          emptyDir:
            sizeLimit: 256Mi
        - name: policy-temp
          emptyDir:
            sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
        storageClassName: ssd-ha
