apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: stalwart-edge
  namespace: stalwart-edge
spec:
  # Retain the cutover barrier while old pods/services terminate, then protect
  # the archived namespace. Backup/recovery movers need only outbound access.
  endpointSelector: {}
  ingressDeny:
    - {}
