apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: stalwart-edge
  namespace: stalwart-edge
spec:
  endpointSelector:
    matchLabels:
      app: stalwart-edge
  ingress:
    - fromEntities:
        - host
        - remote-node
        - world
      toPorts:
        - ports:
            - port: "25"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: uptime-kuma
            k8s:app: uptime-kuma
      toPorts:
        - ports:
            - port: "25"
              protocol: TCP
    # Management remains reachable for configuration repair while SMTP is not
    # ready. Neither LAN/world nor other application namespaces may use 443.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: flux-system
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: manafishrov-stalwart
            k8s:app: stalwart
      toPorts:
        - ports:
            - port: "24"
              protocol: TCP
            - port: "443"
              protocol: TCP
    # Also cover the private backend DNS target when outside this cluster.
    - toFQDNs:
        - matchName: backend.manafishrov.com
      toPorts:
        - ports:
            - port: "24"
              protocol: TCP
            - port: "443"
              protocol: TCP
    - toFQDNs:
        - matchName: smtp.resend.com
      toPorts:
        - ports:
            - port: "465"
              protocol: TCP
    # Sender authentication and default DNSBL checks use cluster DNS above.
    # No world:25, remote asset downloads, or blanket world:80/443 allowance.
