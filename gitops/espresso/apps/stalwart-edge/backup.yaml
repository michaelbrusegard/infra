apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: stalwart-edge-data-backup
  namespace: stalwart-edge
spec:
  # Retired queue archive. Preserve existing snapshots without scheduled pruning.
  # Quiesced snapshots: manual 7c590f8e, final scheduled a3ae254e (2026-09-18).
  paused: true
  sourcePVC: data-stalwart-edge-0
  trigger:
    schedule: "40 */6 * * *"
  restic:
    repository: freddo-restic-stalwart-edge-pvc
    pruneIntervalDays: 30
    retain:
      daily: 14
      weekly: 8
      monthly: 12
    moverSecurityContext:
      runAsUser: 2000
      runAsGroup: 2000
    copyMethod: Snapshot
    volumeSnapshotClassName: mayastor-snapshot
    cacheStorageClassName: openebs-single-replica
    cacheCapacity: 2Gi
