apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: stalwart-edge-data-backup
  namespace: stalwart-edge
spec:
  # Separate repository under the shared mail infrastructure's Freddo identity.
  # The retired server's /stalwart/pvc repository is left untouched.
  paused: false
  sourcePVC: data-stalwart-edge-0
  trigger:
    schedule: "40 */6 * * *"
    manual: edge-cutover-20260917
  restic:
    repository: freddo-restic-stalwart-edge-pvc
    pruneIntervalDays: 30
    retain:
      daily: 14
      weekly: 8
      monthly: 12
    moverSecurityContext:
      runAsUser: 2000
      runAsGroup: 2000
    copyMethod: Snapshot
    volumeSnapshotClassName: mayastor-snapshot
    cacheStorageClassName: openebs-single-replica
    cacheCapacity: 2Gi
