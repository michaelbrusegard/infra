apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  # Add backup.yaml after the Freddo repository and pause behavior are verified.
  - statefulset.yaml
  - services.yaml
  - network-policy.yaml
  - config.yaml
  - entrypoint.yaml
# Bootstrap/readiness are parent-owned. Do not re-add the legacy plan,
# downloaded-CLI reconciler, or SQL Directory synchronizer.
configMapGenerator:
  - name: stalwart-edge-policy
    namespace: stalwart-edge
    files:
      - policy.py
      - policy.sql
      - readiness.py
    options:
      disableNameSuffixHash: true
