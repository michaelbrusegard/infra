apiVersion: v1
kind: ConfigMap
metadata:
  name: stalwart-edge-config
  namespace: stalwart-edge
data:
  config.json: |
    {"@type":"RocksDb","path":"/var/lib/stalwart/data/"}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: stalwart-edge-policy-runtime
  namespace: stalwart-edge
data:
  # Approved binary: 02030a8334e3bc62bae1fa4a9139f498df0a7e105bd97ec5beacfdfa1be8b614.
  # Native core, queue/restart, limiter and backend-abuse stages passed.
  # This enables staging acceptance, not authorization to change WAN routing.
  STALWART_EDGE_POLICY_QUALIFIED: "1"
  STALWART_EDGE_POLICY_INVENTORY: /policy-inventory/inventory.json
  STALWART_EDGE_POLICY_SOURCES: |
    [{"name":"manafishrov","url":"https://backend.manafishrov.com","token_env":"STALWART_MANAFISH_SYNC_TOKEN","domains":["manafishrov.com"],"lmtp_host":"backend.manafishrov.com","lmtp_port":24,"lmtp_servername":"backend.manafishrov.com","probe_sender":"policy-probe@system.edge.asgard.michaelbrusegard.com"}]
