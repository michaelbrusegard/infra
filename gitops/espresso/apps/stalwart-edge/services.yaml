apiVersion: v1
kind: Service
metadata:
  name: stalwart-edge-internal
  namespace: stalwart-edge
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: stalwart-edge
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: v1
kind: Service
metadata:
  name: stalwart-edge
  namespace: stalwart-edge
  annotations:
    # Staging only. Transfer .12/::12 in the separately approved cutover.
    lbipam.cilium.io/ips: 10.0.188.13,fd7a:115c:a1e0:188::13
    lbipam.cilium.io/sharing-key: stalwart-edge
spec:
  type: LoadBalancer
  ipFamilyPolicy: PreferDualStack
  ipFamilies:
    - IPv4
    - IPv6
  externalTrafficPolicy: Local
  # Never publish SMTP before both containers' readiness probes pass.
  publishNotReadyAddresses: false
  selector:
    app: stalwart-edge
  ports:
    - name: smtp
      port: 25
      targetPort: smtp
---
apiVersion: v1
kind: Service
metadata:
  name: stalwart-edge-management
  namespace: stalwart-edge
  annotations:
    lbipam.cilium.io/ips: 10.0.188.13,fd7a:115c:a1e0:188::13
    lbipam.cilium.io/sharing-key: stalwart-edge
    # Consumed by internal k8s-gateway. external-dns uses only CRD sources.
    external-dns.alpha.kubernetes.io/hostname: edge.asgard.michaelbrusegard.com
spec:
  type: LoadBalancer
  ipFamilyPolicy: PreferDualStack
  ipFamilies:
    - IPv4
    - IPv6
  # Cilium IP sharing requires the same traffic policy and (for Local) selector.
  externalTrafficPolicy: Local
  # Configuration repair must remain reachable while SMTP is unready.
  # The CNP, not readiness, restricts this port to flux-system runners.
  publishNotReadyAddresses: true
  selector:
    app: stalwart-edge
  ports:
    - name: https
      port: 443
      targetPort: https
