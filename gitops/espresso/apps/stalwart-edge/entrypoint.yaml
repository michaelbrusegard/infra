apiVersion: v1
kind: ConfigMap
metadata:
  name: stalwart-edge-entrypoint
  namespace: stalwart-edge
data:
  entrypoint.sh: |
    #!/bin/sh
    set -eu
    MARKER=/var/lib/stalwart/.bootstrapped
    if [ -f "$MARKER" ]; then
      # A leftover optional bootstrap Secret must never enable normal recovery.
      unset STALWART_RECOVERY_ADMIN STALWART_RECOVERY_MODE STALWART_RECOVERY_MODE_PORT STALWART_RECOVERY_MODE_LOG_LEVEL
      echo "stalwart-edge: normal mode"
    else
      # Bootstrap is explicit, never an automatic fallback from corrupt state.
      : "${STALWART_RECOVERY_ADMIN:?bootstrap Secret required before initial setup}"
      export STALWART_RECOVERY_MODE=true
      export STALWART_RECOVERY_MODE_PORT=8080
      echo "stalwart-edge: initial recovery mode; port-forward access only"
    fi
    exec /usr/local/bin/stalwart --config /var/lib/stalwart/config.json
  health.sh: |
    #!/bin/sh
    set -eu
    if [ ! -f /var/lib/stalwart/.bootstrapped ]; then
      test -n "${STALWART_RECOVERY_ADMIN:-}"
      # This port has no Service or CNP ingress allowance.
      exec curl -fsS --max-time 3 http://127.0.0.1:8080/healthz/live
    fi
    # Retain hostname verification/SNI while connecting only over loopback.
    exec curl -fsS --proto '=https' --max-time 3 \
      --resolve edge.asgard.michaelbrusegard.com:443:127.0.0.1 \
      https://edge.asgard.michaelbrusegard.com/healthz/live
