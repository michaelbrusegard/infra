apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: healthlog
  namespace: healthlog
spec:
  parentRefs:
    - name: internal
      namespace: gateway
      sectionName: https
  hostnames:
    - health.asgard.michaelbrusegard.com
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/import/apple-health-export
        - path:
            type: Exact
            value: /api/admin/import-apple-health-export
      timeouts:
        request: 30m
        backendRequest: 30m
      backendRefs:
        - name: healthlog
          port: 3000
    - backendRefs:
        - name: healthlog
          port: 3000
