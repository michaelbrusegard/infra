apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: hermes-agent-data-backup
  namespace: hermes-agent
spec:
  sourcePVC: data-hermes-agent-0
  trigger:
    schedule: "30 2 * * *"
  restic:
    repository: freddo-restic-hermes-agent-pvc
    retain:
      within: 100y
    moverSecurityContext:
      runAsUser: 10000
      runAsGroup: 10000
    copyMethod: Snapshot
    volumeSnapshotClassName: mayastor-snapshot
    cacheStorageClassName: openebs-hostpath
    cacheCapacity: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: honcho-backup
  namespace: hermes-agent
spec:
  schedule: "5 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app: honcho-backup
        spec:
          restartPolicy: Never
          initContainers:
            - name: dump-postgres
              image: ghcr.io/michaelbrusegard/postgres:sha-d5a65c76cfe6e2f02522d94347067f4408da9a2c@sha256:df8cc436376b921838549a1f35d9bd35a867ff87478f142fb37e7acc7b7c4ac1
              command:
                - sh
                - -c
                - |
                  set -eu
                  ts="$(date -u +%Y%m%dT%H%M%SZ)"
                  pg_dump \
                    --format=custom \
                    --compress=9 \
                    --clean \
                    --if-exists \
                    --no-owner \
                    --no-acl \
                    --dbname=honcho \
                    --file="/backup/honcho-${ts}.dump"
              env:
                - name: PGHOST
                  value: postgres.postgres.svc.cluster.local
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  value: honcho_app
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: honcho-db
                      key: HONCHO_DB_PASSWORD
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              volumeMounts:
                - name: backup
                  mountPath: /backup
          containers:
            - name: restic-postgres
              image: docker.io/restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              command:
                - sh
                - -c
                - |
                  set -eu
                  restic backup \
                    --host espresso-postgres \
                    --tag espresso \
                    --tag honcho \
                    --tag postgres \
                    /backup
              env:
                - name: RESTIC_CACHE_DIR
                  value: /cache
              envFrom:
                - secretRef:
                    name: freddo-restic-honcho-postgres
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              volumeMounts:
                - name: backup
                  mountPath: /backup
                  readOnly: true
                - name: cache
                  mountPath: /cache
          volumes:
            - name: backup
              emptyDir: {}
            - name: cache
              emptyDir: {}
