apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes-agent
  namespace: hermes-agent
spec:
  replicas: 1
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  selector:
    matchLabels:
      app: hermes-agent
  serviceName: hermes-agent-internal
  template:
    metadata:
      annotations:
        configmap.reloader.stakater.com/reload: hermes-agent-bootstrap,hermes-agent-skills
        hermes.michaelbrusegard.com/android-image-rollout: "ready"
        secret.reloader.stakater.com/reload: cliproxyapi,hermes-agent-env,hermes-alert-webhook,hermes-media-client,hermes-viewer-auth,hindsight,mattermost-integrations,mattermost-outputs,mealie-api
      labels:
        app: hermes-agent
    spec:
      serviceAccountName: hermes-agent
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 75
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # The operator prepends its restartable NetBird init sidecar. Wait for
        # its policy route, then preserve cluster-local and NetBird control
        # traffic before removing the direct defaults. Without the tunnel,
        # application traffic therefore has no fallback path to the internet.
        - name: preserve-cluster-routes
          image: netbirdio/netbird:0.77.1@sha256:66f408b0c423e9c3376deea7bc0da78024d32494dd0f957344993015b74c4451
          command:
            - sh
            - -ec
            - |
              until ip rule show | grep -q "lookup 7120"; do
                sleep 0.2
              done
              gateway4="$(ip route show default | head -n1 | cut -d' ' -f3)"
              gateway6="$(ip -6 route show default | head -n1 | cut -d' ' -f3)"
              test -n "$gateway4"
              test -n "$gateway6"
              ip route replace 10.0.188.0/24 via "$gateway4" dev eth0
              ip route replace 10.42.0.0/16 via "$gateway4" dev eth0
              ip route replace 10.43.0.0/16 via "$gateway4" dev eth0
              ip -6 route replace fd42::/56 via "$gateway6" dev eth0
              ip -6 route replace fd43::/112 via "$gateway6" dev eth0
              ip route del default
              ip -6 route del default
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
            runAsNonRoot: false
            runAsUser: 0
          resources:
            requests:
              memory: 8Mi
              cpu: 5m
            limits:
              memory: 16Mi
              cpu: 25m
        - name: bootstrap-config
          image: busybox:1.38.0@sha256:1cfa4e2b09e127b9c4ed43578d3f3c18e7d44ea47b9ea98475c0cbe9086525f8
          command:
            - sh
            - -c
            - |
              mkdir -p /opt/data/workspace /opt/data/scripts /opt/data/plugins/response-polish
              mkdir -p /opt/browser-files
              mkdir -p /opt/data/hindsight /opt/data/skills/android-automation /opt/data/skills/mealie /opt/data/skills/media /opt/data/skills/browser-navigation /opt/data/skills/browser-support /opt/data/skills/cluster-access /opt/data/skills/healthlog
              mkdir -p /opt/data/skills/data-science/jupyter-live-kernel
              for file in /bootstrap-config/*; do
                [ -f "$file" ] || continue
                [ "$(basename "$file")" = hindsight.json ] && continue
                install -m 0644 "$file" "/opt/data/$(basename "$file")"
              done
              install -m 0644 /bootstrap-config/hindsight.json /opt/data/hindsight/config.json
              install -m 0755 /bootstrap-skills/android /opt/data/scripts/android
              install -m 0755 /bootstrap-skills/android-companion /opt/data/scripts/android-companion
              install -m 0644 /bootstrap-skills/android-companion.py /opt/data/scripts/android-companion.py
              install -m 0644 /bootstrap-skills/android.py /opt/data/scripts/android.py
              install -m 0644 /bootstrap-skills/android-automation-skill.md /opt/data/skills/android-automation/SKILL.md
              install -m 0755 /bootstrap-skills/browser-support /opt/data/scripts/browser-support
              install -m 0644 /bootstrap-skills/browser-support.py /opt/data/scripts/browser-support.py
              install -m 0644 /bootstrap-skills/browser-navigation-skill.md /opt/data/skills/browser-navigation/SKILL.md
              install -m 0644 /bootstrap-skills/browser-support-skill.md /opt/data/skills/browser-support/SKILL.md
              install -m 0644 /bootstrap-skills/cluster-access-skill.md /opt/data/skills/cluster-access/SKILL.md
              install -m 0755 /bootstrap-skills/daily-digest.py /opt/data/scripts/daily-digest.py
              install -m 0755 /bootstrap-skills/healthlog /opt/data/scripts/healthlog
              install -m 0644 /bootstrap-skills/healthlog.py /opt/data/scripts/healthlog.py
              install -m 0644 /bootstrap-skills/healthlog-skill.md /opt/data/skills/healthlog/SKILL.md
              install -m 0755 /bootstrap-skills/mealie /opt/data/scripts/mealie
              install -m 0644 /bootstrap-skills/mealie.py /opt/data/scripts/mealie.py
              install -m 0644 /bootstrap-skills/mealie-skill.md /opt/data/skills/mealie/SKILL.md
              install -m 0755 /bootstrap-skills/media /opt/data/scripts/media
              install -m 0644 /bootstrap-skills/media.py /opt/data/scripts/media.py
              install -m 0644 /bootstrap-skills/media-skill.md /opt/data/skills/media/SKILL.md
              install -m 0644 /bootstrap-skills/response-polish-init.py /opt/data/plugins/response-polish/__init__.py
              install -m 0644 /bootstrap-skills/response-polish-plugin.yaml /opt/data/plugins/response-polish/plugin.yaml
              install -m 0644 /bootstrap-skills/jupyter-live-kernel-skill.md /opt/data/skills/data-science/jupyter-live-kernel/SKILL.md
              if [ -f /opt/data/skills/espresso-cluster/SKILL.md ]; then
                mv /opt/data/skills/espresso-cluster/SKILL.md /opt/data/skills/espresso-cluster/SKILL.md.pvc-backup
              fi
              sed -i "s/__MATTERMOST_ALERTS_CHANNEL_ID__/$MATTERMOST_ALERTS_CHANNEL_ID/g" /opt/data/config.yaml
              sed -i "s/__MATTERMOST_HOME_CHANNEL_ID__/$MATTERMOST_HOME_CHANNEL_ID/g" /opt/data/config.yaml
              sed -i "s/__MATTERMOST_CODE_CHANNEL_ID__/$MATTERMOST_CODE_CHANNEL_ID/g" /opt/data/config.yaml
              sed -i "s/__MATTERMOST_SCRATCHPAD_CHANNEL_ID__/$MATTERMOST_SCRATCHPAD_CHANNEL_ID/g" /opt/data/config.yaml
              install -m 0640 /bootstrap-secret/.env /opt/data/.env
              chown -R 10000:10000 /opt/data
              chown 10000:10000 /opt/browser-files
          env:
            - name: MATTERMOST_ALERTS_CHANNEL_ID
              valueFrom:
                secretKeyRef:
                  name: mattermost-outputs
                  key: hermes_alerts_channel_id
            - name: MATTERMOST_HOME_CHANNEL_ID
              valueFrom:
                secretKeyRef:
                  name: mattermost-outputs
                  key: hermes_home_channel_id
            - name: MATTERMOST_CODE_CHANNEL_ID
              valueFrom:
                secretKeyRef:
                  name: mattermost-outputs
                  key: hermes_code_channel_id
            - name: MATTERMOST_SCRATCHPAD_CHANNEL_ID
              valueFrom:
                secretKeyRef:
                  name: mattermost-outputs
                  key: hermes_stateless_channel_ids
          resources:
            requests:
              memory: 16Mi
              cpu: 25m
            limits:
              memory: 32Mi
              cpu: 50m
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: browser-files
              mountPath: /opt/browser-files
            - name: bootstrap-config
              mountPath: /bootstrap-config
            - name: bootstrap-secret
              mountPath: /bootstrap-secret
            - name: bootstrap-skills
              mountPath: /bootstrap-skills
        - name: prepare-android
          image: ghcr.io/michaelbrusegard/hermes-android:sha-5939edd5716d23f3ec6a6fcf1f7447bddab3c21a@sha256:239f80c0b68121dbc756f220e86822e78572c83fac20b24668dad669445c86a3
          command:
            - bash
            - -euc
            - |
              mkdir -p /opt/android/adb /opt/android/android-home /opt/android/apks /opt/android/companion
              if [ -s /opt/hermes/apks/AuroraStore-4.8.4.apk ] && [ ! -s /opt/android/apks/AuroraStore-4.8.4.apk ]; then
                install -m 0644 /opt/hermes/apks/AuroraStore-4.8.4.apk /opt/android/apks/AuroraStore-4.8.4.apk
              fi
              if [ -s /opt/hermes/apks/HermesAccessibility-1.0.0.apk ] && [ ! -s /opt/android/apks/HermesAccessibility-1.0.0.apk ]; then
                install -m 0644 /opt/hermes/apks/HermesAccessibility-1.0.0.apk /opt/android/apks/HermesAccessibility-1.0.0.apk
              fi
              if [ ! -s /opt/android/adb/adbkey ] || [ ! -s /opt/android/adb/adbkey.pub ]; then
                HOME=/tmp /android/sdk/platform-tools/adb keygen /opt/android/adb/adbkey
              fi
              if [ ! -s /opt/android/companion/auth-token ]; then
                od -An -tx1 -N 32 /dev/urandom | tr -d ' \n' >/opt/android/companion/auth-token
              fi
              chown 10000:0 /opt/android/adb/adbkey /opt/android/adb/adbkey.pub
              chown 10000:0 /opt/android/companion/auth-token
              chmod 640 /opt/android/adb/adbkey
              chmod 644 /opt/android/adb/adbkey.pub
              chmod 640 /opt/android/companion/auth-token
          resources:
            requests:
              memory: 32Mi
              cpu: 25m
            limits:
              memory: 128Mi
              cpu: 100m
          volumeMounts:
            - name: android-data
              mountPath: /opt/android
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
      containers:
        - name: gateway
          image: ghcr.io/michaelbrusegard/hermes-agent:sha-5939edd5716d23f3ec6a6fcf1f7447bddab3c21a@sha256:8ae67c2d06dab1f77f3101489c79cd477350a1b2a7464f217d381450af79a5ad
          args:
            - gateway
            - run
          ports:
            - containerPort: 8642
              name: gateway
            - containerPort: 8644
              name: webhook
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: HOME
              value: /opt/data
            - name: TZ
              value: America/Los_Angeles
            - name: LANG
              value: en_US.UTF-8
            - name: OPENAI_BASE_URL
              value: http://cliproxyapi.cliproxyapi.svc.cluster.local:8317/v1
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cliproxyapi
                  key: API_KEY
            - name: HINDSIGHT_API_URL
              value: http://hindsight.hindsight.svc.cluster.local:8888
            - name: HINDSIGHT_MODE
              value: local_external
            - name: HINDSIGHT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hindsight
                  key: API_KEY
            - name: MATTERMOST_URL
              value: http://mattermost.mattermost.svc.cluster.local:8065
            - name: MATTERMOST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mattermost-integrations
                  key: HERMES_BOT_TOKEN
            - name: MATTERMOST_ALLOWED_USERS
              valueFrom:
                secretKeyRef:
                  name: mattermost-integrations
                  key: HERMES_ALLOWED_USERS
            - name: MATTERMOST_HOME_CHANNEL
              valueFrom:
                secretKeyRef:
                  name: mattermost-outputs
                  key: hermes_home_channel_id
                  optional: true
            - name: MATTERMOST_ALLOWED_CHANNELS
              valueFrom:
                secretKeyRef:
                  name: mattermost-outputs
                  key: hermes_allowed_channel_ids
                  optional: true
            - name: MATTERMOST_FREE_RESPONSE_CHANNELS
              valueFrom:
                secretKeyRef:
                  name: mattermost-outputs
                  key: hermes_free_response_channel_ids
                  optional: true
            - name: MATTERMOST_STATELESS_CHANNELS
              valueFrom:
                secretKeyRef:
                  name: mattermost-outputs
                  key: hermes_stateless_channel_ids
                  optional: true
            - name: MATTERMOST_REPLY_MODE
              value: thread
            - name: MEALIE_URL
              value: http://mealie.mealie.svc.cluster.local:9000
            - name: MEALIE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mealie-api
                  key: API_TOKEN
            - name: HEALTHLOG_MCP_URL
              value: http://healthlog.healthlog.svc.cluster.local:3000/mcp
            - name: HEALTHLOG_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-env
                  key: HEALTHLOG_MCP_TOKEN
            - name: MEDIA_API_URL
              value: http://hermes-media-api.media.svc.cluster.local:8080
            - name: MEDIA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-media-client
                  key: MEDIA_API_TOKEN
            - name: SEARXNG_URL
              value: http://searxng.searxng.svc.cluster.local:8080
            - name: BROWSER_CDP_URL
              value: http://127.0.0.1:9222
            - name: BROWSER_VIEW_URL
              value: https://browser.asgard.michaelbrusegard.com/vnc.html?autoconnect=true&resize=scale&view_only=false&reconnect=true
            - name: HERMES_ALLOW_PRIVATE_URLS
              value: "true"
            - name: BROWSER_SHARED_PROFILE_SESSIONS
              value: "true"
            - name: BROWSER_FILES_ROOT
              value: /opt/browser-files
            - name: BROWSER_PROFILE_ROOT
              value: /opt/browser
            - name: BROWSER_POLICY_ROOT
              value: /etc/chromium/policies/managed
            - name: ADB_VENDOR_KEYS
              value: /opt/android/adb
            - name: ANDROID_ADB_ENDPOINT
              value: 127.0.0.1:5555
            - name: ANDROID_SERIAL
              value: 127.0.0.1:5555
            - name: ANDROID_EMULATOR_GRPC_URL
              value: http://127.0.0.1:8554
            - name: ANDROID_EMULATOR_GRPC_TOKEN_FILE
              value: /opt/android/companion/emulator-grpc-token
            - name: ANDROID_VIEW_URL
              value: https://android.asgard.michaelbrusegard.com/vnc.html?autoconnect=true&resize=scale&view_only=false&reconnect=true
            - name: ANDROID_COMPANION_URL
              value: http://127.0.0.1:8777
            - name: ANDROID_COMPANION_TOKEN_FILE
              value: /opt/android/companion/auth-token
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: 0.0.0.0
            - name: API_SERVER_PORT
              value: "8642"
            - name: WEBHOOK_ENABLED
              value: "true"
            - name: WEBHOOK_PORT
              value: "8644"
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: hermes-alert-webhook
                  key: WEBHOOK_SECRET
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: "1"
          startupProbe:
            httpGet:
              path: /health
              port: gateway
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /health
              port: gateway
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: gateway
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: browser-files
              mountPath: /opt/browser-files
            - name: browser-profile
              mountPath: /opt/browser
              readOnly: true
            - name: browser-policies
              mountPath: /etc/chromium/policies/managed
              readOnly: true
            - name: android-data
              mountPath: /opt/android
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: browser
          image: ghcr.io/michaelbrusegard/hermes-browser:sha-5939edd5716d23f3ec6a6fcf1f7447bddab3c21a@sha256:9dc33dda0606ae13a806abb30d0b84a0796af7f97c9e6b0f27bdf3a71b4894f2
          command:
            - chromium
          args:
            - --ozone-platform=x11
            - --window-size=1440,900
            - --force-device-scale-factor=1
            - --lang=en-US
            - --use-gl=angle
            - --use-angle=swiftshader-webgl
            - --enable-unsafe-swiftshader
            - --disable-component-update
            - --no-first-run
            - --no-default-browser-check
            - --remote-debugging-port=9222
            - --user-data-dir=/opt/browser/profile
            - about:blank
          env:
            - name: HOME
              value: /opt/browser
            - name: TZ
              value: America/Los_Angeles
            - name: LANG
              value: en_US.UTF-8
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 3Gi
              cpu: "2"
          startupProbe:
            exec:
              command:
                - curl
                - --fail
                - --silent
                - http://127.0.0.1:9222/json/version
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            exec:
              command:
                - curl
                - --fail
                - --silent
                - http://127.0.0.1:9222/json/version
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - curl
                - --fail
                - --silent
                - http://127.0.0.1:9222/json/version
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: browser-profile
              mountPath: /opt/browser
            - name: browser-policies
              mountPath: /etc/chromium/policies/managed
            - name: browser-files
              mountPath: /opt/browser-files
            - name: browser-tmp
              mountPath: /tmp
            - name: browser-shm
              mountPath: /dev/shm
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: Localhost
              localhostProfile: hermes/chromium.json
            capabilities:
              drop:
                - ALL
        - name: android-emulator
          image: ghcr.io/michaelbrusegard/hermes-android:sha-5939edd5716d23f3ec6a6fcf1f7447bddab3c21a@sha256:239f80c0b68121dbc756f220e86822e78572c83fac20b24668dad669445c86a3
          command:
            - bash
            - /bootstrap-skills/android-emulator-launch.sh
          env:
            - name: ADB_VENDOR_KEYS
              value: /data/adb
            - name: ANDROID_REQUIRED_RELEASE
              value: "17"
            - name: ANDROID_REQUIRED_SDK
              value: "37"
            - name: AVD_CONFIG
              value: |
                disk.dataPartition.size=8192M
                hw.keyboard=yes
            - name: EMULATOR_PARAMS
              value: -gpu swiftshader_indirect -timezone America/Los_Angeles -prop persist.sys.locale=en-US
          ports:
            - containerPort: 5555
              name: android-adb
          resources:
            requests:
              memory: 4Gi
              cpu: "2"
              hermes.michaelbrusegard.com/kvm: "1"
            limits:
              memory: 8Gi
              cpu: "4"
              hermes.michaelbrusegard.com/kvm: "1"
          startupProbe:
            exec:
              command:
                - bash
                - -ec
                - |
                  export ADB_VENDOR_KEYS=/data/adb
                  if grep -q '"state":"disabled"' /data/status/launcher.json 2>/dev/null; then
                    exit 0
                  fi
                  /android/sdk/platform-tools/adb connect 127.0.0.1:5555 >/dev/null 2>&1 || true
                  [ "$(/android/sdk/platform-tools/adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command:
                - bash
                - -ec
                - |
                  export ADB_VENDOR_KEYS=/data/adb
                  if grep -q '"state":"disabled"' /data/status/launcher.json 2>/dev/null; then
                    exit 0
                  fi
                  /android/sdk/platform-tools/adb connect 127.0.0.1:5555 >/dev/null 2>&1 || true
                  [ "$(/android/sdk/platform-tools/adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - bash
                - -ec
                - |
                  export ADB_VENDOR_KEYS=/data/adb
                  if grep -q '"state":"disabled"' /data/status/launcher.json 2>/dev/null; then
                    exit 0
                  fi
                  /android/sdk/platform-tools/adb connect 127.0.0.1:5555 >/dev/null 2>&1 || true
                  [ "$(/android/sdk/platform-tools/adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]
                  grep -q '"state":"ready"' /data/status/accessibility.json
            periodSeconds: 15
            timeoutSeconds: 10
          volumeMounts:
            - name: bootstrap-skills
              mountPath: /bootstrap-skills
            - name: android-data
              mountPath: /data
            - name: android-tmp
              mountPath: /tmp
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
        - name: android-companion
          image: ghcr.io/michaelbrusegard/hermes-agent:sha-5939edd5716d23f3ec6a6fcf1f7447bddab3c21a@sha256:8ae67c2d06dab1f77f3101489c79cd477350a1b2a7464f217d381450af79a5ad
          command:
            - /opt/data/scripts/android-companion
          env:
            - name: ADB_VENDOR_KEYS
              value: /opt/android/adb
            - name: ANDROID_SERIAL
              value: 127.0.0.1:5555
            - name: ANDROID_EMULATOR_GRPC_URL
              value: http://127.0.0.1:8554
            - name: ANDROID_EMULATOR_GRPC_TOKEN_FILE
              value: /opt/android/companion/emulator-grpc-token
            - name: ANDROID_COMPANION_LISTEN
              value: 0.0.0.0:8777
            - name: ANDROID_COMPANION_TOKEN_FILE
              value: /opt/android/companion/auth-token
            - name: BROWSER_FILES_ROOT
              value: /opt/browser-files
            - name: HOME
              value: /tmp/home
          ports:
            - containerPort: 8777
              name: android-api
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 512Mi
              cpu: 500m
          startupProbe:
            httpGet:
              path: /healthz
              port: android-api
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: android-api
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: android-api
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: bootstrap-skills
              mountPath: /bootstrap-skills
            - name: data
              mountPath: /opt/data
              readOnly: true
            - name: android-data
              mountPath: /opt/android
              readOnly: true
            - name: browser-files
              mountPath: /opt/browser-files
            - name: android-companion-tmp
