apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes-agent
  namespace: hermes-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes-agent
  serviceName: hermes-agent-internal
  template:
    metadata:
      annotations:
        configmap.reloader.stakater.com/reload: hermes-agent-bootstrap,hermes-agent-skills
        secret.reloader.stakater.com/reload: cliproxyapi,hermes-agent-env,hermes-alert-webhook,hindsight,mattermost-integrations,mattermost-outputs,mealie-api
      labels:
        app: hermes-agent
    spec:
      serviceAccountName: hermes-agent
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: bootstrap-config
          image: busybox:1.38.0@sha256:1cfa4e2b09e127b9c4ed43578d3f3c18e7d44ea47b9ea98475c0cbe9086525f8
          command:
            - sh
            - -c
            - |
              mkdir -p /opt/data/workspace
              mkdir -p /opt/data/hindsight /opt/data/skills/mealie /opt/data/skills/cluster-access
              mkdir -p /opt/data/skills/data-science/jupyter-live-kernel
              for file in /bootstrap-config/*; do
                [ -f "$file" ] || continue
                [ "$(basename "$file")" = hindsight.json ] && continue
                [ "$(basename "$file")" = mealie-skill.md ] && continue
                install -m 0644 "$file" "/opt/data/$(basename "$file")"
              done
              install -m 0644 /bootstrap-config/hindsight.json /opt/data/hindsight/config.json
              install -m 0644 /bootstrap-config/mealie-skill.md /opt/data/skills/mealie/SKILL.md
              install -m 0644 /bootstrap-skills/cluster-access-skill.md /opt/data/skills/cluster-access/SKILL.md
              install -m 0644 /bootstrap-skills/jupyter-live-kernel-skill.md /opt/data/skills/data-science/jupyter-live-kernel/SKILL.md
              if [ -f /opt/data/skills/espresso-cluster/SKILL.md ]; then
                mv /opt/data/skills/espresso-cluster/SKILL.md /opt/data/skills/espresso-cluster/SKILL.md.pvc-backup
              fi
              sed -i "s/__MATTERMOST_ALERTS_CHANNEL_ID__/$MATTERMOST_ALERTS_CHANNEL_ID/g" /opt/data/config.yaml
              sed -i "s/__MATTERMOST_HOME_CHANNEL_ID__/$MATTERMOST_HOME_CHANNEL_ID/g" /opt/data/config.yaml
              sed -i "s/__MATTERMOST_CODE_CHANNEL_ID__/$MATTERMOST_CODE_CHANNEL_ID/g" /opt/data/config.yaml
              sed -i "s/__MATTERMOST_SCRATCHPAD_CHANNEL_ID__/$MATTERMOST_SCRATCHPAD_CHANNEL_ID/g" /opt/data/config.yaml
              install -m 0640 /bootstrap-secret/.env /opt/data/.env
              chown -R 10000:10000 /opt/data
          env:
            - name: MATTERMOST_ALERTS_CHANNEL_ID
              valueFrom:
                secretKeyRef:
                  name: mattermost-outputs
                  key: hermes_alerts_channel_id
            - name: MATTERMOST_HOME_CHANNEL_ID
              valueFrom:
                secretKeyRef:
                  name: mattermost-outputs
                  key: hermes_home_channel_id
            - name: MATTERMOST_CODE_CHANNEL_ID
              valueFrom:
                secretKeyRef:
                  name: mattermost-outputs
                  key: hermes_code_channel_id
            - name: MATTERMOST_SCRATCHPAD_CHANNEL_ID
              valueFrom:
                secretKeyRef:
                  name: mattermost-outputs
                  key: hermes_stateless_channel_ids
          resources:
            requests:
              memory: 16Mi
              cpu: 25m
            limits:
              memory: 32Mi
              cpu: 50m
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: bootstrap-config
              mountPath: /bootstrap-config
            - name: bootstrap-secret
              mountPath: /bootstrap-secret
            - name: bootstrap-skills
              mountPath: /bootstrap-skills
      containers:
        - name: gateway
          image: ghcr.io/michaelbrusegard/hermes-agent:sha-0ff1e62d7f3033bff6c8792c7f26aeadffd23822@sha256:066edbd97b79cf4b3fa9eb7a46bb6827c2afabc719c2f4a8eb8da65da9a566d4
          args:
            - gateway
            - run
          ports:
            - containerPort: 8642
              name: gateway
            - containerPort: 8644
              name: webhook
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: HOME
              value: /opt/data
            - name: OPENAI_BASE_URL
              value: http://cliproxyapi.cliproxyapi.svc.cluster.local:8317/v1
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cliproxyapi
                  key: API_KEY
            - name: HINDSIGHT_API_URL
              value: http://hindsight.hindsight.svc.cluster.local:8888
            - name: HINDSIGHT_MODE
              value: local_external
            - name: HINDSIGHT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hindsight
                  key: API_KEY
            - name: MATTERMOST_URL
              value: http://mattermost.mattermost.svc.cluster.local:8065
            - name: MATTERMOST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mattermost-integrations
                  key: HERMES_BOT_TOKEN
            - name: MATTERMOST_ALLOWED_USERS
              valueFrom:
                secretKeyRef:
                  name: mattermost-integrations
                  key: HERMES_ALLOWED_USERS
            - name: MATTERMOST_HOME_CHANNEL
              valueFrom:
                secretKeyRef:
                  name: mattermost-outputs
                  key: hermes_home_channel_id
                  optional: true
            - name: MATTERMOST_ALLOWED_CHANNELS
              valueFrom:
                secretKeyRef:
                  name: mattermost-outputs
                  key: hermes_allowed_channel_ids
                  optional: true
            - name: MATTERMOST_FREE_RESPONSE_CHANNELS
              valueFrom:
                secretKeyRef:
                  name: mattermost-outputs
                  key: hermes_free_response_channel_ids
                  optional: true
            - name: MATTERMOST_STATELESS_CHANNELS
              valueFrom:
                secretKeyRef:
                  name: mattermost-outputs
                  key: hermes_stateless_channel_ids
                  optional: true
            - name: MATTERMOST_REPLY_MODE
              value: thread
            - name: MEALIE_URL
              value: http://mealie.mealie.svc.cluster.local:9000
            - name: MEALIE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mealie-api
                  key: API_TOKEN
            - name: SEARXNG_URL
              value: http://searxng.searxng.svc.cluster.local:8080
            - name: BROWSER_CDP_URL
              value: http://127.0.0.1:9222
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: 0.0.0.0
            - name: API_SERVER_PORT
              value: "8642"
            - name: WEBHOOK_ENABLED
              value: "true"
            - name: WEBHOOK_PORT
              value: "8644"
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: hermes-alert-webhook
                  key: WEBHOOK_SECRET
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: "1"
          startupProbe:
            httpGet:
              path: /health
              port: gateway
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /health
              port: gateway
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: gateway
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: tmp
              mountPath: /tmp
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: browser
          image: ghcr.io/michaelbrusegard/hermes-browser:sha-0ff1e62d7f3033bff6c8792c7f26aeadffd23822@sha256:823b290e673deb160479f3b1bd2821d4276c7534f32cd5299079c97d6061aa6f
          command:
            - chromium
          args:
            - --headless=new
            - --no-sandbox
            - --disable-gpu
            - --disable-background-networking
            - --disable-component-update
            - --disable-sync
            - --no-first-run
            - --no-default-browser-check
            - --remote-debugging-port=9222
            - --remote-allow-origins=*
            - --user-data-dir=/opt/browser/profile
            - about:blank
          env:
            - name: HOME
              value: /opt/browser
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: "2"
          startupProbe:
            exec:
              command:
                - curl
                - --fail
                - --silent
                - http://127.0.0.1:9222/json/version
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            exec:
              command:
                - curl
                - --fail
                - --silent
                - http://127.0.0.1:9222/json/version
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - curl
                - --fail
                - --silent
                - http://127.0.0.1:9222/json/version
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: browser-profile
              mountPath: /opt/browser
            - name: browser-tmp
              mountPath: /tmp
            - name: browser-shm
              mountPath: /dev/shm
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: bootstrap-config
          configMap:
            name: hermes-agent-bootstrap
        - name: bootstrap-secret
          secret:
            secretName: hermes-agent-env
            items:
              - key: .env
                path: .env
        - name: bootstrap-skills
          configMap:
            name: hermes-agent-skills
        - name: tmp
          emptyDir: {}
        - name: browser-tmp
          emptyDir: {}
        - name: browser-shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: browser-profile
          persistentVolumeClaim:
            claimName: hermes-browser-profile
        - name: kube-api-access
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  expirationSeconds: 3600
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: nvme-ha
