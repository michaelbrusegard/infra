        - name: android-viewer
          image: ghcr.io/michaelbrusegard/hermes-browser:sha-5939edd5716d23f3ec6a6fcf1f7447bddab3c21a@sha256:9dc33dda0606ae13a806abb30d0b84a0796af7f97c9e6b0f27bdf3a71b4894f2
          command:
            - android-viewer
          env:
            - name: ADB_VENDOR_KEYS
              value: /opt/android/adb
            - name: ANDROID_SERIAL
              value: 127.0.0.1:5555
            - name: ANDROID_VIEW_LISTEN
              value: 127.0.0.1:6081
            - name: BROWSER_FILES_ROOT
              value: /opt/browser-files
            - name: HOME
              value: /tmp/home
          ports:
            - containerPort: 6081
              name: android-viewer
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: "2"
          startupProbe:
            exec:
              command:
                - curl
                - --fail
                - --silent
                - http://127.0.0.1:6081/vnc.html
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            exec:
              command:
                - curl
                - --fail
                - --silent
                - http://127.0.0.1:6081/vnc.html
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - bash
                - -ec
                - |
                  curl --fail --silent http://127.0.0.1:6081/vnc.html >/dev/null
                  if grep -q '"state":"disabled"' /opt/android/status/launcher.json 2>/dev/null; then
                    exit 0
                  fi
                  adb connect 127.0.0.1:5555 >/dev/null 2>&1 || true
                  [ "$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]
                  viewer_status=/opt/browser-files/android-viewer/status.json
                  jq -e '.state == "running"' "$viewer_status" >/dev/null
                  if [ "$(jq -r '.backend // "scrcpy"' "$viewer_status")" = "emulator-webrtc" ]; then
                    jq -e '.secure_capture == true' "$viewer_status" >/dev/null
                    viewer_pid=$(jq -er '.viewer_pid | select(type == "number")' "$viewer_status")
                    gateway_pid=$(jq -er '.gateway_pid | select(type == "number")' "$viewer_status")
                    kill -0 "$viewer_pid"
                    kill -0 "$gateway_pid"
                    curl --fail --silent http://127.0.0.1:8080/api/v1/emulator/status >/dev/null
                    curl --fail --silent http://127.0.0.1:9223/json/version >/dev/null
                  else
                    scrcpy_pid=$(jq -er '.scrcpy_pid | select(type == "number")' "$viewer_status")
                    kill -0 "$scrcpy_pid"
                  fi
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: android-data
              mountPath: /opt/android
              readOnly: true
            - name: browser-files
              mountPath: /opt/browser-files
            - name: android-viewer-tmp
              mountPath: /tmp
            - name: android-viewer-shm
              mountPath: /dev/shm
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: Localhost
              localhostProfile: hermes/chromium.json
            capabilities:
              drop:
                - ALL
