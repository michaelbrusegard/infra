apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes-agent
  namespace: hermes-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes-agent
  serviceName: hermes-agent-internal
  template:
    metadata:
      annotations:
        configmap.reloader.stakater.com/reload: hermes-agent-bootstrap,hermes-agent-skills
        secret.reloader.stakater.com/reload: cliproxyapi,hermes-agent-env,hermes-alert-webhook,hindsight,mattermost-integrations,mattermost-outputs,mealie-api
      labels:
        app: hermes-agent
    spec:
      serviceAccountName: hermes-agent
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: bootstrap-config
          image: busybox:1.38.0@sha256:1cfa4e2b09e127b9c4ed43578d3f3c18e7d44ea47b9ea98475c0cbe9086525f8
          command:
            - sh
            - -c
            - |
              mkdir -p /opt/data/workspace
              mkdir -p /opt/data/hindsight /opt/data/skills/mealie /opt/data/skills/cluster-access
              for file in /bootstrap-config/*; do
                [ -f "$file" ] || continue
                [ "$(basename "$file")" = hindsight.json ] && continue
                [ "$(basename "$file")" = mealie-skill.md ] && continue
                install -m 0644 "$file" "/opt/data/$(basename "$file")"
              done
              install -m 0644 /bootstrap-config/hindsight.json /opt/data/hindsight/config.json
              install -m 0644 /bootstrap-config/mealie-skill.md /opt/data/skills/mealie/SKILL.md
              install -m 0644 /bootstrap-skills/cluster-access-skill.md /opt/data/skills/cluster-access/SKILL.md
              if [ -f /opt/data/skills/espresso-cluster/SKILL.md ]; then
                mv /opt/data/skills/espresso-cluster/SKILL.md /opt/data/skills/espresso-cluster/SKILL.md.pvc-backup
              fi
              sed -i "s/__MATTERMOST_ALERTS_CHANNEL_ID__/$MATTERMOST_ALERTS_CHANNEL_ID/g" /opt/data/config.yaml
              sed -i "s/__MATTERMOST_HOME_CHANNEL_ID__/$MATTERMOST_HOME_CHANNEL_ID/g" /opt/data/config.yaml
              sed -i "s/__MATTERMOST_CODE_CHANNEL_ID__/$MATTERMOST_CODE_CHANNEL_ID/g" /opt/data/config.yaml
              sed -i "s/__MATTERMOST_SCRATCHPAD_CHANNEL_ID__/$MATTERMOST_SCRATCHPAD_CHANNEL_ID/g" /opt/data/config.yaml
              install -m 0640 /bootstrap-secret/.env /opt/data/.env
              chown -R 10000:10000 /opt/data
          env:
            - name: MATTERMOST_ALERTS_CHANNEL_ID
              valueFrom:
                secretKeyRef:
                  name: mattermost-outputs
                  key: hermes_alerts_channel_id
            - name: MATTERMOST_HOME_CHANNEL_ID
              valueFrom:
                secretKeyRef:
                  name: mattermost-outputs
                  key: hermes_home_channel_id
            - name: MATTERMOST_CODE_CHANNEL_ID
              valueFrom:
                secretKeyRef:
                  name: mattermost-outputs
                  key: hermes_code_channel_id
            - name: MATTERMOST_SCRATCHPAD_CHANNEL_ID
              valueFrom:
                secretKeyRef:
                  name: mattermost-outputs
                  key: hermes_stateless_channel_ids
          resources:
            requests:
              memory: 16Mi
              cpu: 25m
            limits:
              memory: 32Mi
              cpu: 50m
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: bootstrap-config
              mountPath: /bootstrap-config
            - name: bootstrap-secret
              mountPath: /bootstrap-secret
            - name: bootstrap-skills
              mountPath: /bootstrap-skills
      containers:
        - name: gateway
          image: ghcr.io/michaelbrusegard/hermes-agent:sha-7ca52c5e8d4a9748860fae521b6b118691173b6b@sha256:4732dfc55f9cd9de03b5bdf663c803c905516cf872617477d57bb101fa832566
          args:
            - gateway
            - run
          ports:
            - containerPort: 8642
              name: gateway
            - containerPort: 8644
              name: webhook
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: HOME
              value: /opt/data
            - name: OPENAI_BASE_URL
              value: http://cliproxyapi.cliproxyapi.svc.cluster.local:8317/v1
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cliproxyapi
                  key: API_KEY
            - name: HINDSIGHT_API_URL
              value: http://hindsight.hindsight.svc.cluster.local:8888
            - name: HINDSIGHT_MODE
              value: local_external
            - name: HINDSIGHT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hindsight
                  key: API_KEY
            - name: MATTERMOST_URL
              value: http://mattermost.mattermost.svc.cluster.local:8065
            - name: MATTERMOST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mattermost-integrations
                  key: HERMES_BOT_TOKEN
            - name: MATTERMOST_ALLOWED_USERS
              valueFrom:
                secretKeyRef:
                  name: mattermost-integrations
                  key: HERMES_ALLOWED_USERS
            - name: MATTERMOST_HOME_CHANNEL
              valueFrom:
                secretKeyRef:
                  name: mattermost-outputs
                  key: hermes_home_channel_id
                  optional: true
            - name: MATTERMOST_ALLOWED_CHANNELS
              valueFrom:
                secretKeyRef:
                  name: mattermost-outputs
                  key: hermes_allowed_channel_ids
                  optional: true
            - name: MATTERMOST_FREE_RESPONSE_CHANNELS
              valueFrom:
                secretKeyRef:
                  name: mattermost-outputs
                  key: hermes_free_response_channel_ids
                  optional: true
            - name: MATTERMOST_STATELESS_CHANNELS
              valueFrom:
                secretKeyRef:
                  name: mattermost-outputs
                  key: hermes_stateless_channel_ids
                  optional: true
            - name: MATTERMOST_REPLY_MODE
              value: thread
            - name: MEALIE_URL
              value: http://mealie.mealie.svc.cluster.local:9000
            - name: MEALIE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mealie-api
                  key: API_TOKEN
            - name: SEARXNG_URL
              value: http://searxng.searxng.svc.cluster.local:8080
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: 0.0.0.0
            - name: API_SERVER_PORT
              value: "8642"
            - name: WEBHOOK_ENABLED
              value: "true"
            - name: WEBHOOK_PORT
              value: "8644"
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: hermes-alert-webhook
                  key: WEBHOOK_SECRET
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: "1"
          startupProbe:
            httpGet:
              path: /health
              port: gateway
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /health
              port: gateway
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: gateway
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: dashboard
          image: ghcr.io/michaelbrusegard/hermes-agent:sha-7ca52c5e8d4a9748860fae521b6b118691173b6b@sha256:4732dfc55f9cd9de03b5bdf663c803c905516cf872617477d57bb101fa832566
          args:
            - dashboard
            - --host
            - 0.0.0.0
          ports:
            - containerPort: 9119
              name: dashboard
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: HOME
              value: /opt/data
            - name: GATEWAY_HEALTH_URL
              value: http://127.0.0.1:8642
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 500m
          startupProbe:
            tcpSocket:
              port: dashboard
            periodSeconds: 10
            failureThreshold: 18
          livenessProbe:
            tcpSocket:
              port: dashboard
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: dashboard
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: bootstrap-config
          configMap:
            name: hermes-agent-bootstrap
        - name: bootstrap-secret
          secret:
            secretName: hermes-agent-env
            items:
              - key: .env
                path: .env
        - name: bootstrap-skills
          configMap:
            name: hermes-agent-skills
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: nvme-ha
