apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes-agent
  namespace: hermes-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes-agent
  serviceName: hermes-agent-internal
  template:
    metadata:
      labels:
        app: hermes-agent
    spec:
      serviceAccountName: hermes-agent
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: bootstrap-config
          image: busybox:1.38.0@sha256:1cfa4e2b09e127b9c4ed43578d3f3c18e7d44ea47b9ea98475c0cbe9086525f8
          command:
            - sh
            - -c
            - |
              mkdir -p /opt/data/workspace
              for file in /bootstrap-config/*; do
                [ -f "$file" ] || continue
                install -m 0644 "$file" "/opt/data/$(basename "$file")"
              done
              install -m 0640 /bootstrap-secret/.env /opt/data/.env
              chown -R 10000:10000 /opt/data
          resources:
            requests:
              memory: 16Mi
              cpu: 25m
            limits:
              memory: 32Mi
              cpu: 50m
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: bootstrap-config
              mountPath: /bootstrap-config
            - name: bootstrap-secret
              mountPath: /bootstrap-secret
      containers:
        - name: gateway
          image: ghcr.io/michaelbrusegard/hermes-agent:sha-7c6352d3ab6bf761ac9da509b11aed68bd46a0bc@sha256:eafb7c77eb333ad3b35488b9da8c803a99124aff5c9d17fa51f65babd0b34a7a
          args:
            - gateway
            - run
          ports:
            - containerPort: 8642
              name: gateway
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: 0.0.0.0
            - name: API_SERVER_PORT
              value: "8642"
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: "1"
          startupProbe:
            httpGet:
              path: /health
              port: gateway
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /health
              port: gateway
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: gateway
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /opt/data
        - name: dashboard
          image: ghcr.io/michaelbrusegard/hermes-agent:sha-7c6352d3ab6bf761ac9da509b11aed68bd46a0bc@sha256:eafb7c77eb333ad3b35488b9da8c803a99124aff5c9d17fa51f65babd0b34a7a
          args:
            - dashboard
            - --host
            - 0.0.0.0
            - --insecure
          ports:
            - containerPort: 9119
              name: dashboard
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: GATEWAY_HEALTH_URL
              value: http://127.0.0.1:8642
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 500m
          startupProbe:
            tcpSocket:
              port: dashboard
            periodSeconds: 10
            failureThreshold: 18
          livenessProbe:
            tcpSocket:
              port: dashboard
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: dashboard
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /opt/data
      volumes:
        - name: bootstrap-config
          configMap:
            name: hermes-agent-bootstrap
        - name: bootstrap-secret
          secret:
            secretName: hermes-agent-env
            items:
              - key: .env
                path: .env
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: nvme-ha
