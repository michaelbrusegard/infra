            - --redirect-url=https://android.asgard.michaelbrusegard.com/oauth2/callback
            - --http-address=0.0.0.0:4180
            - --upstream=http://127.0.0.1:6081
            - --email-domain=*
            - --scope=openid profile email
            - --code-challenge-method=S256
            - --skip-provider-button=true
            - --reverse-proxy=true
            - --trusted-proxy-ip=10.42.0.0/16
            - --trusted-proxy-ip=fd42::/56
            - --proxy-websockets=true
            - --cookie-name=__Host-hermes_android
            - --cookie-secure=true
