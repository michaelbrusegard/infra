apiVersion: v1
kind: Namespace
metadata:
  name: hermes-agent
  labels:
    # NetBird transparent routing requires a privileged sidecar. Keep audit and
    # warning checks at baseline so unrelated privilege changes remain visible.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
