apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - backup.yaml
  - rbac.yaml
  - configmap.yaml
  - statefulset.yaml
  - services.yaml
  - network-policy.yaml
  - httproute.yaml

configMapGenerator:
  - name: hermes-agent-skills
    namespace: hermes-agent
    files:
      - cluster-access-skill.md=skills/cluster-access/SKILL.md

generatorOptions:
  disableNameSuffixHash: true
