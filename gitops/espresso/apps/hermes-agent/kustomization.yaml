apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - backup.yaml
  - browser-pvc.yaml
  - browser-files-pvc.yaml
  - rbac.yaml
  - configmap.yaml
  - statefulset.yaml
  - services.yaml
  - network-policy.yaml

configMapGenerator:
  - name: hermes-agent-skills
    namespace: hermes-agent
    files:
      - browser-navigation-skill.md=skills/browser-navigation/SKILL.md
      - cluster-access-skill.md=skills/cluster-access/SKILL.md
      - daily-digest.py=scripts/daily-digest.py
      - jupyter-live-kernel-skill.md=skills/jupyter-live-kernel/SKILL.md

generatorOptions:
  disableNameSuffixHash: true
