apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - backup.yaml
  - android-pvc.yaml
  - browser-pvc.yaml
  - browser-files-pvc.yaml
  - rbac.yaml
  - configmap.yaml
  - statefulset.yaml
  - services.yaml
  - network-policy.yaml

configMapGenerator:
  - name: hermes-agent-skills
    namespace: hermes-agent
    files:
      - android=scripts/android
      - android-companion=scripts/android-companion
      - android-companion.py=scripts/android-companion.py
      - android.py=scripts/android.py
      - android-emulator-launch.sh=scripts/android-emulator-launch.sh
      - android-automation-skill.md=skills/android-automation/SKILL.md
      - browser-support=scripts/browser-support
      - browser-support.py=scripts/browser-support.py
      - browser-navigation-skill.md=skills/browser-navigation/SKILL.md
      - browser-support-skill.md=skills/browser-support/SKILL.md
      - cluster-access-skill.md=skills/cluster-access/SKILL.md
      - daily-digest.py=scripts/daily-digest.py
      - healthlog=scripts/healthlog
      - healthlog.py=scripts/healthlog.py
      - healthlog-skill.md=skills/healthlog/SKILL.md
      - jupyter-live-kernel-skill.md=skills/jupyter-live-kernel/SKILL.md
      - mealie=scripts/mealie
      - mealie.py=scripts/mealie.py
      - mealie-skill.md=skills/mealie/SKILL.md
      - media=scripts/media
      - media.py=scripts/media.py
      - media-skill.md=skills/media/SKILL.md

generatorOptions:
  disableNameSuffixHash: true
