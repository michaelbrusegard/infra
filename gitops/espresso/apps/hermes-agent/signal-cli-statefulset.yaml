apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: signal-cli
  namespace: hermes-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: signal-cli
  serviceName: signal-cli-internal
  template:
    metadata:
      labels:
        app: signal-cli
    spec:
      automountServiceAccountToken: false
      containers:
        - name: signal-cli
          image: registry.gitlab.com/packaging/signal-cli/signal-cli-jre@sha256:b5685682a092428abe9926a8bdb1a97ea945c05fda096148374e7ed2900db121
          command:
            - sh
            - -c
            - exec signal-cli -a "$SIGNAL_ACCOUNT" daemon --http 0.0.0.0:3000
          envFrom:
            - secretRef:
                name: signal-cli-env
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 500m
          readinessProbe:
            httpGet:
              path: /api/v1/check
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/check
              port: http
            periodSeconds: 30
          startupProbe:
            httpGet:
              path: /api/v1/check
              port: http
            periodSeconds: 10
            failureThreshold: 30
          volumeMounts:
            - name: data
              mountPath: /var/lib/signal-cli
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
        storageClassName: nvme-ha
