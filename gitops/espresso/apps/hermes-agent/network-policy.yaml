apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes-agent
  namespace: hermes-agent
spec:
  endpointSelector:
    matchLabels:
      app: hermes-agent
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "4180"
              protocol: TCP
            - port: "4181"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: uptime-kuma
            k8s:app: uptime-kuma
      toPorts:
        - ports:
            - port: "8642"
              protocol: TCP
            - port: "8644"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hermes-agent
      toPorts:
        - ports:
            - port: "8642"
              protocol: TCP
            - port: "5555"
              protocol: TCP
            - port: "8777"
              protocol: TCP
    # kubectl port-forward reaches the same authenticated proxies as the
    # private Gateway routes; the raw noVNC listeners remain pod-local.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "4180"
              protocol: TCP
            - port: "4181"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: alertmanager
      toPorts:
        - ports:
            - port: "8644"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8777"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hermes-agent
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cliproxyapi
            k8s:app: cliproxyapi
      toPorts:
        - ports:
            - port: "8317"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: "/api/v1/.*"
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hindsight
            k8s:app: hindsight
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: mattermost
            k8s:app: mattermost
      toPorts:
        - ports:
            - port: "8065"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: mealie
            k8s:app: mealie
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    # OAuth2 Proxy performs OIDC key, token, and userinfo requests directly
    # against Pocket ID. Browser authorization still uses the public issuer.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: pocket-id
            k8s:app: pocket-id
      toPorts:
        - ports:
            - port: "1411"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: healthlog
            k8s:app: healthlog
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
            k8s:app: hermes-media-api
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # searxng runs with hostNetwork (IPv6 source rotation), so it is reached
    # through the node IPs instead of a pod endpoint
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toCIDRSet:
        - cidr: 10.42.0.0/16
        - cidr: 10.43.0.0/16
        - cidr: 10.0.188.0/24
        - cidr: fd42::/56
        - cidr: fd43::/112
        - cidr: fd7a:115c:a1e0:188::/64
    - toEntities:
        - kube-apiserver
    # The pod's direct default routes are removed after NetBird connects, so
    # world access here carries only traffic emitted through the tunnel.
    - toEntities:
        - world
