apiVersion: v1
kind: Service
metadata:
  name: hermes-agent-internal
  namespace: hermes-agent
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: hermes-agent
  ports:
    - name: gateway
      port: 8642
      targetPort: gateway
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-agent-gateway
  namespace: hermes-agent
spec:
  selector:
    app: hermes-agent
  ports:
    - name: http
      port: 8642
      targetPort: gateway
    - name: webhook
      port: 8644
      targetPort: webhook
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-android
  namespace: hermes-agent
spec:
  publishNotReadyAddresses: true
  selector:
    app: hermes-agent
  ports:
    - name: adb
      port: 5555
      targetPort: android-adb
    - name: companion
      port: 8777
      targetPort: android-companion
    - name: viewer
      port: 6080
      targetPort: android-viewer
