apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-agent-bootstrap
  namespace: hermes-agent
data:
  config.yaml: |
    model:
      provider: openai-api
      default: kimi-k3

    delegation:
      provider: openai-api
      model: kimi-k3

    compression:
      enabled: true
      threshold: 0.50
      target_ratio: 0.20
      protect_last_n: 20

    auxiliary:
      compression:
        provider: openai-api
        model: kimi-k3
      web_extract:
        provider: openai-api
        model: kimi-k3
      vision:
        provider: openai-api
        model: kimi-k3

    memory:
      provider: hindsight
      memory_enabled: true
      user_profile_enabled: true

    security:
      allow_lazy_installs: false

    group_sessions_per_user: true

    agent:
      reasoning_effort: high

    approvals:
      mode: off

    web:
      backend: searxng

    skills:
      disabled:
        - ascii-video
        - audiocraft-audio-generation
        - axolotl
        - baoyu-comic
        - baoyu-infographic
        - claude-code
        - codex
        - dspy
        - evaluating-llms-harness
        - excalidraw
        - fine-tuning-with-trl
        - godmode
        - google-workspace
        - heartmula
        - himalaya
        - ideation
        - linear
        - llama-cpp
        - llm-wiki
        - manim-video
        - minecraft-modpack-server
        - notion
        - obliteratus
        - obsidian
        - openhue
        - p5js
        - pixel-art
        - pokemon-player
        - polymarket
        - popular-web-designs
        - research-paper-writing
        - segment-anything-model
        - serving-llms-vllm
        - songwriting-and-ai-music
        - songsee
        - unsloth
        - weights-and-biases
        - xurl

    terminal:
      backend: local
      cwd: /opt/data/workspace
  hindsight.json: |
    {
      "mode": "local_external",
      "api_url": "http://hindsight.hindsight.svc.cluster.local:8888",
      "bank_id": "hermes",
      "memory_mode": "hybrid",
      "recall_budget": "mid",
      "recall_prefetch_method": "recall",
      "recall_types": "observation,world,experience",
      "auto_recall": true,
      "auto_retain": true,
      "retain_async": true
    }
  mealie-skill.md: |
    ---
    name: mealie
    description: Manage recipes, meal plans, and shopping lists in the private Mealie instance.
    ---

    Use `MEALIE_URL` and `MEALIE_API_TOKEN` with Mealie's REST API. Authenticate
    every request with `Authorization: Bearer $MEALIE_API_TOKEN`. The account is
    intentionally non-admin and may read, create, update, and import recipes;
    manage meal plans; and manage shopping lists. Never attempt administration,
    user management, or permission changes. Discover endpoint schemas from
    `$MEALIE_URL/docs` when needed and use `curl` plus `jq` for requests.
