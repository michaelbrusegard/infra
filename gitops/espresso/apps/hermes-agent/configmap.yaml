apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-agent-bootstrap
  namespace: hermes-agent
data:
  config.yaml: |
    model:
      provider: zai
      default: glm-5.1

    delegation:
      provider: zai
      model: glm-4.5

    compression:
      enabled: true
      threshold: 0.50
      target_ratio: 0.20
      protect_last_n: 20

    auxiliary:
      compression:
        provider: zai
        model: glm-4.5
      web_extract:
        provider: zai
        model: glm-4.5
      vision:
        provider: zai
        model: glm-4.5v

    memory:
      provider: honcho
      memory_enabled: true
      user_profile_enabled: true

    agent:
      reasoning_effort: high

    approvals:
      mode: smart

    web:
      backend: exa

    skills:
      disabled:
        - ascii-video
        - audiocraft-audio-generation
        - axolotl
        - baoyu-comic
        - baoyu-infographic
        - claude-code
        - codex
        - dspy
        - evaluating-llms-harness
        - excalidraw
        - fine-tuning-with-trl
        - godmode
        - google-workspace
        - heartmula
        - himalaya
        - ideation
        - linear
        - llama-cpp
        - llm-wiki
        - manim-video
        - minecraft-modpack-server
        - notion
        - obliteratus
        - obsidian
        - openhue
        - p5js
        - pixel-art
        - pokemon-player
        - polymarket
        - popular-web-designs
        - research-paper-writing
        - segment-anything-model
        - serving-llms-vllm
        - songwriting-and-ai-music
        - songsee
        - unsloth
        - weights-and-biases
        - xurl

    terminal:
      backend: local
      cwd: /opt/data/workspace
  honcho.json: |
    {
      "workspace": "hermes-agent",
      "baseUrl": "http://honcho.hermes-agent.svc.cluster.local:8000"
    }
