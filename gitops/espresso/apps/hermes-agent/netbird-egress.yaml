apiVersion: netbird.io/v1alpha1
kind: SetupKey
metadata:
  name: hermes-agent
  namespace: hermes-agent
spec:
  name: hermes-agent
  allowExtraDnsLabels: true
  autoGroups:
    - name: Hermes Egress
  ephemeral: true
---
apiVersion: netbird.io/v1alpha1
kind: SidecarProfile
metadata:
  name: hermes-egress
  namespace: hermes-agent
spec:
  setupKeyRef:
    name: hermes-agent
  podSelector:
    matchLabels:
      app: hermes-agent
  injectionMode: Sidecar
  containerOverride:
    image: netbirdio/netbird:0.82.0@sha256:eca5b274c635bfbb04ec6724a0712d1146190dd450eea199eeb83916fdd94965
    env:
      - name: NB_SETUP_KEY
        valueFrom:
          secretKeyRef:
            name: setup-key-hermes-agent
            key: setup-key
      - name: NB_MANAGEMENT_URL
        value: https://netbird.asgard.michaelbrusegard.com
      - name: NB_LOG_FILE
        value: console
      - name: NB_DISABLE_PROFILES
        value: "true"
      - name: NB_DISABLE_UPDATE_SETTINGS
        value: "false"
      - name: NB_DISABLE_DNS
        value: "true"
      # Keep system DNS management disabled; expose NetBird's resolver at the
      # fixed loopback address used by the pod's dnsConfig instead.
      - name: NB_DNS_RESOLVER_ADDRESS
        value: 127.0.0.153:53
      - name: NB_FORCE_RELAY
        value: "true"
      - name: NB_HOSTNAME
        value: hermes-agent
      # Ephemeral peers get IP-suffixed primary names; publish a stable alias.
      - name: NB_EXTRA_DNS_LABELS
        value: hermes-agent
      - name: NB_DAEMON_ADDR
        value: unix:///var/run/netbird/netbird.sock
      - name: NB_ENTRYPOINT_SERVICE_TIMEOUT
        value: "0"
