apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: android-viewer
  namespace: hermes-agent
spec:
  parentRefs:
    - name: internal
      namespace: gateway
      sectionName: https
  hostnames:
    - android.asgard.michaelbrusegard.com
  rules:
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /vnc.html
            statusCode: 302
    - backendRefs:
        - name: hermes-android
          port: 6080
