apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: android-viewer
  namespace: hermes-agent
spec:
  parentRefs:
    - name: internal
      namespace: gateway
      sectionName: https
  hostnames:
    - android.asgard.michaelbrusegard.com
  rules:
    - backendRefs:
        - name: hermes-android
          port: 6080
