# Applied apart from the controllers: until k3s has created CoreDNS, the
# partial Deployment cannot be created, and in the controllers' build that
# failure would hold back every other controller.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: coredns
  namespace: flux-system
spec:
  interval: 10m
  path: ./gitops/espresso/infrastructure/controllers/coredns
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
