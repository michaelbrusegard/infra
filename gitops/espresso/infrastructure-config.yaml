apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-config
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
  interval: 10m
  path: ./gitops/espresso/infrastructure/openebs/config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
