apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-secrets
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-controllers
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 10m
  path: ./gitops/espresso/infrastructure
  prune: true
  sourceRef:
    kind: GitRepository
    name: nix-secrets
