apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-secrets
  namespace: flux-system
spec:
  dependsOn:
    - name: apps
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 10m
  path: ./gitops/espresso/apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: nix-secrets
