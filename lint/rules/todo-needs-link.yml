id: todo-needs-link-nix
language: nix
severity: error
message: Add the URL of the upstream issue or PR that unblocks this TODO/FIXME/HACK to the comment.
note: The link is how the next reader checks whether the blocker is gone and the workaround can be removed.
rule:
  kind: comment
  regex: \b(TODO|FIXME|HACK)\b
  not:
    any:
      - regex: https?://
      - precedes:
          kind: comment
          regex: https?://
          stopBy:
            not:
              kind: comment
---
