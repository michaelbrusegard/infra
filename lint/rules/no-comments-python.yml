id: no-comments-python
language: python
severity: error
message: Comments are banned in Python because they go stale. Delete this comment; express its intent in a name, a type or a test, or in a docstring if it documents a public contract.
note: |
  Allowed: a shebang on the first line, and tool directives such as
  `# noqa`, `# type:`, `# pragma`, `# fmt:` and `# ruff:`.
rule:
  kind: comment
  not:
    any:
      - all:
          - regex: '\A#!'
          - nthChild: 1
          - inside:
              kind: module
      - regex: '\A#\s*(noqa\b|type:|pragma\b|fmt:|ruff:|shellcheck\b)'
