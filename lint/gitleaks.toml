[extend]
useDefault = true

[[allowlists]]
description = "Generated by Flux bootstrap"
paths = ['''(^|/)gitops/espresso/flux-system/''']

[[allowlists]]
description = "Stalwart's password hash algorithm name, not a password"
targetRules = ["hashicorp-tf-password"]
condition = "AND"
paths = ['''(^|/)gitops/espresso/tofu/stalwart/main\.tf$''']
regexTarget = "line"
regexes = ['''^\s*password_hash_algorithm\s*=\s*"argon2id"\s*$''']

[[allowlists]]
description = "RFC 6455 sample WebSocket handshake nonce"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==''']
