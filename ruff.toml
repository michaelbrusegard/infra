target-version = "py313"
line-length = 88
indent-width = 4

[lint]
select = [
  "F",
  "E",
  "W",
  "B",
  "SIM",
  "UP",
  "I",
  "C4",
  "RUF",
  "PIE",
  "PGH",
  "PLE",
  "PLW",
  "RET",
  "RSE",
  "FURB",
  "PERF",
  "N",
  "EXE",
  "LOG",
  "G",
  "FLY",
  "ASYNC",
  "TID",
  "ICN",
  "ISC",
  "T10",
  "YTT",
  "DTZ",
  "TC",
  "ERA",
]
ignore = ["E501", "ISC001", "RET503", "FURB162"]

[lint.per-file-ignores]
"gitops/espresso/apps/hermes-agent/plugins/response-polish/__init__.py" = [
  "N999",
]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = false
